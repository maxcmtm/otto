  <script>
    (function () {
      // Frame-local seconds from the real voice:
      // Start 0.00 · website 0.60 · Otto 1.39 · reads 1.41 · colours 2.03 · tone 2.92 · customers 3.87 · competitors 5.18
      // S1 0.00–1.35  headline A rises; the Otto square (72px at 170,765) shrinks into the field's caret;
      //               URL types 0.14→0.90; Read pill arrives 0.60, presses 1.10
      // S2 1.35–2.00  headline swaps to B on "Otto reads"; field lifts to y 560–690; card opens beneath (y 720→1500);
      //               one cobalt scan sweep across the field
      // S3 2.00–5.60  rows land on colours / tone / customers / competitors
      // S4 5.58–6.00  field + headline exit up; card glides to the handoff rect x 90→990, y 600→1500 (held at 6.05)
      const ID = "03-reads";
      const R = document.querySelector('[data-composition-id="' + ID + '"]');
      const q = (s) => R.querySelector(s);
      const qa = (s) => Array.from(R.querySelectorAll(s));

      const tl = gsap.timeline({ paused: true });

      const field = q("#e03-field");
      const sq = q("#e03-sq");
      const btn = q("#e03-btn");
      const card = q("#e03-card");

      // ── S1 · headline A, per word; "website." lands on its cue (0.60) ──
      const wa = qa(".e03-wa");
      [0.0, 0.07, 0.14, 0.52].forEach((t, i) => {
        tl.fromTo(wa[i], { yPercent: 112 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, t);
      });
      // ── S1 · the square becomes the caret: 72px → 44px, left edge fixed at x 134 ──
      tl.fromTo(sq, { scale: 72 / 44 }, { scale: 1, duration: 0.2, ease: "power3.inOut", force3D: false }, 0);

      // URL types one character per step, 0.14 → 0.90; the caret-square rides after the last character
      const chars = qa(".e03-ch");
      const t0 = 0.14;
      const step = (0.9 - t0) / (chars.length - 1);
      chars.forEach((ch, i) => {
        tl.set(ch, { display: "block", immediateRender: false }, t0 + i * step);
      });

      // Read pill arrives at the field's right end on "website"
      tl.fromTo(btn, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", force3D: false }, 0.6);
      // press on 1.10
      tl.to(btn, { scale: 0.94, duration: 0.08, ease: "power2.out", force3D: false }, 1.1);
      tl.fromTo(q("#e03-btn-shade"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, 1.1);
      tl.to(btn, { scale: 1, duration: 0.35, ease: "expo.out", force3D: false }, 1.18);
      tl.to(q("#e03-btn-shade"), { opacity: 0, duration: 0.3, ease: "power2.out" }, 1.18);

      // ── S2 · headline swap on "Otto reads": A exits up through its masks, B rises in ──
      tl.to(wa, { yPercent: -112, duration: 0.22, ease: "power2.in", stagger: 0.02 }, 1.15);
      const wb = qa(".e03-wb");
      [1.39, 1.45, 1.51, 1.57].forEach((t, i) => {
        tl.fromTo(wb[i], { yPercent: 112 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, t);
      });

      // field lifts to the top of the content zone (y 700→560)
      tl.fromTo(field, { y: 0 }, { y: -140, duration: 0.6, ease: "power3.inOut" }, 1.39);

      // one cobalt scan sweep across the field, a faint read-wash trailing it
      const scan = q("#e03-scan");
      const wash = q("#e03-wash");
      tl.fromTo(scan, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 1.42);
      tl.fromTo(scan, { x: 0 }, { x: 900, duration: 0.62, ease: "power3.inOut" }, 1.42);
      tl.fromTo(wash, { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.62, ease: "power3.inOut" }, 1.42);
      tl.to(scan, { opacity: 0, duration: 0.12, ease: "power2.in" }, 2.0);
      tl.to(wash, { opacity: 0, duration: 0.3, ease: "power2.out" }, 2.04);

      // the brand-profile card opens beneath the field (unfolds from behind it)
      tl.fromTo(card, { height: 100 }, { height: 780, duration: 0.9, ease: "expo.out" }, 1.46);
      tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "none" }, 1.46);
      tl.fromTo(
        [q("#e03-title"), q("#e03-note")],
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.06 },
        1.7,
      );

      // ── S3 · rows land on their words ──
      function row(sel, cue, valueTargets, valueFrom, stagger) {
        const r = q(sel);
        tl.fromTo(r.querySelector(".e03-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.out" }, cue);
        tl.fromTo(r.querySelector(".e03-lbl"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, cue);
        tl.fromTo(
          valueTargets,
          Object.assign({ opacity: 0 }, valueFrom),
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out", stagger: stagger, force3D: false },
          cue + 0.06,
        );
      }
      row("#e03-row-col", 2.03, qa("#e03-row-col .e03-sw"), { scale: 0.6, y: 0 }, 0.07);
      row("#e03-row-tone", 2.92, qa("#e03-row-tone .e03-vl"), { y: 24, scale: 1 }, 0);
      row("#e03-row-cust", 3.87, qa("#e03-row-cust .e03-vl"), { y: 24, scale: 1 }, 0.12);
      row("#e03-row-comp", 5.18, qa("#e03-row-comp .e03-chip"), { y: 24, scale: 1 }, 0.07);

      // ── S4 · field and headline exit up; card glides to the handoff rect (y 600→1500) ──
      tl.to(field, { y: -220, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.58);
      tl.to(q("#e03-hl-box"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.58);
      tl.to(card, { y: -120, height: 900, duration: 0.45, ease: "power3.inOut" }, 5.55);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
