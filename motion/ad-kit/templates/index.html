<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <title>__TITLE__</title>
    <script src="__GSAP__"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: __W__px;
        height: __H__px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: __W__px;
        height: __H__px;
        overflow: hidden;
        background: __BG__;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__" data-fps="30">
      <!-- the ad's one idea (a kit style), full length: it keeps living under the end card's entrance -->
      <div
        id="el-scene"
        class="scene"
        data-composition-id="__STYLE__"
        data-composition-src="compositions/__STYLE__.html"
        data-start="0"
        data-duration="__DUR__"
        data-track-index="1"
      ></div>
      <!-- shared end card: product + one line + offer, rises over the scene on a downbeat -->
      <div
        id="el-endcard"
        class="scene"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="__END__"
        data-duration="__ENDDUR__"
        data-track-index="2"
      ></div>
      <!-- one mixed soundtrack: synthesized bed + UI sounds, −14 LUFS (audio/score.py) -->
      <audio id="el-soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="__DUR__" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
