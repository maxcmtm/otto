<template>
  <!-- Otto ad-kit · shared end card — rises over the scene like a sheet on a downbeat: one line (with one accent
       phrase), the product (pack + optional single unit), one offer line, optional fine print / legal line.
       No buttons: the platform's own CTA button does the clicking. -->
  <script src="__GSAP__"></script>
  <style>
    @font-face {
      font-family: "AdKit Brand";
      src: url("assets/fonts/brand.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "AdKit UI";
      src: url("assets/fonts/ui.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    #root {
      /*@TOKENS*/
      position: absolute;
      inset: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #ec-panel {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: var(--ad-ground);
      border-radius: 64px 64px 0 0;
      box-shadow: 0 -24px 90px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }
    #ec-logo {
      position: absolute;
      display: block;
    }
    #ec-head {
      position: absolute;
      left: 70px;
      right: 70px;
      text-align: center;
      font-family: "AdKit Brand", sans-serif;
      font-weight: 800;
      letter-spacing: var(--brand-track);
      line-height: 1.02;
      color: var(--ad-on);
    }
    .ec-mask {
      display: inline-block;
      vertical-align: top;
      overflow: hidden;
      padding: 0.08em 0.05em 0.16em;
      margin: -0.08em -0.05em -0.16em;
    }
    .ec-word {
      display: inline-block;
    }
    .ec-hi {
      color: var(--ad-hi);
    }
    #ec-products {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
    .ec-shadow {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.26);
      filter: blur(22px);
    }
    .ec-prod {
      position: absolute;
      display: block;
    }
    #ec-sub {
      position: absolute;
      left: 70px;
      right: 70px;
      text-align: center;
      font-family: "AdKit Brand", sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ad-on);
      text-wrap: balance;
    }
    #ec-fine {
      position: absolute;
      left: 90px;
      right: 90px;
      text-align: center;
      font-family: "AdKit UI", sans-serif;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ad-sub);
      opacity: 0.8;
    }
    #ec-legal {
      position: absolute;
      left: 110px;
      right: 110px;
      text-align: center;
      font-family: "AdKit UI", sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: 1.3;
      color: var(--ad-sub);
      opacity: 0.7;
    }
  </style>

  <div id="root" data-composition-id="endcard" data-width="__W__" data-height="__H__" data-duration="__DUR__">
    <div id="ec-panel">
      <div id="ec-products" data-layout-allow-overflow></div>
      <div id="ec-head"></div>
      <div id="ec-sub"></div>
      <div id="ec-fine"></div>
      <div id="ec-legal"></div>
    </div>
  </div>

  <script>
    (function () {
      var D = /*@DATA*/null;
      var ID = "endcard";
      var $ = function (id) {
        return document.getElementById(id);
      };
      var IR = { immediateRender: false };

      function fontsReady() {
        try {
          if (document.fonts && document.fonts.load) {
            return Promise.all([document.fonts.load('800 90px "AdKit Brand"'), document.fonts.load('700 40px "AdKit Brand"'), document.fonts.load('500 26px "AdKit UI"')]).catch(function () {});
          }
        } catch (e) {}
        return Promise.resolve();
      }

      function build() {
        var E = D.endcard || {};
        var W = D.fmt.w;
        var H = D.fmt.h;
        var tall = H >= 1600;
        // layout per canvas (9:16 story/reel · 4:5 feed · 1:1)
        var L = tall
          ? { head: 252, headSize: 124, packH: 700, packCy: 1000, unitH: 420, sub: 1452, subSize: 42, fineSize: 27 }
          : H >= 1300
            ? { head: 96, headSize: 100, packH: 560, packCy: 704, unitH: 330, sub: 1056, subSize: 38, fineSize: 24 }
            : { head: 60, headSize: 84, packH: 430, packCy: 540, unitH: 250, sub: 826, subSize: 34, fineSize: 22 };
        // optional logo above the headline (for brands whose pack doesn't carry a readable wordmark)
        var logo = null;
        if (E.logo && D.assets[E.logo]) {
          var la = D.assets[E.logo];
          var lh = tall ? 66 : 52;
          var lw = (lh * la.w) / la.h;
          logo = document.createElement("img");
          logo.id = "ec-logo";
          logo.src = la.src;
          logo.alt = "";
          logo.style.height = lh + "px";
          logo.style.width = lw + "px";
          logo.style.left = (W - lw) / 2 + "px";
          logo.style.top = L.head + "px";
          $("ec-panel").appendChild(logo);
          L.head += lh + 40;
        }

        // headline: explicit lines (≤ 2; a break after punctuation wins; shrinks until it fits), words masked for the
        // reveal, the accent phrase marked
        var head = $("ec-head");
        head.style.top = L.head + "px";
        var text = E.headline || "";
        var words0 = text.split(" ");
        var maxW = W - 150;
        var probe = document.createElement("span");
        probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
        head.appendChild(probe);
        var mw = function (t) {
          probe.textContent = t;
          return probe.offsetWidth;
        };
        function best2() {
          var best = null;
          for (var k = 1; k < words0.length; k++) {
            var a1 = mw(words0.slice(0, k).join(" "));
            var b1 = mw(words0.slice(k).join(" "));
            var m = Math.max(a1, b1) * (/[.,?!:;]$/.test(words0[k - 1]) ? 0.8 : 1);
            if (a1 <= maxW && b1 <= maxW && (!best || m < best.m)) best = { k: k, m: m };
          }
          return best ? [words0.slice(0, best.k).join(" "), words0.slice(best.k).join(" ")] : null;
        }
        var size = L.headSize;
        var lines = null;
        for (var tries = 0; tries < 12 && !lines; tries++) {
          head.style.fontSize = size + "px";
          if (mw(text) <= maxW) {
            lines = words0.length >= 4 && mw(text) > maxW * 0.62 ? best2() || [text] : [text];
          } else {
            lines = best2();
          }
          if (!lines) size = Math.round(size * 0.93);
        }
        if (!lines) lines = [text];
        head.removeChild(probe);
        var acc = E.accent ? text.indexOf(E.accent) : -1;
        var words = [];
        var pos = 0;
        lines.forEach(function (ln) {
          var row = document.createElement("div");
          ln.split(" ").forEach(function (w, i) {
            var start = text.indexOf(w, pos);
            pos = start + w.length;
            var m = document.createElement("span");
            m.className = "ec-mask";
            var s = document.createElement("span");
            s.className = "ec-word" + (acc > -1 && start >= acc && start < acc + E.accent.length ? " ec-hi" : "");
            s.textContent = w;
            m.appendChild(s);
            if (i) row.appendChild(document.createTextNode(" "));
            row.appendChild(m);
            words.push(s);
          });
          head.appendChild(row);
        });
        // if the headline runs long, the product block moves down to keep its breathing room
        var dy = Math.max(0, L.head + head.offsetHeight + (tall ? 60 : 40) - (L.packCy - L.packH / 2));
        L.packCy += dy;
        L.sub += dy;

        // products: the pack in the middle, the single unit leaning in front of it (optional)
        var prods = $("ec-products");
        var P = (E.products || []).filter(function (k) {
          return D.assets[k];
        });
        var items = [];
        P.forEach(function (key, i) {
          var a = D.assets[key];
          var h = i === 0 ? L.packH : L.unitH;
          var w = (h * a.w) / a.h;
          var cx = P.length > 1 ? (i === 0 ? W * 0.43 : W * 0.7) : W / 2;
          var cy = i === 0 ? L.packCy : L.packCy + L.packH * 0.5 - h * 0.5 + (tall ? 30 : 20);
          var sh = document.createElement("div");
          sh.className = "ec-shadow";
          sh.style.left = cx - w * 0.42 + "px";
          sh.style.top = cy + h / 2 - 22 + "px";
          sh.style.width = w * 0.84 + "px";
          sh.style.height = "44px";
          var img = document.createElement("img");
          img.className = "ec-prod";
          img.id = "ec-prod-" + i;
          img.src = a.src;
          img.alt = "";
          img.style.left = cx - w / 2 + "px";
          img.style.top = cy - h / 2 + "px";
          img.style.width = w + "px";
          img.style.height = h + "px";
          img.style.filter = "drop-shadow(0 30px 50px rgba(0,0,0,0.22))";
          var grp = document.createElement("div");
          grp.style.position = "absolute";
          grp.style.inset = "0";
          grp.appendChild(sh);
          grp.appendChild(img);
          prods.appendChild(grp);
          items.push({ grp: grp, img: img, shadow: sh, cx: cx, cy: cy });
        });

        var sub = $("ec-sub");
        sub.textContent = E.sub || "";
        sub.style.top = L.sub + "px";
        sub.style.fontSize = L.subSize + "px";
        var fine = $("ec-fine");
        fine.textContent = E.fine || "";
        fine.style.top = L.sub + sub.offsetHeight + 16 + "px";
        fine.style.fontSize = L.fineSize + "px";
        var legal = $("ec-legal");
        legal.textContent = E.legal || "";
        legal.style.top = L.sub + sub.offsetHeight + (E.fine ? fine.offsetHeight + 30 : 22) + "px";

        // ── starting states ──
        var panel = $("ec-panel");
        gsap.set(panel, { y: H, borderRadius: "64px 64px 0px 0px" });
        gsap.set(words, { yPercent: 115 });
        items.forEach(function (it, i) {
          gsap.set(it.img, { y: i ? 160 : 280, x: i ? 260 : 0, rotation: i ? 24 : 0, scale: i ? 1 : 0.9, opacity: 0, transformOrigin: "50% 60%" });
          gsap.set(it.shadow, { opacity: 0, scaleX: 0.5, transformOrigin: "50% 50%" });
        });
        gsap.set(prods, { scale: 1, transformOrigin: "50% 55%" });
        gsap.set([sub, fine, legal], { y: 18, opacity: 0 });
        if (logo) gsap.set(logo, { y: 14, opacity: 0 });

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(panel, { y: H }, Object.assign({ y: 0, duration: 0.62, ease: "power3.out" }, IR), 0);
        tl.fromTo(panel, { borderRadius: "64px 64px 0px 0px" }, Object.assign({ borderRadius: "0px 0px 0px 0px", duration: 0.5, ease: "power2.out" }, IR), 0.2);

        items.forEach(function (it, i) {
          var at = i ? 0.34 : 0.16;
          tl.fromTo(it.img, { opacity: 0 }, Object.assign({ opacity: 1, duration: 0.2, ease: "none" }, IR), at);
          if (i) {
            tl.fromTo(it.img, { x: 260, y: 160, rotation: 24 }, Object.assign({ x: 0, y: 0, rotation: 8, duration: 0.85, ease: "expo.out" }, IR), at);
          } else {
            tl.fromTo(it.img, { y: 280, scale: 0.9 }, Object.assign({ y: 0, scale: 1, duration: 0.9, ease: "expo.out" }, IR), at);
          }
          tl.fromTo(it.shadow, { opacity: 0, scaleX: 0.5 }, Object.assign({ opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, IR), at + 0.12);
        });
        words.forEach(function (w, i) {
          tl.fromTo(w, { yPercent: 115 }, Object.assign({ yPercent: 0, duration: 0.6, ease: "expo.out" }, IR), 0.28 + i * 0.055);
        });
        if (logo) tl.fromTo(logo, { y: 14, opacity: 0 }, Object.assign({ y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, IR), 0.26);
        tl.fromTo(sub, { y: 18, opacity: 0 }, Object.assign({ y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, IR), 0.8);
        tl.fromTo([fine, legal], { y: 18, opacity: 0 }, Object.assign({ y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, IR), 0.95);
        // a slow push on the product for the held read
        tl.fromTo(prods, { scale: 1 }, Object.assign({ scale: 1.035, duration: Math.max(0.5, D.duration - 0.9), ease: "sine.inOut" }, IR), 0.9);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }

      fontsReady().then(build, build);
    })();
  </script>
</template>
