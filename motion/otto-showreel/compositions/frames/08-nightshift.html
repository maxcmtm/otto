            ["#f08-g2", { autoAlpha: 0 }],
            ["#f08-bullet", { scale: 1 }],
            ["#f08-v0", { yPercent: 0 }],
            [["#f08-v1a", "#f08-v1b", "#f08-v2a", "#f08-v2b"], { yPercent: 115 }],

            [".f08-name", { color: "#A1A1A6" }],

            tl.fromTo("#f08-bullet", { scale: 1 }, { scale: 1.12, duration: 0.12, ease: "expo.out", immediateRender: false }, t);

          tl.fromTo("#f08-v0", { yPercent: 0 }, { yPercent: -115, duration: 0.2, ease: "power2.in", immediateRender: false }, 0);
          tl.fromTo("#f08-v1a", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, SWAP_IN);
          tl.fromTo("#f08-v1b", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, SWAP_IN + 0.06);
          for (var c = 0; c < 4; c++) {
            tl.fromTo(
              "#f08-c" + c,
              { opacity: 0, y: 40 },
              { opacity: 1, y: 0, duration: 0.7, ease: "expo.out", immediateRender: false },
              c * 0.05,
            );
          }

          // ── 0.5 / 1.0 / 1.5 / 2.0: one card lights and its finding types in ──
          for (var j = 0; j < 4; j++) {
            var a = 0.5 + j * 0.5;
            var card = "#f08-c" + j;
            tl.fromTo(card, { borderColor: HAIR }, { borderColor: LIT, duration: 0.15, ease: "expo.out", immediateRender: false }, a);
            tl.fromTo("#f08-nm" + j, { color: "#A1A1A6" }, { color: "#F5F5F7", duration: 0.2, ease: "expo.out", immediateRender: false }, a);
            tl.fromTo(
              "#f08-av" + j,
              { backgroundColor: "rgba(255, 255, 255, 0.06)", color: "#A1A1A6" },
              { backgroundColor: "rgba(91, 117, 255, 0.16)", color: LIT, duration: 0.2, ease: "expo.out", immediateRender: false },
              a,
            );
            tl.fromTo("#f08-sk" + j, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, a);

            var ch = finds[j];
            var step = 0.36 / ch.length;
            for (var q = 0; q < ch.length; q++) {
              var tq = a + 0.04 + q * step;
              tl.set(ch[q], { opacity: 1, boxShadow: CARET_ON }, tq);
              if (q > 0) tl.set(ch[q - 1], { boxShadow: CARET_OFF }, tq);
            }
            // the card hands the scan on at the next beat: hairline back to neutral, caret gone
            tl.set(ch[ch.length - 1], { boxShadow: CARET_OFF }, a + 0.5);
            tl.fromTo(card, { borderColor: LIT }, { borderColor: HAIR, duration: 0.3, ease: "power3.inOut", immediateRender: false }, a + 0.5);
          }

          // ── 2.5: reading done — the grid glides up to make room ──
          tl.fromTo("#f08-dossier", { y: 0 }, { y: -46, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 2.5);

          // ── 3.0: the result pill slides up under the grid; 3.5 its check draws ──
          tl.fromTo("#f08-pill", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, 3.0);
          tl.fromTo("#f08-pcheck", { strokeDashoffset: 16 }, { strokeDashoffset: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, 3.5);

          // ── 4.0: verb swap → “While you sleep.”; dossier exits up, the phone rises from below ──
          tl.fromTo(["#f08-v1a", "#f08-v1b"], { yPercent: 0 }, { yPercent: -115, duration: 0.2, ease: "power2.in", immediateRender: false }, 4.0);
          tl.fromTo("#f08-v2a", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 4.0 + SWAP_IN);
          tl.fromTo("#f08-v2b", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 4.0 + SWAP_IN + 0.06);

          // dossier leaves bottom-first, as if lifted by the rising phone (pill 4.0, lower row 4.02, upper row 4.04)
          tl.fromTo("#f08-pill", { opacity: 1, y: 0 }, { opacity: 0, y: -40, duration: 0.22, ease: "power2.in", immediateRender: false }, 4.0);
          [2, 3, 0, 1].forEach(function (ci, idx) {
            tl.fromTo(
              "#f08-c" + ci,
              { opacity: 1, y: 0 },
              { opacity: 0, y: -40, duration: 0.22, ease: "power2.in", immediateRender: false },
              4.02 + Math.floor(idx / 2) * 0.02,
            );
          });
          tl.set("#f08-g1", { autoAlpha: 0 }, 4.3);

          tl.set("#f08-g2", { autoAlpha: 1 }, 4.0);
          tl.fromTo("#f08-phone", { y: 980 }, { y: 0, duration: 0.9, ease: "expo.out", immediateRender: false }, 4.08);

          // ── 4.5 / 5.0 / 5.5 / 6.0: notifications drop in on top, the stack pushes down ──
          for (var n = 0; n < 4; n++) {
            var tn = 4.5 + n * 0.5;
            for (var o = 0; o < n; o++) {
              tl.fromTo(
                "#f08-n" + o,
                { y: (n - 1 - o) * PITCH },
                { y: (n - o) * PITCH, duration: 0.45, ease: "power3.inOut", immediateRender: false },
                tn,
              );
            }
            tl.fromTo(
              "#f08-n" + n,
              { opacity: 0, y: -28, scale: 0.94 },
              { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out", immediateRender: false },
              tn,
            );
          }

          // ── 6.5: slow push-in on the phone, into the wipe ──
          tl.fromTo("#f08-phone", { scale: 1 }, { scale: 1.04, duration: 1.0, ease: "power3.inOut", immediateRender: false }, 6.5);

          // ── 7.0: the verb and the bullet exit ──
          tl.fromTo("#f08-v2a", { yPercent: 0 }, { yPercent: -115, duration: 0.3, ease: "power2.in", immediateRender: false }, 7.0);
          tl.fromTo("#f08-v2b", { yPercent: 0 }, { yPercent: -115, duration: 0.3, ease: "power2.in", immediateRender: false }, 7.04);
          tl.fromTo("#f08-bullet", { scale: 1 }, { scale: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 7.0);

          // ── 7.5 → 8.0: the lock screen brightens, light floods out from the phone; the square lands at rest ──
          tl.fromTo("#f08-dawn", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power2.in", immediateRender: false }, 7.5);
          tl.set("#f08-light", { autoAlpha: 1 }, 7.5);
          tl.fromTo(
            "#f08-light",
            { clipPath: "circle(0px at " + PX + "px " + PY + "px)" },
            { clipPath: "circle(" + R_END + "px at " + PX + "px " + PY + "px)", duration: 0.5, ease: "power2.in", immediateRender: false },
            7.5,
          );
          tl.fromTo("#f08-sq", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, 7.5);

          window.__timelines = window.__timelines || {};
          window.__timelines["08-nightshift"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
