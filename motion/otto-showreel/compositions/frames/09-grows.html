      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          var PALE = "#D9DEF9";
          var FAINT = "#86868B";
          var L = [360, 553.333, 746.667, 940]; // bar left edges (zone x 360→1060)
          var H = [0.46, 0.63, 0.81, 1.0].map(function (v) {
            return v * 520; // max bar height 520 on baseline y 860
          });
          function radius(tl_, tgt, tlv, trv, brv, blv, dur, ease, at) {
            tl_.to(
              tgt,
              {
                borderTopLeftRadius: tlv,
                borderTopRightRadius: trv,
                borderBottomRightRadius: brv,
                borderBottomLeftRadius: blv,
                duration: dur,
                ease: ease,
              },
              at,
            );
          }

          /* ── group windows (0 ms swaps; g1 held to 4.35 so its 0.25 s exit can play) ── */
          tl.set("#f09-g2", { autoAlpha: 1 }, 4.0);
          tl.set("#f09-g1", { autoAlpha: 0 }, 4.35);

          /* ════════ g1 · 0.0–4.0 ════════ */

          // 0.0 headline rises word by word from masks
          tl.fromTo(
            "#f09-h1 .f09-w",
            { yPercent: 120 },
            { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.05 },
            0,
          );

          // 0.0 the square (120px at 960,540) travels to the chart baseline and becomes the Aug bar
          tl.fromTo(
            "#f09-bar1",
            { x: 540, y: -260 },
            { x: 0, y: 0, duration: 0.65, ease: "power3.inOut" },
            0,
          );
          radius(tl, "#f09-bar1", 14, 14, 4, 4, 0.65, "power3.inOut", 0);
          tl.fromTo("#f09-ring", { opacity: 0.95 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 0.15);
          tl.fromTo(
            "#f09-bar1",
            { height: 120 },
            { height: H[0], duration: 0.5, ease: "expo.out" },
            0.5,
          );
          tl.fromTo("#f09-base", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "expo.out" }, 0.5);
          tl.fromTo(
            "#f09-lbl1",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" },
            0.55,
          );

          // 1.0 / 2.0 / 3.0 — each new month splits off the previous bar and rises;
          // the cobalt (the square) always sits on the newest month, past months go pale
          for (var i = 1; i < 4; i++) {
            var at = i;
            var bar = "#f09-bar" + (i + 1);
            tl.set(bar, { autoAlpha: 1 }, at);
            tl.fromTo(
              bar,
              { x: L[i - 1] - L[i], height: H[i - 1] },
              { x: 0, height: H[i], duration: 0.8, ease: "expo.out", immediateRender: false },
              at,
            );
            tl.to("#f09-bar" + i, { backgroundColor: PALE, duration: 0.5, ease: "power2.inOut" }, at);
            tl.fromTo(
              "#f09-lbl" + (i + 1),
              { opacity: 0, y: 10 },
              { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" },
              at + 0.15,
            );
          }

          // 1.0 / 2.0 / 3.0 — metrics count up
          var MET = [22, 180, 31];
          for (var k = 0; k < 3; k++) {
            var t0 = 1 + k;
            tl.fromTo(
              "#f09-m" + (k + 1),
              { opacity: 0, y: 24 },
              { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" },
              t0,
            );
            tl.fromTo(
              "#f09-n" + (k + 1),
              { innerText: 0 },
              { innerText: MET[k], snap: { innerText: 1 }, duration: 1.0, ease: "power3.out" },
              t0,
            );
            tl.fromTo(
              "#f09-p" + (k + 1),
              { opacity: 0, scale: 0.6 },
              { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" },
              t0 + 0.25,
            );
          }
          tl.fromTo("#f09-foot", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "expo.out" }, 1.0);

          // 4.0 chart, metrics and headline exit
          tl.to("#f09-h1", { y: -30, opacity: 0, duration: 0.25, ease: "power2.in" }, 4.0);
          tl.to(["#f09-chart", "#f09-metrics"], { y: -40, opacity: 0, duration: 0.25, ease: "power2.in" }, 4.0);

          /* ════════ g2 · 4.0–8.0 ════════ */

          // headline swap
          tl.fromTo(
            "#f09-h2 .f09-w",
            { yPercent: 120 },
            { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.05 },
            4.2,
          );

          // 4.0 / 4.5 / 5.0 cost cards stack in (the first one waits 0.2 s for the chart to clear)
          var CARDS = ["#f09-c1", "#f09-c2", "#f09-c3"];
          var CARD_AT = [4.2, 4.5, 5.0];
          for (var c = 0; c < 3; c++) {
            tl.fromTo(
              CARDS[c],
              { opacity: 0, y: 60 },
              { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" },
              CARD_AT[c],
            );
          }

          // 6.0 cobalt strike-through draws across all three (0.4 s, stagger 0.08 s)
          for (var s = 0; s < 3; s++) {
            var ts = 6.0 + 0.08 * s;
            tl.fromTo(
              "#f09-s" + (s + 1),
              { scaleX: 0 },
              { scaleX: 1, duration: 0.4, ease: "expo.out" },
              ts,
            );
            tl.to("#f09-c" + (s + 1) + " .f09-ct", { color: FAINT, duration: 0.3, ease: "power2.out" }, ts);
          }

          // 6.5 fold: outer cards slide into the middle one, which grows into the Otto card (settled 7.0)
          tl.to(
            ["#f09-ci1", "#f09-ci2", "#f09-ci3", "#f09-s1", "#f09-s2", "#f09-s3"],
            { opacity: 0, duration: 0.22, ease: "power2.in" },
            6.5,
          );
          tl.set("#f09-c2", { zIndex: 4 }, 6.5);
          tl.to("#f09-c1", { y: 140, scaleX: 0.94, duration: 0.5, ease: "power3.inOut" }, 6.5);
          tl.to("#f09-c3", { y: -140, scaleX: 0.94, duration: 0.5, ease: "power3.inOut" }, 6.5);
          tl.to(["#f09-c1", "#f09-c3"], { opacity: 0, duration: 0.15, ease: "power2.in" }, 6.85);
          tl.to("#f09-c2", { top: 430, height: 220, duration: 0.5, ease: "power3.inOut" }, 6.5);
          tl.fromTo(
            "#f09-mark",
            { x: -420, scale: 0, opacity: 0 },
            { x: -420, scale: 0.6, opacity: 1, duration: 0.5, ease: "expo.out" },
            6.6,
          );
          tl.fromTo(
            "#f09-otto",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" },
            6.65,
          );

          // 7.5 the Otto card collapses into the square at centre; headline exits; square at rest by 7.93
          tl.to("#f09-h2", { y: -30, opacity: 0, duration: 0.25, ease: "power2.in" }, 7.5);
          tl.to("#f09-otto", { opacity: 0, duration: 0.2, ease: "power2.in" }, 7.5);
          tl.to(
            "#f09-c2",
            { left: 900, width: 120, top: 480, height: 120, duration: 0.4, ease: "power3.in" },
            7.5,
          );
          radius(tl, "#f09-c2", 36, 36, 36, 36, 0.4, "power3.in", 7.5);
          tl.to("#f09-c2", { opacity: 0, duration: 0.15, ease: "power2.in" }, 7.75);
          tl.to("#f09-mark", { x: 0, scale: 1, duration: 0.43, ease: "power3.inOut" }, 7.5);

          window.__timelines["09-grows"] = tl;
          tl.seek(0);
        })();
      </script>
