        /* ── g1: the month's posts wall (8×3, tiles 180×225, radius 12) ── */

          position: absolute;
          width: 180px;
          height: 225px;
          perspective: 900px;
          transform-origin: 50% 50%;

        .f10-card {
          position: absolute;
          inset: 0;

        .f10-face {

          overflow: hidden;

          height: 120px;
          border-radius: 36px;

      <script>
        (function () {
          // Frame-local seconds (track second − 50.0).
          // g1  0.0 burst · 0.5 / 1.0 / 1.5 flips · 2.0→2.5 collapse
          // g2  2.5 stamp + wordmark · 3.0 tagline · 4.0 / 4.5 / 5.0 facts · 6.0 CTA, offer, legal · 8.0 final stamp
          var ID = "10-finale";
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById(id); };

          var COLS = 8, ROWS = 3, N = COLS * ROWS;
          var CX = 960, CY = 540; // the square's centre (handoff_in)
          var tiles = [];
          var dMax = 0;
          for (var i = 0; i < N; i++) {
            var c = i % COLS, r = Math.floor(i / COLS);
            var left = 170 + c * 200, top = 427 + (r - 1) * 245;
            var dx = CX - (left + 90), dy = CY - (top + 112.5);
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d > dMax) dMax = d;
            tiles.push({ el: $("f10-t" + i), card: $("f10-c" + i), c: c, r: r, dx: dx, dy: dy, d: d });
          }

          // ── initial state (t = 0 matches frame 9's last frame: square alone at (960,540), 120px) ──
          tl.set("#f10-g1", { autoAlpha: 1, immediateRender: true }, 0);
          tl.set("#f10-g2", { autoAlpha: 0, immediateRender: true }, 0);
          tl.set("#f10-lock", { scale: 1, immediateRender: true }, 0);
          tl.set("#f10-mark", { x: 0, y: 0, scale: 1, force3D: false, immediateRender: true }, 0);
          tl.set("#f10-wm", { xPercent: -105, immediateRender: true }, 0);
          tl.set("#f10-tag-in", { yPercent: 110, immediateRender: true }, 0);
          tl.set(["#f10-fact0", "#f10-fact1", "#f10-fact2", "#f10-offer-in"], { yPercent: 110, immediateRender: true }, 0);
          tl.set(["#f10-dot1", "#f10-dot2"], { scale: 0, immediateRender: true }, 0);
          tl.set("#f10-cta", { opacity: 0, y: 28, scale: 0.94, immediateRender: true }, 0);
          tl.set("#f10-legal-in", { opacity: 0, immediateRender: true }, 0);
          tl.set("#f10-ring", { attr: { "stroke-dashoffset": 0 }, immediateRender: true }, 0);
          tl.set(tiles.map(function (t) { return t.card; }), { rotationY: 0, immediateRender: true }, 0);

          // ── g1 · 0.0 (crash): 24 posts burst out of the square into the wall, nearest first ──
          tiles.forEach(function (t) {
            tl.fromTo(
              t.el,
              { x: t.dx, y: t.dy, scale: 0.3 },
              { x: 0, y: 0, scale: 1, duration: 0.55, ease: "expo.out" },
              (t.d / dMax) * 0.12
            );
          });
          // The square floats above the wall while it is up.
          tl.fromTo(
            "#f10-mark",
            { boxShadow: "0px 2px 6px rgba(0,0,0,0), 0px 40px 90px rgba(0,0,0,0)" },
            { boxShadow: "0px 2px 6px rgba(0,0,0,0.06), 0px 40px 90px rgba(0,0,0,0.18)", duration: 0.5, ease: "expo.out" },
            0
          );

          // ── g1 · 0.5 / 1.0 / 1.5: a third of the wall flips to another post on each beat (diagonal thirds) ──
          [0.5, 1.0, 1.5].forEach(function (at, k) {
            tiles.forEach(function (t) {
              if ((t.c + t.r) % 3 !== k) return;
              tl.fromTo(
                t.card,
                { rotationY: 0 },
                { rotationY: 180, duration: 0.4, ease: "power3.inOut", immediateRender: false },
                at + t.c * 0.012
              );
            });
          });

          // ── g1 · 2.0→2.5: every tile collapses back into the square (farthest first, all home by 2.5) ──
          tiles.forEach(function (t) {
            tl.fromTo(
              t.el,
              { x: 0, y: 0, scale: 1 },
              { x: t.dx, y: t.dy, scale: 0.3, duration: 0.4, ease: "power3.in", immediateRender: false },
              2.0 + (1 - t.d / dMax) * 0.08
            );
          });
          tl.fromTo(
            "#f10-mark",
            { boxShadow: "0px 2px 6px rgba(0,0,0,0.06), 0px 40px 90px rgba(0,0,0,0.18)" },
            { boxShadow: "0px 2px 6px rgba(0,0,0,0), 0px 40px 90px rgba(0,0,0,0)", duration: 0.4, ease: "power2.in", immediateRender: false },
            2.1
          );

          // ── 2.5: group cut g1 → g2 (0 ms) ──
          tl.set("#f10-g1", { autoAlpha: 0 }, 2.5);
          tl.set("#f10-g2", { autoAlpha: 1 }, 2.5);

          // ── g2 · 2.5: the square stamps and slides (expo.out 0.6, as in frame 2) to the
          //    lockup centre (777,470); the wordmark wipes out of the mask at x=873 from behind it ──
          //    Same stamp as frame 2: 1→1.18 in 3 frames, then 1.18→1 expo.out 0.6.
          tl.fromTo("#f10-mark", { scale: 1 }, { scale: 1.18, duration: 0.1, ease: "power2.out", force3D: false, immediateRender: false }, 2.5);
          tl.fromTo("#f10-mark", { scale: 1.18 }, { scale: 1, duration: 0.6, ease: "expo.out", force3D: false, immediateRender: false }, 2.6);
          tl.fromTo("#f10-mark", { x: 0, y: 0 }, { x: -183, y: -70, duration: 0.6, ease: "expo.out", force3D: false, immediateRender: false }, 2.5);
          tl.fromTo("#f10-wm", { xPercent: -105 }, { xPercent: 0, duration: 0.8, ease: "expo.out", immediateRender: false }, 2.5);

          // ── g2 · 3.0: tagline rises from its mask ──
          tl.fromTo("#f10-tag-in", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "expo.out", immediateRender: false }, 3.0);

          // ── g2 · 4.0 / 4.5 / 5.0: the three facts, one per beat, cobalt dots between ──
          [4.0, 4.5, 5.0].forEach(function (at, k) {
            tl.fromTo("#f10-fact" + k, { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, at);
            if (k > 0) {
              tl.fromTo("#f10-dot" + k, { scale: 0 }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, at);
            }
          });

          // ── g2 · 6.0: call to action, offer line and legal line ──
          tl.fromTo("#f10-cta", { opacity: 0, y: 28, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, 6.0);
          tl.fromTo("#f10-offer-in", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, 6.0);
          tl.fromTo("#f10-legal-in", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "expo.out", immediateRender: false }, 6.0);

          // ── g2 · 8.0 (impact): one final stamp of the lockup; the square's inner outline re-draws; still from 8.5 ──
          tl.fromTo("#f10-lock", { scale: 1.03 }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 8.0);
          tl.fromTo(
            "#f10-ring",
            { attr: { "stroke-dashoffset": 102 } },
