      <script>
        (function () {
          var root = document.querySelector('#stage[data-composition-id="05-makes"]') || document;
          function q(s) { return root.querySelector(s); }
          function qa(s) { return Array.prototype.slice.call(root.querySelectorAll(s)); }

          var g1 = q("#f05-g1"), g2 = q("#f05-g2");
          var headWrap = q("#f05-head"), headLine = q("#f05-head-line");
          var post = q("#f05-post"), postShadow = q("#f05-post-shadow"), postClip = q("#f05-post-clip");
          var words = qa(".f05-w");
          var labPost = q("#f05-lab-post"), labCar = q("#f05-lab-car"), labReel = q("#f05-lab-reel");
          var car = q("#f05-car"), s1 = q("#f05-s1"), s3 = q("#f05-s3");
          var reelBack = q("#f05-reel-back"), reelVideo = q("#f05-reel-video");
          var phone = q("#f05-phone"), appr = q("#f05-appr"), apprImg = q("#f05-appr img");

          /* geometry (px, 1920×1080) */
          var POST_L = 296, POST_T = 242;            /* post card top-left in g1 (CSS)            */
          var POST_S = 1.12;                          /* 400 → 448 wide, bottom on the 934 shelf   */
          var HD = 56, CAP = 62;                      /* header / caption heights at 1×           */
          /* handoff_in: image 400×500 centred (960,560) → card top-left (760, 310 − 56)      */
          var IN_X = 760 - POST_L, IN_Y = 310 - HD - POST_T;
          /* handoff_out: approval image 360×450 at (1000, 262) → post scale .9, card top-left (1000, 262 − 56·.9) */
          var OUT_S = 0.9, OUT_X = 1000 - POST_L, OUT_Y = 262 - HD * OUT_S - POST_T;
          var SINK_X = 1180, SINK_Y = 560;            /* phone centre — carousel & reel file in behind it */

          var tl = gsap.timeline({ paused: true });

          /* ── g1 · 0.0 (track 20.0): chrome grows around the image, card slides to x-centre 520 ── */
          tl.fromTo(post, { x: IN_X, y: IN_Y, scale: 1 }, { x: 0, y: 0, scale: POST_S, duration: 0.6, ease: "power3.inOut" }, 0);
          tl.fromTo(postClip,
            { clipPath: "inset(" + HD + "px 0px " + CAP + "px 0px round 12px 12px 12px 12px)" },
            { clipPath: "inset(0px 0px 0px 0px round 16px 16px 16px 16px)", duration: 0.6, ease: "power3.inOut" }, 0);
          tl.fromTo(postShadow,
            { top: HD, bottom: CAP, borderRadius: 12, boxShadow: "0px 1px 2px rgba(0,0,0,0), 0px 18px 48px rgba(0,0,0,0)" },
            { top: 0, bottom: 0, borderRadius: 16, boxShadow: "0px 1px 2px rgba(0,0,0,0.05), 0px 18px 48px rgba(0,0,0,0.1)", duration: 0.6, ease: "power3.inOut" }, 0);
          tl.fromTo(headLine, { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0);

          /* 0.5 (20.5 clap): label "Post"; the caption writes itself word by word on 1/16 notes */
          tl.fromTo(labPost, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.5);
          words.forEach(function (w, i) { tl.set(w, { opacity: 1 }, 0.5 + i * 0.0625); });

          /* 1.5 (21.5 clap): carousel fans out in the middle column */
          tl.fromTo(car, { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 1.5);
          tl.fromTo(s1, { x: 0, rotationY: 0, scale: 0.9 }, { x: -48, rotationY: -8, scale: 0.9, duration: 0.8, ease: "expo.out" }, 1.5);
          tl.fromTo(s3, { x: 0, rotationY: 0, scale: 0.9 }, { x: 48, rotationY: 8, scale: 0.9, duration: 0.8, ease: "expo.out" }, 1.5);
          tl.fromTo(labCar, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 1.5);

          /* 2.5 (22.5 clap): the reel card slides in, playing hg-reel.mp4 (media 6.0 s+) */
          tl.fromTo([reelBack, reelVideo], { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 2.5);
          tl.fromTo(labReel, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 2.5);

          /* ── g2 · 3.5 (23.5 clap): headline + labels exit, the phone rises, cards file into it ── */
          tl.set(g2, { autoAlpha: 1 }, 3.5);
          tl.fromTo(phone, { y: 960 }, { y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, 3.5);
          tl.to(headWrap, { y: -28, opacity: 0, duration: 0.25, ease: "power2.in" }, 3.5);
          tl.to([labPost, labCar, labReel], { y: -12, opacity: 0, duration: 0.25, ease: "power2.in" }, 3.5);

          /* the post sheds its chrome and lands exactly on the approval card's image slot */
          tl.to(post, { x: OUT_X, y: OUT_Y, scale: OUT_S, duration: 0.4, ease: "power3.inOut" }, 3.5);
          tl.to(postClip, { clipPath: "inset(" + HD + "px 0px " + CAP + "px 0px round 20px 20px 0px 0px)", duration: 0.4, ease: "power3.inOut" }, 3.5);
          tl.to(postShadow, { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);
          tl.fromTo(appr, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "expo.out", immediateRender: false }, 3.72);

          /* carousel + reel scale down and fly in behind the rising phone */
          tl.to(car, { x: SINK_X - 960, y: SINK_Y - 710, scale: 0.3, duration: 0.4, ease: "power3.inOut" }, 3.5);
          tl.to(car, { opacity: 0, duration: 0.32, ease: "power2.in" }, 3.5);
          tl.to([reelBack, reelVideo], { x: SINK_X - 1400, y: SINK_Y - 649.5, scale: 0.3, duration: 0.4, ease: "power3.inOut" }, 3.5);
          tl.to([reelBack, reelVideo], { opacity: 0, duration: 0.32, ease: "power2.in" }, 3.5);

          /* 3.9: the landed post image sits exactly on the approval image slot → hand over, hold to 4.0 */
          tl.set(post, { opacity: 0 }, 3.9);
          tl.set(apprImg, { opacity: 1 }, 3.9);
          tl.set(g1, { autoAlpha: 0 }, 3.9);

          window.__timelines = window.__timelines || {};
          window.__timelines["05-makes"] = tl;
          tl.seek(0);
        })();
      </script>
