<!doctype html>

  <head>

    <style>

        overflow: hidden;
        background: #000;

        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFDF6;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.set("#el-01-hook", { opacity: 1 }, 6.35);
        tl.fromTo("#el-02-team", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6.35);
        tl.addLabel("hf:transition:01-hook:02-team:crossfade", 6.35);
        tl.set("#el-02-team", { opacity: 1 }, 18.81);
        tl.fromTo("#el-03-full", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18.81);
        tl.addLabel("hf:transition:02-team:03-full:crossfade", 18.81);
        tl.to("#el-05-isolate", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 38.5);
        tl.fromTo("#el-06-choose", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 38.5);
        tl.addLabel("hf:transition:05-isolate:06-choose:push-slide", 38.5);
        tl.set("#el-06-choose", { opacity: 1 }, 45.74);
        tl.fromTo("#el-07-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 45.74);
        tl.addLabel("hf:transition:06-choose:07-cta:crossfade", 45.74);
        tl.to({}, { duration: 57.25 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
