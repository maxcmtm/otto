<template id="07-cta-template">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Source Serif 4";
      src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/source-serif-4@5/files/source-serif-4-latin-opsz-normal.woff2") format("woff2");
      font-weight: 200 900;

    }
    @font-face {
      font-family: "Inter";
      src: url("https://cdn.jsdelivr.net/npm/@fontsource/inter@5/files/inter-latin-500-normal.woff2") format("woff2");

    @font-face {
      font-family: "Inter";
      src: url("https://cdn.jsdelivr.net/npm/@fontsource/inter@5/files/inter-latin-600-normal.woff2") format("woff2");
      font-weight: 600;

      font-display: block;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: #fffdf6;
    }

    /* full-bleed teal ground — its own clip on the lowest track */
    [id="07-cta-ground"] {
      position: absolute;
      inset: 0;
      background: #0e252c;
    }

    [id="07-cta-stage"] {
      position: absolute;
      inset: 0;
    }

    /* camera wrapper — carries the slow settle and the final fade */
    [id="07-cta-cam"] {
      position: absolute;
      inset: 0;
      transform-origin: 540px 860px;
    }

    /* ── seal: three arcs, 180px ring centred at (540, 560) ── */
    [id="07-cta-seal"] {
      position: absolute;
      left: 420px;
      top: 440px;
      width: 240px;
      height: 240px;
    }
    [id="07-cta-seal"] svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: 240px;
      display: block;
      overflow: visible;
    }
    [id="07-cta-seal"] path {
      fill: none;
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    [id="07-cta-arc-yellow"] { stroke: #ffbc00; }
    [id="07-cta-arc-green"] { stroke: #31856c; }
    [id="07-cta-arc-cream"] { stroke: #fffdf6; }

    /* ── wordmark: centred at y≈760 ── */
    [id="07-cta-wordmark"] {
      position: absolute;
      left: 0;
      right: 0;
      top: 705px;
      height: 110px;
      margin: 0;
      text-align: center;
      font-family: "Source Serif 4", serif;
      font-weight: 500;
      font-size: 110px;
      line-height: 1;
      letter-spacing: -0.02em;
      font-optical-sizing: auto;
      color: #fffdf6;
      white-space: nowrap;
    }
    [id="07-cta-wordmark"] span {
      display: inline-block;
    }

    /* ── proof block: 2px yellow rule at y≈900, two lines beneath ── */
    [id="07-cta-rule"] {
      position: absolute;
      left: 476px;
      top: 899px;
      width: 128px;
      height: 2px;
      background: #ffbc00;
      transform-origin: 50% 50%;
    }
    [id="07-cta-proof-1"] {
      position: absolute;
      left: 0;
      right: 0;
      top: 932px;
      margin: 0;
      text-align: center;
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: 40px;
      line-height: 1.25;
      letter-spacing: 0.005em;
      color: #fffdf6;
      white-space: nowrap;
    }
    [id="07-cta-proof-1"] span {
      display: inline-block;
    }
    [id="07-cta-proof-2"] {
      position: absolute;
      left: 0;
      right: 0;
      top: 1000px;
      margin: 0;
      text-align: center;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 36px;
      line-height: 1.25;
      letter-spacing: 0.005em;
      color: #fffdf6;
      white-space: nowrap;
    }

    /* ── CTA pill: yellow, teal ink, fully rounded, centred at y≈1180 ── */
    [id="07-cta-cta-row"] {
      position: absolute;
      left: 0;
      right: 0;
      top: 1128px;
      height: 104px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    [id="07-cta-pill"] {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 58px;
      border-radius: 999px;
      background: #ffbc00;
      color: #0e252c;
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: 38px;
      line-height: 1;
      letter-spacing: 0.005em;
      white-space: nowrap;
    }
    [id="07-cta-pill-label"] {
      display: block;
    }
  </style>

  <div id="root" data-composition-id="07-cta" data-width="1080" data-height="1920" data-duration="11.51">
    <div id="07-cta-ground" class="clip" data-start="0" data-duration="11.51" data-track-index="0"></div>

    <div id="07-cta-stage" class="clip" data-start="0" data-duration="11.51" data-track-index="1">
      <div id="07-cta-cam">
        <!-- seal: three spectrum arcs join into one ring (no symbol inside) -->
        <div id="07-cta-seal" data-layout-allow-overflow>
          <svg id="07-cta-svg-yellow" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="07-cta-arc-yellow" d="M 134.08 31.11 A 90 90 0 0 1 204.02 152.25" />
          </svg>
          <svg id="07-cta-svg-green" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="07-cta-arc-green" d="M 189.94 176.64 A 90 90 0 0 1 50.06 176.64" />
          </svg>
          <svg id="07-cta-svg-cream" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="07-cta-arc-cream" d="M 35.98 152.25 A 90 90 0 0 1 105.92 31.11" />
          </svg>
        </div>

        <h1 id="07-cta-wordmark"><span class="07-cta-grp">Hap</span><span class="07-cta-grp">py</span> <span class="07-cta-grp">Gar</span><span class="07-cta-grp">den</span></h1>

        <div id="07-cta-rule"></div>
        <p id="07-cta-proof-1"><span class="07-cta-w">Every</span> <span class="07-cta-w">batch</span> <span class="07-cta-w">third-party</span> <span class="07-cta-w">lab</span> <span class="07-cta-w">tested</span></p>
        <p id="07-cta-proof-2">Lab report published for every batch</p>

        <div id="07-cta-cta-row">
          <div id="07-cta-pill"><span id="07-cta-pill-label">Find your spectrum · link in bio</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById(id);
      };
      var stage = byId("07-cta-stage");
      var cam = byId("07-cta-cam");

      // ── cue times (s) from the voiceover ──
      var T_ARC_1 = 0.08; // "Whichever you choose"
      var DRAW_DUR = 0.62; // per-arc stroke draw
      var SWEEP_DUR = 0.82; // per-arc sweep in from the edge
      var ARC_GAP = DRAW_DUR * 0.7; // next arc starts at 70% of the previous draw
      var T_WORDMARK = 2.05; // "Happy Garden"
      var T_PROOF_1 = 3.93; // "third-party lab tested"
      var T_PROOF_2 = 6.41; // "the report is published"
      var T_CTA = 7.96; // "Find yours"
      var T_HOLD = 9.0; // lockup fully settled; still hold ≥1.9s
      var T_FADE = 10.91; // last 0.6s — the film's only exit
      var FADE_DUR = 0.56; // lands just before the 11.51s window closes

      var tl = gsap.timeline({ paused: true });

      // ── macro: a near-imperceptible settle that comes to rest as the hold begins ──
      tl.fromTo(cam, { scale: 1.03 }, { scale: 1, duration: T_HOLD, ease: "power2.out" }, 0);

      // ── Scene 1: three arcs sweep in from the edges and join into the ring (svg-path-draw) ──
      // measured dash length (analytic fallback: r·θ = 90 × 102° ≈ 160.2)
      var ARC_FALLBACK = (90 * 102 * Math.PI) / 180;
      var arcs = [
        { svg: byId("07-cta-svg-yellow"), path: byId("07-cta-arc-yellow"), dx: 554, dy: -320 },
        { svg: byId("07-cta-svg-green"), path: byId("07-cta-arc-green"), dx: 0, dy: 700 },
        { svg: byId("07-cta-svg-cream"), path: byId("07-cta-arc-cream"), dx: -554, dy: -320 },
      ];
      arcs.forEach(function (a, i) {
        var len = 0;
        try {
          len = a.path.getTotalLength();
        } catch (e) {
          len = 0;
        }
        if (!len || !isFinite(len)) len = ARC_FALLBACK;
        len = len * 1.02;
        a.path.style.strokeDasharray = len + " " + len;
        a.path.style.strokeDashoffset = String(len);

        var t0 = T_ARC_1 + i * ARC_GAP;
        // sweep: travel in from the canvas edge along a clockwise swing about the ring centre
        tl.fromTo(
          a.svg,
          { x: a.dx, y: a.dy, rotation: -100, opacity: 0 },
          { x: 0, y: 0, rotation: 0, opacity: 1, duration: SWEEP_DUR, ease: "power3.out" },
          t0,
        );
        // draw: the pill-stroke traces itself on as it lands
        tl.fromTo(
          a.path,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power3.out" },
          t0,
        );
      });

      // ── Scene 2: wordmark resolves beneath the seal, by letter groups ──
      var groups = stage.getElementsByClassName("07-cta-grp");
      for (var g = 0; g < groups.length; g++) {
        tl.fromTo(
          groups[g],
          { opacity: 0, y: 44, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "expo.out" },
          T_WORDMARK + g * 0.09,
        );
      }

      // ── Scene 3: 2px yellow rule, then the proof line word by word ──
      tl.fromTo(
        byId("07-cta-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power3.out" },
        T_PROOF_1,
      );
      var words = stage.getElementsByClassName("07-cta-w");
      for (var w = 0; w < words.length; w++) {
        tl.fromTo(
          words[w],
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" },
          T_PROOF_1 + 0.1 + w * 0.07,
        );
      }
      // second line fades in beneath at 75%
      tl.fromTo(
        byId("07-cta-proof-2"),
        { opacity: 0, y: 14 },
        { opacity: 0.75, y: 0, duration: 0.9, ease: "power2.out" },
        T_PROOF_2,
      );

      // ── Scene 4: CTA pill rises into place and settles ──
      tl.fromTo(
        byId("07-cta-pill"),
        { opacity: 0, y: 80 },
        { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" },
        T_CTA,
      );
      tl.fromTo(
        byId("07-cta-pill-label"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        T_CTA + 0.12,
      );

      // ── hold (T_HOLD → T_FADE), then fade everything to the teal ground ──
      tl.fromTo(cam, { opacity: 1 }, { opacity: 0, duration: FADE_DUR, ease: "sine.inOut" }, T_FADE);

      window.__timelines["07-cta"] = tl;
    })();
  </script>
</template>
