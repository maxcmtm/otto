  <script>
    (function () {
      var FRAME_ID = "03-full";
      var byId = function (id) { return document.getElementById(FRAME_ID + "-" + id); };
      var root = byId("stage");
      var all = function (cls) { return root.querySelectorAll('[class~="' + FRAME_ID + "-" + cls + '"]'); };

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.00–0.80s): stack already in place (continuity); label reveals per word ──
      var lwords = all("lword");
      var LABEL_START = [0.02, 0.2];
      for (var i = 0; i < lwords.length; i++) {
        tl.fromTo(
          lwords[i],
          { opacity: 0, y: 36, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
          LABEL_START[i]
        );
      }

      // ── Scene 2 (0.80–2.70s): bracket self-draws down the right edge (svg-path-draw) ──
      var bracket = byId("bracket-path");
      var len = bracket.getTotalLength ? bracket.getTotalLength() : 808;
      if (!len || !isFinite(len)) len = 808;
      bracket.style.strokeDasharray = len + " " + len;
      var DRAW_START = 0.82;
      var DRAW_DUR = 1.05;
      tl.fromTo(
        bracket,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" },
        DRAW_START
      );

      // chips brighten 10% in one top→bottom sweep, each pulse fired as the pen passes its centre
      var chips = [byId("chip-cbd"), byId("chip-cbg"), byId("chip-cbn"), byId("chip-terp"), byId("chip-thc")];
      var CHIP_CENTERS = [624, 780, 936, 1092, 1248];
      var PATH_TOP = 562, TICK = 30;
      for (var c = 0; c < chips.length; c++) {
        var frac = Math.min(1, (TICK + (CHIP_CENTERS[c] - PATH_TOP)) / len);
        // invert power2.out: p = 1 - (1 - u)^2  →  u = 1 - sqrt(1 - p)
        var u = 1 - Math.sqrt(1 - frac);
        var t0 = DRAW_START + u * DRAW_DUR;
        tl.fromTo(
          chips[c],
          { filter: "brightness(1)", scale: 1 },
          { filter: "brightness(1.1)", scale: 1.015, duration: 0.32, ease: "power2.out" },
          t0
        );
        tl.fromTo(
          chips[c],
          { filter: "brightness(1.1)", scale: 1.015 },
          { filter: "brightness(1)", scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false },
          t0 + 0.32
        );
      }

      // ── Scene 3 (2.70–4.50s): THC dashed outline warms to yellow for a beat, settles to cream ──
      var thcRect = byId("thc-rect");
      tl.fromTo(
        thcRect,
        { stroke: "#FFFDF6", strokeWidth: 2 },
        { stroke: "#FFBC00", strokeWidth: 3, duration: 0.4, ease: "power2.out" },
        2.71
      );
      tl.fromTo(
        thcRect,
        { stroke: "#FFBC00", strokeWidth: 3 },
        { stroke: "#FFFDF6", strokeWidth: 2, duration: 0.8, ease: "power3.out", immediateRender: false },
        3.4
      );

      // ── Scene 4 (4.50–6.10s): legal note fades in right-aligned under the THC chip ──
      tl.fromTo(
        byId("note"),
        { opacity: 0, y: 14 },
        { opacity: 0.8, y: 0, duration: 0.7, ease: "power3.out" },
        4.5
      );

      // ── Scene 5 (6.10–end): coined-term card rises below the stack on "the entourage effect" ──
      tl.fromTo(
        byId("card"),
        { opacity: 0, y: 56 },
        { opacity: 1, y: 0, duration: 0.75, ease: "expo.out" },
        7.31
      );
      var cwords = all("cword");
      for (var w = 0; w < cwords.length; w++) {
        tl.fromTo(
          cwords[w],
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          7.38 + w * 0.08
        );
      }
      // from ~8.1s the frame holds still (slot holds the final state to 9.04s)

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
