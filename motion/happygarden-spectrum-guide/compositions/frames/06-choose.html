  <script>
    (function () {
      var FRAME = "06-choose";
      var DURATION = 7.24;
      var RULE_W = 952;

      var cam = document.getElementById(FRAME + "-cam");
      var pick = function (cls, scope) {
        return Array.prototype.slice.call(
          (scope || cam).querySelectorAll('[class~="' + FRAME + "-" + cls + '"]'),
        );
      };
      var one = function (cls, scope) {
        return pick(cls, scope)[0];
      };

      // svg-path-draw setup: dash = measured length, offset parked fully out of view
      var ruleLen = function (path) {
        var len = RULE_W;
        try {
          var m = path.getTotalLength();
          if (m > 0) len = m;
        } catch (e) {}
        path.style.strokeDasharray = len + " " + len;
        path.style.strokeDashoffset = len;
        return len;
      };
      var draw = function (tl, path, at, dur) {
        var len = ruleLen(path);
        tl.fromTo(
          path,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
          at,
        );
      };

      var tl = gsap.timeline({ paused: true });

      // Camera: a faint push-in on the list that decays to stillness by the last frame
      tl.fromTo(cam, { scale: 1 }, { scale: 1.018, duration: DURATION, ease: "power1.out" }, 0);

      // Scene 1 (0.00–0.65s): headline per-word reveal, teal rule draws beneath it
      tl.fromTo(
        pick("word"),
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out", stagger: 0.07 },
        0.06,
      );
      draw(tl, one("draw", one("hl-rule")), 0.3, 0.9);

      // Scenes 2–4: each row arrives on its question cue, its pill settles on the answer word.
      // VO cues (vo-06): "want" 0.65 · "Full" 1.94 · "Whole" 2.61 · "broad" 4.63 · "Only" 5.34 · "isolate" 6.53
      var CUES = [
        { row: 0.5, pill: 1.84, pillDur: 0.85 },
        { row: 2.5, pill: 4.52, pillDur: 0.85 },
        { row: 5.22, pill: 6.44, pillDur: 0.74 },
      ];

      pick("row").forEach(function (row, i) {
        var c = CUES[i];
        var q = one("q", row);
        var pill = one("pill", row);
        var label = one("pill-label", row);

        // question slides up into its row, each line rising out of its own mask
        tl.fromTo(q, { y: 28 }, { y: 0, duration: 1.0, ease: "power3.out" }, c.row);
        tl.fromTo(
          pick("qin", row),
          { yPercent: 118, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.95, ease: "expo.out", stagger: 0.09 },
          c.row,
        );
        // the row's 2px hairline draws under it
        draw(tl, one("draw", one("row-rule", row)), c.row + 0.12, 1.0);

        // the answer pill settles in on the right — long-tail, no overshoot
        tl.fromTo(
          pill,
          { opacity: 0, y: 22, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: c.pillDur, ease: "expo.out" },
          c.pill,
        );
        tl.fromTo(
          label,
          { yPercent: 60, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: c.pillDur - 0.06, ease: "expo.out" },
          c.pill + 0.06,
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
    })();
  </script>
