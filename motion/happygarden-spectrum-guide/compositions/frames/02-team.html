    [id="02-team-bracket"] {

          <span class="02-team-line" data-layout-allow-overlap><span class="02-team-w" data-layout-allow-overlap>more</span> <span class="02-team-w" data-layout-allow-overlap>than</span> <span class="02-team-w 02-team-hi" data-layout-allow-overlap>CBD.</span></span>

  <script>
    (function () {
      var FRAME_ID = "02-team";
      var DUR = 12.46;
      var byId = function (id) { return document.getElementById(FRAME_ID + "-" + id); };
      var stage = byId("stage");
      var all = function (cls) { return stage.querySelectorAll('[class~="' + FRAME_ID + "-" + cls + '"]'); };

      var tl = gsap.timeline({ paused: true });

      // measured stroke length (svg-path-draw); geometry fallback if the API is unavailable
      var measure = function (el, fallback) {
        var len = el && el.getTotalLength ? el.getTotalLength() : 0;
        return len && isFinite(len) ? len : fallback;
      };

      // ── discrete-text-sequence: whole headline states replaced at VO thresholds.
      //    Each threshold is a zero-duration tl.set (state, not a callback — seek-safe). ──
      var STATES = { a: byId("hl-a"), b: byId("hl-b") };
      var SEQUENCE = [
        { t: 0.0, state: "a" },   // "Hemp makes more than CBD."
        { t: 2.41, state: "b" }   // "Think of it as a team." — on "Think"
      ];
      for (var q = 0; q < SEQUENCE.length; q++) {
        for (var key in STATES) {
          tl.set(STATES[key], { visibility: key === SEQUENCE[q].state ? "inherit" : "hidden" }, SEQUENCE[q].t);
        }
      }

      // ── Scene 1 (0.00–2.40s): headline per-word reveal on the VO; CBD chip pops on "CBD" ──
      var words = all("w");
      var WORD_AT = [0.02, 0.36, 0.76, 1.22, 1.56]; // Hemp · makes · more · than · CBD.
      for (var i = 0; i < words.length; i++) {
        tl.fromTo(
          words[i],
          { opacity: 0, y: 36, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
          WORD_AT[i]
        );
      }
      // spring-pop-entrance, calm settle: scale 0 → 1, power3.out, no overshoot
      tl.fromTo(
        byId("chip-cbd"),
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        1.56
      );

      // ── Scene 2 (2.40–4.20s): headline swaps in place — zoom-through velocity-matched cut ──
      var hl = byId("hl");
      var CUT = 2.41;
      tl.fromTo(
        hl,
        { scale: 1, filter: "blur(0px)" },
        { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in" },
        CUT - 0.2
      );
      tl.fromTo(
        hl,
        { opacity: 1 },
        { opacity: 0.15, duration: 0.2, ease: "none" },
        CUT - 0.2
      );
      // hard cut at peak blur: the SEQUENCE set swaps the state; the incoming line keeps scaling up
      tl.fromTo(
        hl,
        { scale: 0.75, filter: "blur(10px)", opacity: 0.15 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false },
        CUT
      );

      // ── Scene 3 (4.20–5.90s): CBD outline tick on "CBD"; group label on "the minor cannabinoids" ──
      var ring = byId("ring");
      tl.fromTo(
        ring,
        { opacity: 0, scale: 1.04 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
        4.22
      );
      tl.fromTo(
        ring,
        { opacity: 1 },
        { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false },
        4.6
      );

      var bracket = byId("bracket-path");
      var BR_LEN = measure(bracket, 30 + 280 + 30);
      bracket.style.strokeDasharray = BR_LEN + " " + BR_LEN;
      tl.fromTo(
        bracket,
        { strokeDashoffset: BR_LEN },
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
        4.65
      );
      var minor = byId("minor");
      tl.fromTo(
        minor,
        { opacity: 0, x: -16 },
        { opacity: 0.7, x: 0, duration: 0.6, ease: "power3.out" },
        4.72
      );

      // ── Scene 4 (5.90–9.10s): CBG then CBN slide up into their slots; label settles at 50% ──
      var slideIn = function (el, at) {
        tl.fromTo(
          el,
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          at
        );
      };
      slideIn(byId("chip-cbg"), 5.93);
      slideIn(byId("chip-cbn"), 7.73);
      tl.fromTo(
        minor,
        { opacity: 0.7 },
        { opacity: 0.5, duration: 0.8, ease: "power2.out", immediateRender: false },
        8.45
      );
      tl.fromTo(
        byId("bracket"),
        { opacity: 0.7 },
        { opacity: 0.5, duration: 0.8, ease: "power2.out", immediateRender: false },
        8.45
      );

      // ── Scene 5 (9.10–10.30s): Terpenes lands in slot four; its leaf glyph draws on ──
      slideIn(byId("chip-terp"), 9.14);
      var leaf = byId("leaf");
      var rib = byId("leaf-rib");
      var LEAF_LEN = measure(leaf, 64);
      var RIB_LEN = measure(rib, 20);
      leaf.style.strokeDasharray = LEAF_LEN + " " + LEAF_LEN;
      rib.style.strokeDasharray = RIB_LEN + " " + RIB_LEN;
      var LEAF_AT = 9.36, LEAF_DUR = 0.55;
      tl.fromTo(
        leaf,
        { strokeDashoffset: LEAF_LEN },
        { strokeDashoffset: 0, duration: LEAF_DUR, ease: "power2.out" },
        LEAF_AT
      );
      tl.fromTo(
        rib,
        { strokeDashoffset: RIB_LEN },
        { strokeDashoffset: 0, duration: LEAF_DUR * 0.7, ease: "power2.out" },
        LEAF_AT + LEAF_DUR * 0.75
      );

      // ── Scene 6 (10.30–end): dashed THC outline draws itself round slot five (svg-path-draw
      //    on the mask pen); its label fades in on "THC"; the full stack holds still to the end ──
      var pen = byId("thc-pen");
      var PEN_LEN = measure(pen, 2 * (718 - 126) + Math.PI * 126) + 4;
      pen.style.strokeDasharray = PEN_LEN + " " + PEN_LEN;
      tl.fromTo(
        pen,
        { strokeDashoffset: PEN_LEN },
        { strokeDashoffset: 0, duration: 0.78, ease: "power2.out" },
        10.49
      );
      var THC_LABEL_AT = 11.38;
      tl.fromTo(
        byId("thc-glyph"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" },
        THC_LABEL_AT
      );
      tl.fromTo(
        byId("thc-name"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" },
        THC_LABEL_AT
      );
      // from ~11.9s the five-chip stack holds still (03-full opens on exactly this state);
      // a no-op anchor keeps the timeline length equal to the frame duration
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
