  <script>
    (function () {
      var FRAME_ID = "05-isolate";
      var DURATION = 3.86;
      var byId = function (id) { return document.getElementById(FRAME_ID + "-" + id); };
      var stage = byId("stage");

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.00–1.00s): stage exactly as frame 04 ended. On "Isolate" the label
      //    swaps in place (discrete-text-sequence: instant state jump, no roll / blur) and
      //    the "0% THC" stamp fades; the three chips that are about to leave recede. ──
      var label = byId("label");
      var SEQUENCE = [
        { t: 0.0, text: "Broad spectrum" },
        { t: 0.1, text: "Isolate" }
      ];
      var textAt = function (time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return SEQUENCE[0].text;
      };
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var next = textAt(driver.t);
            if (label.textContent !== next) label.textContent = next;
          }
        },
        0
      );

      tl.fromTo(
        byId("stamp"),
        { opacity: 1, scale: 1 },
        { opacity: 0, scale: 0.96, duration: 0.5, ease: "power3.out" },
        0.1
      );

      var cbg = byId("chip-cbg"), cbn = byId("chip-cbn"), terp = byId("chip-terp");
      tl.fromTo(
        [cbg, cbn, terp],
        { opacity: 1 },
        { opacity: 0.6, duration: 0.5, ease: "power3.out", stagger: 0.06 },
        0.34
      );

      // ── Scene 2 (1.00–2.50s): on "pure CBD" (1.02s) Terpenes, CBN, CBG lift away
      //    bottom → top, 120ms apart (frame 04's lift: y −24, blur 6px, fade, power3);
      //    the bracket retracts bottom → top to nothing. ──
      var LEAVERS = [terp, cbn, cbg];
      for (var k = 0; k < LEAVERS.length; k++) {
        tl.fromTo(
          LEAVERS[k],
          { y: 0, opacity: 0.6, filter: "blur(0px)" },
          { y: -24, opacity: 0, filter: "blur(6px)", duration: 0.6, ease: "power3.out", immediateRender: false },
          1.02 + k * 0.12
        );
      }

      // dasharray 652 (path length) + 720 gap: offset past 652 leaves no zero-length round-cap dot
      tl.fromTo(
        byId("bracket-path"),
        { strokeDashoffset: 0 },
        { strokeDashoffset: 660, duration: 0.66, ease: "power3.inOut" },
        1.02
      );

      // then CBD glides to the stage centre (y 702 → 806) and grows 1.7×: the pill opens
      // 720×128 → 936×218 (radius stays half the height, so it is a true pill every frame),
      // the glyph + name scale 1.7× and settle centred. scale-swap feel, power3, no overshoot.
      var GLIDE_AT = 1.44;
      var GLIDE_DUR = 1.0;
      var GLIDE_EASE = "power3.inOut";
      tl.fromTo(
        byId("cbd"),
        { y: 0 },
        { y: 104, duration: GLIDE_DUR, ease: GLIDE_EASE },
        GLIDE_AT
      );
      tl.fromTo(
        byId("cbd-bg"),
        { clipPath: "inset(45px 108px 45px 108px round 64px)" },
        { clipPath: "inset(0px 0px 0px 0px round 109px)", duration: GLIDE_DUR, ease: GLIDE_EASE },
        GLIDE_AT
      );
      // content starts left-aligned like every chip (glyph at x 226 = 180 + 46 padding)
      tl.fromTo(
        byId("cbd-content"),
        { x: -236, scale: 1 },
        { x: 0, scale: 1.7, duration: GLIDE_DUR, ease: GLIDE_EASE },
        GLIDE_AT
      );

      // ── Scene 3 (2.50–end): on "nothing else" (2.55s) the cream line reveals per word
      //    under the hero; then the frame holds still to the end. ──
      var words = stage.querySelectorAll('[class~="' + FRAME_ID + '-word"]');
      tl.fromTo(
        words,
        { opacity: 0, y: 28, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.62, ease: "power3.out", stagger: 0.09 },
        2.55
      );
      // last word lands at ~3.44s; the slot holds the final state to 3.86s

      window.__timelines = window.__timelines || {};
      window.__timelines["05-isolate"] = tl;
    })();
