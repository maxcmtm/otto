  <script>
    (function () {
      var FRAME_ID = "04-broad";
      var DURATION = 6.79;
      var byId = function (id) { return document.getElementById(FRAME_ID + "-" + id); };

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.00–1.30s): stage exactly as frame 03 left it; on "Broad" the label's
      //    first word swaps in place, "Full" → "Broad" (discrete-text-sequence: instant state
      //    jump, no roll / blur). "spectrum" is never replaced. ──
      var firstWord = byId("lword-first");
      var SEQUENCE = [
        { t: 0.0, text: "Full" },
        { t: 0.1, text: "Broad" }
      ];
      var textAt = function (time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return SEQUENCE[0].text;
      };
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var next = textAt(driver.t);
            if (firstWord.textContent !== next) firstWord.textContent = next;
          }
        },
        0
      );

      // chip handles (top → bottom)
      var cbd = byId("chip-cbd"), cbg = byId("chip-cbg"), cbn = byId("chip-cbn");
      var terp = byId("chip-terp"), thc = byId("chip-thc");
      var FIVE = [cbd, cbg, cbn, terp, thc];
      var FOUR = [cbd, cbg, cbn, terp];

      // one brighten pass: each chip lifts brightness + a hair of scale, then settles back.
      // Filter strings always carry both functions so the THC blur later interpolates cleanly.
      var sweep = function (list, start, stagger, peakB, peakS, upDur, downDur, firstImmediate) {
        for (var i = 0; i < list.length; i++) {
          var t0 = start + i * stagger;
          tl.fromTo(
            list[i],
            { filter: "brightness(1) blur(0px)", scale: 1 },
            {
              filter: "brightness(" + peakB + ") blur(0px)",
              scale: peakS,
              duration: upDur,
              ease: "power2.out",
              immediateRender: firstImmediate
            },
            t0
          );
          tl.fromTo(
            list[i],
            { filter: "brightness(" + peakB + ") blur(0px)", scale: peakS },
            {
              filter: "brightness(1) blur(0px)",
              scale: 1,
              duration: downDur,
              ease: "power3.out",
              immediateRender: false
            },
            t0 + upDur
          );
        }
      };

      // ── Scene 2 (1.30–2.70s): on "the same team" (1.33s) all five chips brighten in one
      //    quick top → bottom sweep. ──
      sweep(FIVE, 1.33, 0.07, 1.12, 1.018, 0.2, 0.55, true);

      // ── Scene 3 (2.70–4.20s): on "minus the THC" (2.72s) the dashed THC chip lifts away
      //    (y −24, blur 6px, fade, power3); the bracket retracts to end at Terpenes while the
      //    four remaining chips glide down 78px to re-centre — together the bracket contracts
      //    symmetrically around the stack's centre line (y 936). ──
      tl.fromTo(
        thc,
        { y: 0, opacity: 1, filter: "brightness(1) blur(0px)" },
        { y: -24, opacity: 0, filter: "brightness(1) blur(6px)", duration: 0.6, ease: "power3.out", immediateRender: false },
        2.72
      );

      var GLIDE_AT = 2.95;
      var GLIDE_DUR = 0.6;
      tl.fromTo(
        byId("bracket-path"),
        { attr: { d: "M918 562 L948 562 L948 1310 L918 1310" } },
        { attr: { d: "M918 562 L948 562 L948 1154 L918 1154" }, duration: GLIDE_DUR, ease: "power3.inOut" },
        GLIDE_AT
      );
      tl.fromTo(
        byId("stack"),
        { y: 0 },
        { y: 78, duration: GLIDE_DUR, ease: "power3.inOut" },
        GLIDE_AT
      );

      // ── Scene 4 (4.20–end): on "Whole plant" (4.25s) the four remaining chips answer with a
      //    softer brighten pass; on "zero THC" (5.28s) the hemp-green "0% THC" stamp settles in
      //    under the label (expo.out, no overshoot); then the frame holds still. ──
      sweep(FOUR, 4.25, 0.07, 1.07, 1.01, 0.22, 0.6, false);

      tl.fromTo(
        byId("stamp"),
        { opacity: 0, y: 16, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "expo.out" },
        5.28
      );
      // from ~6.0s everything is at rest; the slot holds the final state to 6.79s

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
