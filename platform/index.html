      if(verb) ev.push({t, h: `You ${verb} ${q(p)}${p.approved_via === "telegram" ? " in Telegram" : ""}`});
    }
    if(p.status === "failed" && (t = today(p.slot))) ev.push({t, h: `Couldn't publish ${q(p)}`, cls: "bad"});
    if((p.status === "approved" || p.status === "scheduled") && (t = today(p.slot)) && t > now) ev.push({t, h: `${q(p)} goes out on ${esc(plat(p.platform))}`, cls: "later"});
    if(p.status === "pending_approval" && (t = today(p.slot)) && t > now) ev.push({t, h: `${q(p)} is due and waiting for you`, cls: "later"});
  });
  Object.entries(DATA.competitors || {}).forEach(([b, c]) => { const t = today(c.last_sweep); if(t) ev.push({t, h: `Checked ${(c.items || []).length || ""} competitors for ${esc(brandName(b) || b)}${N(c.changes) ? ` · ${N(c.changes)} ${plural(N(c.changes), "change")}` : ""}`.replace("Checked  ", "Checked ")}); });
  (DATA.edit_requests || []).forEach(r => { const t = today(r.ts), p = byId(r.post); if(t && p) ev.push({t, h: `You asked for changes to ${q(p)}`}); });
  ev.sort((a, b) => a.t - b.t);
  const past = ev.filter(e => e.cls !== "later"), later = ev.filter(e => e.cls === "later");
  const li = e => `<li class="${e.cls || ""}"><time>${e.cls === "now" ? "Now" : hhmm(e.t)}</time><i class="td" aria-hidden="true"></i><span>${e.h}</span></li>`;
  if(!ev.length){
    const a = activityOf(), nx = nextUp()[0];
    return `<p class="sheet-empty">Nothing has happened yet today.${a && a.work ? ` Otto is ${esc(a.t.charAt(0).toLowerCase() + a.t.slice(1))}.` : ""}${nx ? ` The next post goes out ${esc(longWhen(nx.slot))}.` : ""}</p>`;
  }
  return `<ol class="tl">${past.map(li).join("")}${later.length ? `<li class="tl-sep">Later today</li>${later.map(li).join("")}` : ""}</ol>`;
}
function openTimeline(opener){ present(makeSheet({id: "tl", size: "auto", title: new Date().toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long"}), body: timelineH(), opener})); }

/* ================= toast ================= */
let TT = null;
function toast(text, o){
  o = o || {};
  const el = $("toast");
  if(TT) clearTimeout(TT.timer);
  el.className = "toast" + (o.err ? " err" : "") + (o.undo ? " has-u" : "");
  el.innerHTML = `${o.err ? '<i class="t-dot" aria-hidden="true"></i>' : ""}<span class="tt" role="status">${esc(text)}</span>${o.undo ? '<button type="button" class="tu" aria-keyshortcuts="Meta+Z Control+Z">Undo</button>' : ""}`;
  const fresh = el.hidden;
  el.hidden = false;
  if(fresh) play(el, [{opacity: 0, transform: "translate(-50%,14px) scale(.98)"}, {opacity: 1, transform: "translate(-50%,0) scale(1)"}], {duration: 360, easing: EZ.snappy}).then(drop);
  else play(el, [{transform: "translate(-50%,0) scale(.97)"}, {transform: "translate(-50%,0) scale(1)"}], {duration: 360, easing: EZ.pop}).then(drop);
  const st = {undo: o.undo || null, left: o.ms || (o.undo ? 5000 : o.err ? 5000 : 2600), start: 0, timer: 0, paused: false};
  TT = st;
  const u = el.querySelector(".tu");
  if(u) u.onclick = () => runUndo();
  const arm = () => { st.start = Date.now(); st.timer = setTimeout(() => { if(TT === st) hideToast(); }, st.left); };
  el.onpointerenter = el.onfocusin = () => { if(st.paused) return; st.paused = true; clearTimeout(st.timer); st.left -= Date.now() - st.start; };
  el.onpointerleave = el.onfocusout = () => { if(!st.paused || TT !== st) return; st.paused = false; arm(); };
  arm();
}
function runUndo(){ if(!TT || !TT.undo) return false; const f = TT.undo; TT.undo = null; hideToast(); f(); return true; }
function hideToast(){
  const el = $("toast"); if(el.hidden) return;
  if(TT) clearTimeout(TT.timer); TT = null;
  play(el, [{opacity: 1, transform: "translate(-50%,0)"}, {opacity: 0, transform: "translate(-50%,10px)"}], {duration: 180, easing: EZ.in}).then(a => { if(!TT) el.hidden = true; drop(a); });
}

  const dn = t.closest("[data-dnav]"); if(dn && DT){ const n = dNeighbor(DT.id, +dn.dataset.dnav); if(n) dSwap(n, +dn.dataset.dnav); return; }

function trap(e, s){
  const f = $$('button:not([disabled]), [href], textarea, input:not([tabindex="-1"]), video[controls], [tabindex="0"]', s.sheet).filter(shown);
  if(!f.length){ e.preventDefault(); return; }
  const a = f[0], z = f[f.length - 1], ae = document.activeElement;
  if(e.shiftKey && (ae === a || ae === s.sheet)){ e.preventDefault(); z.focus(); }
  else if(!e.shiftKey && (ae === z || !s.sheet.contains(ae))){ e.preventDefault(); a.focus(); }
}
document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !e.shiftKey && TT && TT.undo && !/TEXTAREA|INPUT/.test(e.target.tagName)){ e.preventDefault(); runUndo(); return; }

  const s = STACK[STACK.length - 1];
  if(s){
    if(e.key === "Escape"){ e.preventDefault(); closeSheet(s); return; }
    if(e.key === "Tab"){ trap(e, s); return; }
    if(DT && s === DT.s && !/TEXTAREA|INPUT|VIDEO/.test(e.target.tagName) && !e.metaKey && !e.ctrlKey && !e.altKey){
      const p = byId(DT.id), pend = p && p.status === "pending_approval";

      else if(pend && e.key.toLowerCase() === "c"){ e.preventDefault(); openChange(DT.id, document.activeElement); }
      else if(e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "j" || e.key === "k"){ const dir = (e.key === "ArrowDown" || e.key === "j") ? 1 : -1; const n = dNeighbor(DT.id, dir); if(n){ e.preventDefault(); dSwap(n, dir); } }
    }
    return;
  }
  const main = e.target.closest && e.target.closest(".sw-main");
  if(main && !e.metaKey && !e.ctrlKey && !e.altKey){
    const id = main.dataset.open, k = e.key.toLowerCase();

});

/* ================= boot: live API -> local snapshot -> embedded fallback ================= */
const DEMO = new URLSearchParams(location.search).get("demo-state");
function loadError(){
  const card = `<div class="card err-card"><p class="err-t">Couldn't load your posts.</p><p class="err-s">Check your connection, then try again.</p><button type="button" class="btn gray tap" data-go="reload">Try again</button></div>`;
  $("today-body").innerHTML = card; $("today-body").removeAttribute("aria-busy");
  $("review-body").innerHTML = card; $("review-body").removeAttribute("aria-busy");
  setActivity(null);
}
/* deep links from the approval e-mail: #post=<id> opens that post, #change=<id> opens it with "What should change?" */
function deepLink(){ const m = /^#(post|change)=([A-Za-z0-9_.:%-]{1,120})$/.exec(location.hash); if(!m) return null; try{ return {k: m[1], id: decodeURIComponent(m[2])}; }catch(_){ return null; } }
let DEEP = deepLink();
function openDeep(){
  const dl = DEEP; DEEP = null; if(!dl || !DATA) return;
  history.replaceState(null, "", "#review");
  setView("review", {animate: false});
  const p = byId(dl.id);
  if(!p){ toast("That post isn't here any more."); return; }
  openDetail(dl.id, {});
  if(dl.k === "change" && p.status === "pending_approval") setTimeout(() => { if(DT && DT.id === dl.id) openChange(dl.id); }, RM() ? 0 : 450);
}
function boot(d, live){
  DATA = d; LIVE = live;
  if(!$("gate").hidden){ $("gate").hidden = true; $("app").hidden = false; }
  document.documentElement.classList.toggle("preview", !live);
  render();
  if(DEMO) requestAnimationFrame(() => runDemo(DEMO));
  else if(DEEP) requestAnimationFrame(openDeep);
}
/* Nothing of the client's to show: signed out (401, or the sign-in page answered instead of the API), signed in with no
   brand yet (403), or Otto can't be reached. The app is hidden, never filled with someone else's or sample data. */
const LOCAL = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
let GATE = null, GATE_T = 0;
const GATES = {
  signin: {h: "Sign in to Otto", s: "This browser isn't signed in, or your session has ended.",
    a: `<button type="button" class="btn pri lg block tap" data-gate="reload">Sign in</button>`,
    n: "Use the email address you checked out with."},
  setup: {h: "Your brand is being set up.", s: "You're signed in, but no brand is linked to this sign-in yet. If you haven't finished setting up Otto, pick up where you left off.",
    a: `<a class="btn pri lg block tap" href="onboarding.html">Continue setup</a><button type="button" class="btn gray lg block tap" data-gate="reload">Try again</button>`,
    n: "Already finished? Linking your brand to your sign-in can take a few minutes after payment."},
  offline: {h: "Otto can't be reached right now.", s: "Your posts and approvals are safe. Check your connection; this page tries again on its own.",
    a: `<button type="button" class="btn pri lg block tap" data-gate="retry">Try again</button>`, n: ""}
};
function gate(kind){
  const g = GATES[kind] || GATES.offline;
  while(STACK.length){ const st = STACK.pop(); st.layer.remove(); }
  document.documentElement.classList.remove("sheet-open");
  const first = GATE !== kind; GATE = kind; LIVE = false;
  $("gate-h").textContent = g.h; $("gate-s").textContent = g.s; $("gate-a").innerHTML = g.a;
  $("gate-n").textContent = g.n; $("gate-n").hidden = !g.n;
  $("app").hidden = true; $("gate").hidden = false;
  document.title = g.h.replace(/\.$/, "") + " · Otto";
  if(first) $("gate-h").focus({preventScroll: true});
  clearInterval(GATE_T);
  if(kind === "offline") GATE_T = setInterval(() => { if(!document.hidden) load(true); }, 30000);
}
$("gate").addEventListener("click", e => {
  const b = e.target.closest("[data-gate]"); if(!b) return;
  if(b.dataset.gate === "reload") location.reload(); else load(true);
});
addEventListener("online", () => { if(GATE === "offline") load(true); });
async function fetchData(){
  const r = await fetch(API + "/data", {cache: "no-store", credentials: "same-origin", redirect: "manual"});
  if(r.type === "opaqueredirect" || r.status === 401) return {gate: "signin"};
  if(r.status === 403) return {gate: "setup"};
  if(!r.ok) return {down: true};
  if(!/json/.test(r.headers.get("content-type") || "")) return {gate: "signin"};     // a sign-in page answered instead of the API
  const d = await r.json();
  return d && typeof d === "object" && !Array.isArray(d) ? {data: d} : {down: true};
}
function refresh(){
  return fetchData().then(o => { if(o.gate) gate(o.gate); else if(o.data) adopt(o.data); }).catch(() => {});
}
async function load(again){
  let o = {down: true};
  try{ o = await fetchData(); }catch(_){}
  if(o.data){ clearInterval(GATE_T); GATE = null; document.title = "Otto"; return boot(o.data, true); }
  if(o.gate) return gate(o.gate);
  if(again) return gate("offline");
  // Otto's API is down. On a developer's machine the local snapshot is fine to look at (labelled Preview); a client gets
  // the offline state: the embedded block is a neutral, empty document by default and is never shown as their data.
  if(LOCAL){
    try{ const f = await fetch("data.json", {cache: "no-store"}); if(f.ok) return boot(await f.json(), false); }catch(_){}
    try{ const fb = JSON.parse($("fallback-data").textContent); if(fb && fb.fallback !== "neutral" && Array.isArray(fb.posts) && fb.posts.length) return boot(fb, false); }catch(_){}
  }
  gate("offline");
}
// live polling: the activity pill and counts follow real job states; never while the owner is mid-gesture or in a sheet
setInterval(() => { if(LIVE && !document.hidden && !STACK.length && !BUSY && !SW && !HOLD) refresh(); }, 30000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && LIVE && !STACK.length) refresh(); });
MQ.desk.addEventListener && MQ.desk.addEventListener("change", () => { while(STACK.length){ const s = STACK.pop(); s.layer.remove(); } DT = null; $("app").inert = false; $("app").classList.remove("behind"); $("app").style.transform = ""; document.documentElement.classList.remove("sheet-open"); toastOffset(); if(DATA) render(); });

/* Screenshot hook, harmless: ?demo-state=review|calendar|posts|settings|detail|change|day|timeline|swipe|approve|hold|empty|skeleton|error.
   Only UI state; nothing is posted (the mutating ones run only in preview, where actions stay local). */
function runDemo(k){
  const P = pendingList(), p0 = P[0];
  if(VIEWS.includes(k)) return setView(k, {animate: false});
  if(k === "detail" && p0){ setView("review", {animate: false}); openDetail(p0.id, {}); }
  if(k === "change" && p0){ setView("review", {animate: false}); openDetail(p0.id, {}); setTimeout(() => { const s = openChange(p0.id); const c = s && s.sheet.querySelector("[data-chip]"); if(c){ c.setAttribute("aria-pressed", "true"); s.sync(); } }, 700); }
  if(k === "day"){ setView("calendar", {animate: false}); const now = new Date(); const d = $$("#cal-grid .cd[data-day]").map(c => c.dataset.day).find(iso => postsOnIso(iso).length && iso >= isoD(now)) || $$("#cal-grid .cd[data-day]").map(c => c.dataset.day).find(iso => postsOnIso(iso).length) || isoD(now); pickDay(d, true); }
  if(k === "timeline") openTimeline($("activity"));
  if(k === "swipe"){ setView("review", {animate: false}); const rows = $$("#v-review .sw");
    [[rows[0], .62], [rows[1], -.3]].forEach(([r, f]) => { if(!r) return; const x = r.offsetWidth * f; r.classList.add("swiping"); if(Math.abs(f) >= .55) r.classList.add("armed");
      r.dataset.dir = x > 0 ? "r" : "l"; r.style.setProperty("--x", Math.abs(x) + "px"); r.querySelector(".sw-fg").style.transform = `translate3d(${x}px,0,0)`; }); }
  if(LIVE) return;
  if(k === "approve" && p0){ setView("review", {animate: false}); setTimeout(() => decide(p0.id, "approved"), 300); }
  if(k === "hold"){ setView("review", {animate: false}); const b = $$(".hold").find(shown); if(b){ b.querySelector(".hr-fg").style.strokeDashoffset = ".38"; b.classList.add("holding"); } }
  if(k === "empty"){ P.forEach(p => { p.status = "approved"; }); setView("review", {animate: false}); render(); }
}
if(DEMO === "skeleton"){ /* keep the skeleton on screen */ }
else if(DEMO === "error") loadError();
else if(DEMO && Object.prototype.hasOwnProperty.call(GATES, DEMO)) gate(DEMO);
else load();
const hv = viewFromHash(); if(hv && hv !== "today") setView(hv, {animate: false}); else syncNav();
