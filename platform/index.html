/* Otto app. Tokens: research/DESIGN-DIRECTION.md §4. Motion: §5. System font only, one accent. */
@property --x{syntax:"<length>";inherits:true;initial-value:0px}
:root{
  color-scheme:light dark;
  --bg:#F5F7FB;--surface:#FFFFFF;--surface-2:#EEF1F6;--elevated:#FFFFFF;
  --sheet-bg:#F5F7FB;--sheet-card:#FFFFFF;
  --ink:#10182B;--ink-2:#5B6478;--ink-3:#7A8397;
  --line:#E4E8F1;--line-soft:#EDF0F6;--hair:1px;
  --accent:#2447F0;--accent-fill:#2447F0;--accent-press:#1631B8;--accent-tint:#EDF1FF;--on-accent:#FFFFFF;
  --green:#0B7A4B;--green-tint:#E5F6EE;--amber:#B45309;--amber-tint:#FFF4E2;--red:#B4231F;--red-tint:#FDEBEA;
  --swipe-skip:#7A8397;
  --scrim:rgba(16,24,43,.32);--under:#0C0D0F;
  --bar:rgba(245,247,251,.8);
  --hover:rgba(16,24,43,.035);--press:rgba(16,24,43,.07);--sel:rgba(16,24,43,.06);
  --skel:rgba(16,24,43,.055);--shim:rgba(255,255,255,.6);
  --toast-bg:#10182B;--toast-ink:#F2F3F5;--toast-link:#AFBDFF;
  --img-edge:rgba(16,24,43,.07);
  --row-h:color-mix(in srgb,var(--surface) 96.5%,var(--ink));
  --shadow-1:0 1px 2px rgba(16,24,43,.06),0 1px 1px rgba(16,24,43,.04);
  --shadow-2:0 6px 16px -4px rgba(16,24,43,.12),0 2px 4px rgba(16,24,43,.06);
  --shadow-3:0 24px 48px -12px rgba(16,24,43,.22),0 8px 16px -8px rgba(16,24,43,.10);
  --lift:0 0 0 0 transparent;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;
  --dur-press:80ms;--dur-fast:140ms;--dur-base:220ms;--dur-med:360ms;--dur-slow:560ms;--dur-chart:900ms;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-in-out:cubic-bezier(.65,0,.35,1);--ease-in:cubic-bezier(.55,0,1,.45);
  --spring-snappy:cubic-bezier(.22,1,.36,1);--spring-smooth:cubic-bezier(.22,1,.36,1);
  --spring-sheet:cubic-bezier(.32,.72,0,1);--spring-pop:cubic-bezier(.34,1.4,.64,1);
  --top-h:calc(44px + env(safe-area-inset-top,0px));
  --tab-h:calc(49px + env(safe-area-inset-bottom,0px));
  --side-w:240px;--pad:20px;
}
@supports (transition-timing-function:linear(0,1)){:root{
  --spring-snappy:linear(0,.084,.246,.412,.562,.681,.771,.839,.888,.922,.947,.964,.975,.983,.989,.993,1);
  --spring-smooth:linear(0,.083,.243,.413,.559,.678,.77,.838,.887,.922,.946,.964,.975,.983,.989,.992,1);
  --spring-sheet:linear(0,.056,.177,.317,.457,.579,.683,.765,.831,.881,.917,.944,.963,.976,.985,.991,1);
  --spring-pop:linear(0,.08,.251,.451,.635,.787,.898,.974,1.018,1.039,1.045,1.042,1.035,1.026,1.017,1.01,1);
}}
@media (min-resolution:2dppx){:root{--hair:.5px}}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0D0F;--surface:#16171A;--surface-2:#1E2024;--elevated:#24262B;
  --sheet-bg:#16171A;--sheet-card:#1E2024;
  --ink:#F2F3F5;--ink-2:#A3A8B3;--ink-3:#8D95A5;
  --line:#2A2C31;--line-soft:#212327;
  --accent:#6E88FF;--accent-fill:#4461F5;--accent-press:#3551E0;--accent-tint:#1B2240;--on-accent:#FFFFFF;
  --green:#34C77B;--green-tint:rgba(52,199,123,.14);--amber:#F5A524;--amber-tint:rgba(245,165,36,.14);--red:#FF6B61;--red-tint:rgba(255,107,97,.14);
  --swipe-skip:#5A606C;
  --scrim:rgba(0,0,0,.5);--under:#000;
  --bar:rgba(12,13,15,.8);
  --hover:rgba(255,255,255,.035);--press:rgba(255,255,255,.07);--sel:rgba(255,255,255,.07);
  --skel:rgba(255,255,255,.06);--shim:rgba(255,255,255,.05);
  --toast-bg:#2A2C31;--toast-ink:#F2F3F5;--toast-link:#9DB0FF;
  --img-edge:rgba(255,255,255,.06);
  --shadow-1:none;--shadow-2:0 8px 24px -6px rgba(0,0,0,.55);--shadow-3:0 24px 48px -12px rgba(0,0,0,.65);
  --lift:inset 0 1px 0 0 rgba(255,255,255,.05);
}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--bg);-webkit-text-size-adjust:100%;transition:background-color .2s}
html.sheet-open{background:var(--under)}
body{font:400 15px/1.4 var(--font);letter-spacing:-.01em;color:var(--ink);background:transparent;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;font-synthesis:none}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:inherit}
html.dragging,html.dragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num,.tab{font-variant-numeric:tabular-nums}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i.g{fill:currentColor;stroke:none}
.hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}
#safe-probe{position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none}

/* press + hover: every tappable */
.tap{transition:transform var(--dur-med) var(--spring-snappy),background-color var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast),opacity var(--dur-fast)}
.tap:active{transform:scale(.97);transition-duration:var(--dur-press),var(--dur-fast),var(--dur-fast),var(--dur-fast),var(--dur-fast)}

/* ---------- shell ---------- */
.app{position:fixed;inset:0;background:var(--bg);overflow:hidden;transform-origin:50% 0}
.app.behind{border-radius:12px}
.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;
  padding:var(--top-h) 0 calc(var(--tab-h) + 40px);scroll-padding-top:calc(var(--top-h) + 8px)}
.page{max-width:720px;margin:0 auto;padding:0 var(--pad)}
.desk-only{display:none!important}

.mark{width:22px;height:22px;border-radius:6.5px;background:var(--ink);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:5.5px;border-radius:2.5px;border:1.5px solid var(--bg)}
.mark.sm{width:20px;height:20px;border-radius:6px}
.mark.sm::after{inset:5px}
.wm{font:600 17px/1 var(--font);letter-spacing:-.022em}
.chip-mode{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:500 12px/1 var(--font);letter-spacing:0;color:var(--ink-2);box-shadow:inset 0 0 0 var(--hair) var(--line);background:var(--surface)}

/* top bar (phones): transparent at rest, material + small title once the large title scrolls under */
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);
  background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--hair);background:var(--line);opacity:0;transition:opacity var(--dur-fast)}
.topbar.compact::after{opacity:1}
.tb{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.tb-l{display:flex;align-items:center}
.tb-t{font:600 17px/22px var(--font);letter-spacing:-.022em;opacity:0;transform:translateY(3px);transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.topbar.compact .tb-t{opacity:1;transform:none}
.tb-r{justify-self:end;display:flex;align-items:center;gap:8px}

/* tab bar (phones) */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;height:var(--tab-h);padding:0 2px env(safe-area-inset-bottom,0px);
  background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 var(--hair) 0 var(--line)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:6px;height:49px;font:500 10.5px/13px var(--font);letter-spacing:.01em;color:var(--ink-3);position:relative}
.tabbar a[aria-current=page]{color:var(--accent)}
.ti{position:relative;width:28px;height:28px;display:grid;place-items:center;transition:transform var(--dur-med) var(--spring-snappy)}
.tabbar a:active .ti{transform:scale(.88);transition-duration:var(--dur-press)}
.ti .i{width:25px;height:25px}
.ti .f{display:none}
[aria-current=page] .ti .o{display:none}
[aria-current=page] .ti .f{display:block}
.f .cut{stroke:var(--bg)}
.badge{position:absolute;top:-1px;left:17px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent-fill);color:var(--on-accent);
  font:600 12px/18px var(--font);letter-spacing:0;display:flex;justify-content:center;box-shadow:0 0 0 2px var(--bg);--lh:18px}

/* sidebar (desktop) */
.side{display:none}
@media (min-width:1024px){
  .views{left:var(--side-w)}
  .view{padding:40px 0 72px;scroll-padding-top:24px}
  .page{padding:0 40px;max-width:800px}
  .page.wide{max-width:1120px}
  .topbar,.tabbar,.phone-only{display:none!important}
  .desk-only{display:revert!important}
  .side{display:flex;flex-direction:column;position:absolute;top:0;bottom:0;left:0;width:var(--side-w);padding:20px 12px;
    border-right:var(--hair) solid var(--line);background:var(--bg);z-index:20}
}
.side-brand{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;margin-bottom:20px}
.side-brand .chip-mode{margin-left:auto}
.snav{display:grid;gap:2px}
.snav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:9px;font:500 14px/1 var(--font);letter-spacing:-.006em;color:var(--ink-2);
  transition:background-color var(--dur-fast),color var(--dur-fast)}
.snav a:hover{background:var(--hover);color:var(--ink)}
.snav a[aria-current=page]{background:var(--sel);color:var(--ink)}
.snav a[aria-current=page] .i{color:var(--accent)}
.snav .i{width:20px;height:20px}
.snav .cnt{margin-left:auto;font:500 12px/1 var(--font);color:var(--ink-2);font-variant-numeric:tabular-nums;--lh:14px;display:flex}
.side-foot{margin-top:auto;padding:0 10px;font:400 12px/16px var(--font);letter-spacing:0;color:var(--ink-3)}

/* ---------- large titles ---------- */
.lt{padding:6px 0 18px}
.lt-eye{font:500 13px/18px var(--font);letter-spacing:-.005em;color:var(--ink-2);min-height:18px}
.lt-h{font:700 34px/41px var(--font);letter-spacing:-.021em;text-wrap:balance;border-radius:6px}
.lt-h:focus-visible{outline-offset:4px}
.lt-h .yr{color:var(--ink-3);font-weight:600}
.lt-sub{font:400 15px/20px var(--font);color:var(--ink-2);margin-top:2px;min-height:20px;display:flex;align-items:baseline;gap:4px;--lh:20px}
.lt-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lt-act{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:2px}
@media (min-width:1024px){.lt{padding:0 0 24px}}

/* ---------- sections, cards, lists ---------- */
.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 10px}
.sec-h h2{font:600 20px/25px var(--font);letter-spacing:-.017em}
.sec-h .more{margin-left:auto;font:500 15px/20px var(--font);color:var(--accent);padding:4px 0;border-radius:6px}
.sec-h .more:hover{text-decoration:underline;text-underline-offset:3px}
.card,.list{background:var(--surface);border:var(--hair) solid var(--line);border-radius:14px;box-shadow:var(--lift)}
.list{overflow:hidden}
.sub-h{font:600 13px/18px var(--font);letter-spacing:-.005em;color:var(--ink-2);padding:0 2px 8px;margin-top:20px;display:flex;gap:6px}
.sub-h:first-child{margin-top:0}
.sub-h.late{color:var(--red)}
.hint{font:400 13px/18px var(--font);color:var(--ink-3);padding:10px 2px 0}
.hint kbd{font:500 12px/1 var(--font);padding:2px 5px;border-radius:5px;box-shadow:inset 0 0 0 var(--hair) var(--line);background:var(--surface);color:var(--ink-2)}

/* rows */
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt-t{font:500 15px/20px var(--font);letter-spacing:-.012em;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.rt-t.one{display:block;white-space:nowrap;text-overflow:ellipsis;-webkit-line-clamp:1}
.rt-m{font:400 13px/18px var(--font);letter-spacing:-.005em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-m .late{color:var(--red)}
.ph{color:var(--ink-3)}
.chev{width:16px;height:16px;color:var(--ink-3);stroke-width:2}

.thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center;position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 var(--hair) var(--img-edge);pointer-events:none}
.thumb.sm{width:44px;height:44px;border-radius:8px}
.thumb .th-b{position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:5px;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.thumb .th-b .i{width:12px;height:12px;stroke-width:2}
.tile{width:44px;height:44px;border-radius:10px;flex:none;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center}
.tile .i{width:20px;height:20px}

/* swipe row (Review) */
.sw{position:relative;overflow:hidden;background:var(--surface)}
.sw+.sw::before{content:"";position:absolute;top:0;right:0;left:84px;height:var(--hair);background:var(--line);z-index:2}
.sw-bg{position:absolute;inset:0;display:none;color:#fff}
.sw.swiping .sw-bg{display:block}
.sw[data-dir=r] .sw-bg{background:var(--accent-fill)}
.sw[data-dir=l] .sw-bg{background:var(--swipe-skip)}
.sw-act{position:absolute;top:0;bottom:0;width:92px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px/1 var(--font);letter-spacing:0}
.sw-act .i{width:24px;height:24px;stroke-width:2;transition:transform var(--dur-med) var(--spring-pop)}
.sw-act b{font-weight:600;opacity:.92}
.sw[data-dir=r] .sw-act.ok{display:flex;left:0;transform:translateX(max(0px,calc(var(--x) - 92px)))}
.sw[data-dir=l] .sw-act.no{display:flex;right:0;transform:translateX(min(0px,calc(92px - var(--x))))}
.sw.armed .sw-act .i{transform:scale(1.18)}
.sw-fg{position:relative;z-index:1;display:flex;align-items:center;background:var(--surface);touch-action:pan-y;-webkit-user-select:none;user-select:none;will-change:transform}
.sw-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 8px 10px 16px;text-align:left;border-radius:0;transition:background-color var(--dur-fast)}
.sw-main:focus-visible{outline:none}
.sw-fg::after{content:"";position:absolute;inset:1px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--accent);pointer-events:none;opacity:0;z-index:2}
.sw-fg:has(.sw-main:focus-visible)::after{opacity:1}
.sw-fg .chev{margin-right:14px}
.sw-btns{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:0 14px 0 56px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--row-h) 44px);transition:opacity var(--dur-fast)}
.rb{height:32px;padding:0 12px;border-radius:999px;font:500 13px/1 var(--font);letter-spacing:-.005em;color:var(--ink);background:var(--surface-2)}
.rb:hover{background:color-mix(in srgb,var(--surface-2) 90%,var(--ink))}
.rb.pri{background:var(--accent-fill);color:var(--on-accent)}
.rb.pri:hover{background:color-mix(in srgb,var(--accent-fill) 92%,#000)}
@media (hover:hover){.sw-fg:hover .sw-main{background:var(--row-h)}.prow:hover,.drow:hover,button.line:hover{background:var(--hover)}}
.sw-btns>button{pointer-events:none}
@media (hover:hover) and (pointer:fine){
  .sw-fg:hover .sw-btns{opacity:1}
  .sw-fg:hover .sw-btns>button{pointer-events:auto}
  .sw-fg .chev{display:none}
}
.sw-fg:has(:focus-visible) .sw-main{background:var(--row-h)}
.sw-fg:has(:focus-visible) .sw-btns{opacity:1}
.sw-fg:has(:focus-visible) .sw-btns>button{pointer-events:auto}
.sw-fg:has(:focus-visible) .chev{visibility:hidden}
.sw.gone{pointer-events:none}

/* plain rows */
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px 10px 16px;position:relative;text-align:left;transition:background-color var(--dur-fast)}
.prow+.prow::before,.line+.line::before,.drow+.drow::before{content:"";position:absolute;top:0;right:0;left:72px;height:var(--hair);background:var(--line)}
.line+.line::before{left:16px}
.drow+.drow::before{left:72px}
.prow:focus-visible,.drow:focus-visible,.line:focus-visible{outline-offset:-2px;border-radius:12px}
.prow.static{cursor:default}
.prow .pill{margin-left:4px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:500 12px/1 var(--font);letter-spacing:0;white-space:nowrap;flex:none}
.pill.need,.pill.work{background:var(--accent-tint);color:var(--accent)}
.pill.ok{background:var(--green-tint);color:var(--green)}
.pill.bad{background:var(--red-tint);color:var(--red)}
.pill.warn{background:var(--amber-tint);color:var(--amber)}
.pill.sched{background:var(--surface-2);color:var(--ink-2)}
.pill.quiet{color:var(--ink-3);box-shadow:inset 0 0 0 var(--hair) var(--line)}
.pd{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.work .pd,.act.work .pd{animation:pulse 1.6s var(--ease-in-out) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font:600 15px/1 var(--font);letter-spacing:-.01em;white-space:nowrap;position:relative}
.btn.lg{height:50px;font-size:17px;letter-spacing:-.02em;padding:0 22px}
.btn.sm{height:32px;padding:0 14px;font-size:14px;font-weight:500}
.btn.block{width:100%}
.btn.pri{background:var(--accent-fill);color:var(--on-accent)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent-fill) 92%,#000)}
.btn.gray{background:var(--surface-2);color:var(--ink)}
.btn.gray:hover{background:color-mix(in srgb,var(--surface-2) 92%,var(--ink))}
.sheet .btn.gray{background:var(--sheet-card);box-shadow:inset 0 0 0 var(--hair) var(--line)}
.btn[disabled]{opacity:.35;pointer-events:none}
.tbtn{display:inline-flex;align-items:center;height:36px;padding:0 10px;border-radius:999px;font:600 15px/1 var(--font);letter-spacing:-.01em;color:var(--accent);white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn.quiet{font-weight:500;color:var(--ink-2)}
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn .i{width:20px;height:20px;stroke-width:1.8}
.ibtn[disabled]{opacity:.3;pointer-events:none}

/* ---------- today ---------- */
.act-slot{margin-top:12px;min-height:32px;display:flex}
.act{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 var(--hair) var(--line),var(--lift);
  font:500 13px/1 var(--font);letter-spacing:-.005em;color:var(--ink);white-space:nowrap;overflow:hidden;max-width:100%}
.act:hover{background:color-mix(in srgb,var(--surface) 96%,var(--ink))}
.act .pd{background:var(--ink-3)}
.act.work .pd{background:var(--accent)}
.act-t{overflow:hidden;text-overflow:ellipsis}
.act .chev{width:13px;height:13px;margin-left:-2px}
.hero{padding-top:4px}
.hero-t{font:600 22px/29px var(--font);letter-spacing:-.019em;text-wrap:balance;max-width:560px}
.hero-t .dim{color:var(--ink-3)}
.hero .btn{margin-top:18px}
@media (max-width:600px){.hero .btn{width:100%}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:24px}
.stat{padding:12px 16px 13px;min-width:0}
.stat+.stat{box-shadow:inset var(--hair) 0 0 var(--line)}
.stat .n{font:600 22px/28px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;--lh:28px;display:flex}
.stat .l{font:400 13px/18px var(--font);letter-spacing:-.005em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:6px 6px 6px 14px;min-height:52px}
.banner .bd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--amber)}
.banner.bad .bd{background:var(--red)}
.banner .bt{flex:1;min-width:0;font:400 15px/20px var(--font);text-wrap:pretty}
.tgrid{display:block}
@media (min-width:1180px){
  .tgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0 40px;align-items:start}
  .tside>.sec:first-child{margin-top:0}
}
.note-card{padding:16px;font:400 15px/21px var(--font);color:var(--ink-2);text-wrap:pretty}
.rec{padding:16px 16px 10px}
.rec-t{font:600 15px/20px var(--font);letter-spacing:-.012em}
.rec-w{font:400 13px/18px var(--font);color:var(--ink-2);margin-top:4px;text-wrap:pretty}
.rec-a{display:flex;justify-content:flex-end;gap:2px;margin:8px -6px 0}

/* rolling digits */
.roll{display:inline-flex;height:var(--lh,1.2em);overflow:hidden;font-variant-numeric:tabular-nums}
.rc{display:inline-block;height:var(--lh,1.2em);overflow:hidden}
.rs{display:flex;flex-direction:column;transition:transform 700ms var(--spring-smooth)}
.rs>span,.rx{display:block;height:var(--lh,1.2em);line-height:var(--lh,1.2em)}

/* growth */
.gcard{padding:16px}
.gcard+.gcard{margin-top:12px}
.g-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.g-brand{font:600 15px/20px var(--font);letter-spacing:-.012em}
.g-when{font:400 13px/18px var(--font);color:var(--ink-2);margin-left:auto}
.g-big{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap}
.g-big .n{font:700 34px/41px var(--font);letter-spacing:-.022em;--lh:41px;display:flex}
.g-big .l{font:400 15px/20px var(--font);color:var(--ink-2)}
.dl{font:500 13px/18px var(--font);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.up{color:var(--green)}
.dl.dn{color:var(--red)}
.chart{position:relative;height:150px;margin-top:34px;touch-action:pan-y;border-radius:8px;cursor:crosshair}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.c-base{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.c-prev{fill:none;stroke:var(--ink-3);stroke-opacity:.4;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.c-cur{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1 0}
.c-end,.c-xd{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface);transform:translate(-50%,-50%);pointer-events:none}
.c-xh{position:absolute;top:0;bottom:6px;width:1px;background:var(--ink-3);opacity:.5;pointer-events:none}
.c-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font:500 12px/16px var(--font);letter-spacing:0;
  padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums;display:flex;gap:8px;z-index:2}
.c-tip span{opacity:.65}
.c-axis{display:flex;justify-content:space-between;align-items:center;gap:8px;font:400 12px/16px var(--font);letter-spacing:0;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.c-leg{display:flex;align-items:center;gap:6px}
.c-leg i{width:12px;height:2px;border-radius:1px;background:var(--accent);display:inline-block}
.c-leg i.pv{background:var(--ink-3);opacity:.5;margin-left:6px}
.bars-w{margin-top:18px}
.bars-h{font:500 13px/18px var(--font);color:var(--ink-2);margin-bottom:8px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:end;height:64px}
.bar-c{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;gap:4px}
.bar-t{flex:1;display:flex;align-items:flex-end}
.bar{display:block;width:100%;border-radius:3px 3px 2px 2px;background:var(--ink-3);opacity:.28;transform-origin:50% 100%}
.bar.cur{background:var(--accent);opacity:1}
.bar-l{font:400 11px/14px var(--font);color:var(--ink-3);text-align:center;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--hair);background:var(--line);border-radius:10px;overflow:hidden;margin-top:18px;box-shadow:0 0 0 var(--hair) var(--line)}
.kpi{background:var(--surface);padding:10px 12px;min-width:0}
.kpi .n{font:600 17px/22px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .l{font:400 12px/16px var(--font);letter-spacing:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .dl{font-size:12px;line-height:16px}
.g-foot{font:400 12px/16px var(--font);letter-spacing:0;color:var(--ink-3);margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 12px}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* hold to approve all */
.hold{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 12px;border-radius:999px;background:var(--surface);color:var(--ink);
  box-shadow:inset 0 0 0 var(--hair) var(--line),var(--shadow-1);font:600 15px/1 var(--font);letter-spacing:-.01em;-webkit-touch-callout:none;touch-action:manipulation}
.hold:hover{background:color-mix(in srgb,var(--surface) 96%,var(--ink))}
.hold.holding{transform:scale(.97);transition-duration:var(--dur-press)}
.hold-ring{width:24px;height:24px;flex:none;transform:rotate(-90deg)}
.hold-ring circle{fill:none;stroke-width:2.2}
.hr-bg{stroke:var(--line)}
.hr-fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.hr-ck{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transform:rotate(90deg);transform-origin:12px 12px}
.hold.held .hr-ck{stroke-dashoffset:0;transition:stroke-dashoffset var(--dur-base) var(--ease-out)}
.holdbar{position:sticky;bottom:calc(var(--tab-h) + 12px);display:flex;justify-content:center;margin-top:20px;z-index:3;pointer-events:none}
.holdbar .hold{pointer-events:auto;box-shadow:inset 0 0 0 var(--hair) var(--line),var(--shadow-2)}

/* empty + error + skeleton */
.empty{padding:56px 24px 48px;text-align:center}
/* gate: shown instead of the app when there is nothing of the client's to show (signed out, no brand yet, offline) */
.gate{position:fixed;inset:0;overflow-y:auto;background:var(--bg);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) var(--pad) calc(24px + env(safe-area-inset-bottom,0px))}
.gate-in{width:100%;max-width:420px;text-align:center}
.gate-brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px}
.gate-h{font:700 28px/34px var(--font);letter-spacing:-.021em;text-wrap:balance;border-radius:6px}
.gate-h:focus-visible{outline:none}      /* focused only so a screen reader starts here; it is not a control */
.gate-s{font:400 17px/24px var(--font);letter-spacing:-.01em;color:var(--ink-2);margin-top:10px;text-wrap:pretty}
.gate-a{display:grid;gap:10px;margin-top:28px}
.gate-n{font:400 14px/20px var(--font);color:var(--ink-3);margin-top:18px;text-wrap:pretty}
.empty-t{font:600 20px/25px var(--font);letter-spacing:-.017em}
.empty-s{font:400 15px/20px var(--font);color:var(--ink-2);margin-top:6px;text-wrap:balance}
.err-card{padding:20px 16px;display:grid;gap:4px;justify-items:start}
.err-card .btn{margin-top:12px}
.err-t{font:600 17px/22px var(--font);letter-spacing:-.02em}
.err-s{color:var(--ink-2)}
.sk{display:block;background:var(--skel);border-radius:6px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--shim),transparent);animation:shim 1.5s var(--ease-in-out) infinite}
@keyframes shim{to{transform:translateX(100%)}}
.sk-pill{width:190px;height:32px;border-radius:999px}
.sk-h1{width:78%;height:22px;margin-top:4px}
.sk-h2{width:52%;height:22px;margin-top:8px}
.sk-btn{width:172px;height:50px;border-radius:999px;margin-top:18px}
.sk-n{width:36px;height:22px;margin:3px 0 6px}
.sk-l{width:70%;height:12px;margin-bottom:3px}
.sk-sh{width:110px;height:20px}
.skrow{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 16px;position:relative}
.skrow+.skrow::before{content:"";position:absolute;top:0;right:0;left:84px;height:var(--hair);background:var(--line)}
.sk-th{width:56px;height:56px;border-radius:10px;flex:none}
.sk-tx{flex:1;display:grid;gap:8px}
.sk-l1{height:14px;width:82%}
.sk-l2{height:12px;width:46%}

/* ---------- calendar ---------- */
.cal-wrap{display:block}
@media (min-width:1024px){.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}}
.cal-card{padding:6px 6px 8px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font:500 12px/16px var(--font);letter-spacing:0;color:var(--ink-3);text-align:center;padding:6px 0 4px}
.dow .lg{display:none}
@media (min-width:1024px){.dow .sm{display:none}.dow .lg{display:inline}}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.cw{display:contents}
.cd{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;height:54px;padding-top:4px;border-radius:12px}
.cd:focus-visible{outline-offset:-2px}
.cd-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 17px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  transition:background-color var(--dur-fast),color var(--dur-fast)}
@media (hover:hover){button.cd:hover .cd-n{background:var(--hover)}}
.cd.today .cd-n{color:var(--accent);font-weight:600}
.cd.sel .cd-n{background:var(--ink);color:var(--bg);font-weight:600}
.cd.sel.today .cd-n{background:var(--accent-fill);color:var(--on-accent)}
.cd.out{color:var(--ink-3);opacity:.4}
.cd.past:not(.today) .cd-n{color:var(--ink-2)}
.cd-m{display:flex;align-items:center;justify-content:center;gap:3px;height:8px}
.mk{width:5px;height:5px;border-radius:50%;background:var(--ink-2);flex:none;display:inline-block}
.mk.reel{width:4px;height:8px;border-radius:1.5px}
.mk.need{background:var(--accent)}
.mk.bad{background:var(--red)}
.mk.done{background:transparent;box-shadow:inset 0 0 0 1.25px var(--ink-3)}
.mk.more{width:3px;height:3px;background:var(--ink-3)}
.cd-fl{position:absolute;left:-1px;right:-1px;bottom:4px;height:3px;background:var(--ink-3);opacity:.35}
.cd-fl.live{background:var(--green);opacity:.7}
.cd-fl.hold{background:var(--amber);opacity:.7}
.cd-fl.s{left:10%;border-top-left-radius:2px;border-bottom-left-radius:2px}
.cd-fl.e{right:10%;border-top-right-radius:2px;border-bottom-right-radius:2px}
@media (min-width:1024px){.cd{height:68px;padding-top:8px;gap:6px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 4px 0;font:400 12px/16px var(--font);letter-spacing:0;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .lfl{width:14px;height:3px;border-radius:2px;background:var(--ink-3);opacity:.5;display:inline-block}
.cal-sum{font:400 13px/18px var(--font);color:var(--ink-2);padding:8px 4px 0}
.cal-side{display:none}
@media (min-width:1024px){.cal-side{display:block;position:sticky;top:0}}
.dp-h{font:600 17px/22px var(--font);letter-spacing:-.02em;padding:2px 2px 10px}
.drow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px 10px 16px;position:relative;text-align:left;transition:background-color var(--dur-fast)}
.dtime{width:44px;flex:none;font:500 13px/18px var(--font);letter-spacing:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dempty{padding:18px 16px;color:var(--ink-2);font:400 15px/20px var(--font)}

/* ---------- posts ---------- */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:2px;border-radius:10px;background:var(--surface-2);margin-bottom:20px;max-width:480px}
.seg button{position:relative;z-index:1;height:32px;border-radius:8px;font:500 13px/1 var(--font);letter-spacing:-.005em;text-align:center;color:var(--ink-2);transition:color var(--dur-fast)}
.seg button[aria-selected=true]{color:var(--ink);font-weight:600}
.seg button:focus-visible{outline-offset:-2px}
.seg-th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n,4));border-radius:8px;background:var(--surface);
  box-shadow:0 3px 8px rgba(16,24,43,.10),0 1px 1px rgba(16,24,43,.04),var(--lift);transition:transform var(--dur-med) var(--spring-snappy);transform:translateX(calc(var(--i,0) * 100%))}
@media (prefers-color-scheme:dark){.seg-th{background:var(--elevated)}}
.grp+.grp{margin-top:28px}
.grp-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;font:600 13px/18px var(--font);letter-spacing:-.005em;color:var(--ink-2)}
.grp-u{font-weight:400;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- settings ---------- */
.line{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 16px;position:relative;text-align:left}
.line-v{flex:none;max-width:55%;font:400 15px/20px var(--font);color:var(--ink-2);text-align:right}
.line-v.s{font-size:13px;line-height:18px}
.rt-m.wrap{white-space:normal;text-wrap:pretty}
.grp .hint a{color:var(--accent);font-weight:500;border-radius:6px}
.grp .hint a:hover{text-decoration:underline;text-underline-offset:3px}
.appr{padding:12px 16px 14px}
.appr+.appr{border-top:var(--hair) solid var(--line)}
.appr .seg{margin-bottom:0;max-width:none}
.seg button[aria-checked=true]{color:var(--ink);font-weight:600}
.appr-n{font:600 15px/20px var(--font);margin-bottom:10px}
.appr-h{font:400 13px/18px var(--font);color:var(--ink-3);padding-top:10px;text-wrap:pretty}

/* ---------- sheets ---------- */
#layers{position:fixed;inset:0;z-index:100;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);background:var(--sheet-bg);
  border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow-3),var(--lift);outline:none;transform-origin:50% 0}
.sheet.full,.sheet.half{height:calc(100% - env(safe-area-inset-top,0px) - 10px)}
.sh-grab{height:18px;flex:none;display:grid;place-items:center;touch-action:none;cursor:grab}
.sh-grab i{width:36px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.35}
.sh-h{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 6px 20px;flex:none;touch-action:none}
.sh-t{font:600 17px/22px var(--font);letter-spacing:-.022em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-x{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.sh-x .i{width:16px;height:16px;stroke-width:2.2}
.sh-x:hover{color:var(--ink)}
.sh-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 24px}
.sh-f{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:inset 0 var(--hair) 0 var(--line);background:var(--sheet-bg);border-radius:0 0 inherit inherit}
.sh-f .grow{flex:1.6}
.sh-f .btn{flex:1;padding:0 12px}
.sheet .list,.sheet .card{background:var(--sheet-card)}
.sheet .sw,.sheet .sw-fg,.sheet .kpi{background:var(--sheet-card)}
@media (min-width:1024px){
  .layer{display:grid;place-items:center}
  .sheet{position:relative;bottom:auto;left:auto;right:auto;width:min(560px,calc(100% - 64px));max-height:min(860px,calc(100% - 64px));border-radius:20px;transform-origin:50% 50%}
  .sheet.full,.sheet.half{height:min(840px,calc(100% - 64px))}
  .sheet.half{height:auto}
  .sh-grab{display:none}
  .sh-h{padding-top:14px;padding-bottom:8px}
  .sh-f{border-radius:0 0 20px 20px;padding-bottom:14px}
}
.hero-clone{position:fixed;z-index:150;overflow:hidden;border-radius:14px;transform-origin:0 0;pointer-events:none;background:var(--surface-2)}
.hero-clone img{width:100%;height:100%;object-fit:cover}

/* detail */
.dh{flex:1;min-width:0}
.dh .sh-t{display:block}
.dh-s{font:400 13px/18px var(--font);color:var(--ink-2);font-variant-numeric:tabular-nums}
.dh-nav{display:flex;gap:2px}
.dm{position:relative;aspect-ratio:1/1;width:100%;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.dm img,.dm video{width:100%;height:100%;object-fit:cover}
.dm::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 var(--hair) var(--img-edge);pointer-events:none}
.dm.tall{aspect-ratio:9/16;max-height:62vh;width:auto;margin:0 auto;background:#000}
.dm.tall video{object-fit:contain}
.dm.txt{display:grid;place-items:center;padding:28px;background:var(--sheet-card);box-shadow:inset 0 0 0 var(--hair) var(--line)}
.dm.txt p{font:600 22px/28px var(--font);letter-spacing:-.019em;text-align:center;text-wrap:balance}
.dmeta{display:flex;align-items:center;gap:8px;margin-top:14px;font:400 13px/18px var(--font);color:var(--ink-2);flex-wrap:wrap}
.dnote{margin-top:12px;padding:10px 12px;border-radius:10px;font:400 13px/18px var(--font);text-wrap:pretty}
.dnote.warn{background:var(--amber-tint);color:var(--amber)}
.dnote.bad{background:var(--red-tint);color:var(--red)}
.dcap{font:400 17px/24px var(--font);letter-spacing:-.022em;margin-top:14px;white-space:pre-wrap;word-break:break-word;text-wrap:pretty;-webkit-user-select:text;user-select:text}
.dfacts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:18px;padding-top:14px;box-shadow:inset 0 var(--hair) 0 var(--line);font:400 13px/18px var(--font)}
.dfacts dt{color:var(--ink-3)}
.dfacts dd{color:var(--ink);font-variant-numeric:tabular-nums}
.bchk{position:absolute;inset:0;margin:auto;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0}
.btn.done .bl{opacity:0;transition:opacity 80ms}
.btn.done .bchk{opacity:1;stroke-dashoffset:0;transition:stroke-dashoffset 240ms var(--ease-out) 40ms}
.btn.done{animation:pop 500ms var(--spring-pop)}
@keyframes pop{0%{transform:scale(.97)}}

/* change sheet */
.cs-lead{font:400 15px/21px var(--font);color:var(--ink-2);text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--sheet-card);box-shadow:inset 0 0 0 var(--hair) var(--line);
  font:500 15px/1 var(--font);letter-spacing:-.01em}
.chip:hover{background:color-mix(in srgb,var(--sheet-card) 94%,var(--ink))}
.chip .i{width:16px;height:16px;stroke-width:2.2;display:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip[aria-pressed=true] .i{display:block}
.fld{display:block;margin-top:16px}
.fld textarea{width:100%;min-height:92px;resize:vertical;padding:12px 14px;border-radius:10px;border:var(--hair) solid var(--line);background:var(--sheet-card);color:var(--ink);
  font:400 15px/21px var(--font);letter-spacing:-.01em;-webkit-user-select:text;user-select:text}
.fld textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld textarea::placeholder{color:var(--ink-3)}

/* timeline */
.tl{list-style:none;display:grid}
.tl li{display:grid;grid-template-columns:48px 14px minmax(0,1fr);align-items:start;gap:0 8px;padding:8px 0;font:400 15px/20px var(--font)}
.tl time{font:500 13px/20px var(--font);letter-spacing:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl .td{width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin:7px 0 0 3px}
.tl li.now .td{background:var(--accent);animation:pulse 1.6s var(--ease-in-out) infinite}
.tl li.bad .td{background:var(--red)}
.tl li.later{color:var(--ink-2)}
.tl li.later .td{background:transparent;box-shadow:inset 0 0 0 1.25px var(--ink-3)}
.tl-sep{display:block!important;font:600 13px/18px var(--font)!important;color:var(--ink-2);padding:14px 0 2px!important}
.sheet-empty{font:400 15px/21px var(--font);color:var(--ink-2);padding:4px 0 8px;text-wrap:pretty}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--toast-b,var(--tab-h)) + 12px);z-index:300;transform:translateX(-50%);display:flex;align-items:center;gap:2px;min-height:44px;
  max-width:calc(100% - 32px);padding:0 16px;border-radius:999px;background:var(--toast-bg);color:var(--toast-ink);font:500 14px/18px var(--font);letter-spacing:-.01em;
  box-shadow:var(--shadow-3),var(--lift)}
.toast.has-u{padding-right:4px}
.toast .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:13px 0;font-variant-numeric:tabular-nums}
.toast .tu{height:36px;padding:0 12px;margin-left:6px;border-radius:999px;color:var(--toast-link);font-weight:600;flex:none}
.toast .tu:hover{background:rgba(255,255,255,.08)}
.toast .tu:focus-visible{outline-color:var(--toast-link)}
.toast .t-dot{width:8px;height:8px;border-radius:50%;background:#FF6B61;flex:none;margin-right:8px}
@media (min-width:1024px){.toast{left:calc(var(--side-w) + (100% - var(--side-w)) / 2);bottom:28px}}

/* view transitions: shared element (thumbnail -> detail), sheet rise, page scale */
::view-transition-group(hero){animation-duration:.36s;animation-timing-function:var(--spring-smooth);z-index:3}
::view-transition-group(sheet){z-index:2}
::view-transition-old(hero),::view-transition-new(hero){width:100%;height:100%;object-fit:cover;animation-duration:.2s}
::view-transition-image-pair(hero){overflow:hidden;border-radius:12px}
::view-transition-group(app){animation-duration:.47s;animation-timing-function:var(--spring-sheet)}
::view-transition-old(app){animation:none;opacity:0}
::view-transition-new(app){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
html[data-vt=open]::view-transition-new(sheet):only-child{animation:vt-rise .47s var(--spring-sheet) both}
html[data-vt=close]::view-transition-old(sheet):only-child{animation:vt-sink .28s var(--ease-out) both}
@media (min-width:1024px){
  html[data-vt=open]::view-transition-new(sheet):only-child{animation:vt-pop .36s var(--spring-smooth) both}
  html[data-vt=close]::view-transition-old(sheet):only-child{animation:vt-fade .18s var(--ease-out) both}
}
@keyframes vt-rise{from{transform:translateY(100%)}}
@keyframes vt-sink{to{transform:translateY(100%)}}
@keyframes vt-pop{from{opacity:0;transform:scale(.96)}}
@keyframes vt-fade{to{opacity:0;transform:scale(.97)}}

@media (prefers-reduced-transparency:reduce){
  .topbar,.tabbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){:root{--line:#9AA3B5;--ink-3:#5B6478}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}
  .sk::after{display:none}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}
</style>

const own = (o, k) => o != null && Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined;   // server strings as keys: never Object.prototype

const C = p => p.caption_en || p.caption || H(p);

const NUMW = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];

const plural = (n, w, ws) => n === 1 ? w : (ws || w + "s");

/* Client-facing filter: internal strategy notes never reach the owner's screen. */
const INTERNAL = /\b(native|mcp|openclaw|pricing|otto|phase|leonardo|video_generate|pilot)\b|€/i;

/* ================= rolling digits (tiny roller, no dependency) ================= */
const ROLL = {};
const DIG = "0123456789".split("").map(d => `<span>${d}</span>`).join("");
function rollH(key, value, from){
  const txt = String(value);
  const prev = key in ROLL ? ROLL[key] : (from != null ? String(from) : txt);
  ROLL[key] = txt;
  const n = Math.max(txt.length, prev.length), a = txt.padStart(n, " "), b = prev.padStart(n, " ");
  let cols = "";
  for(let i = 0; i < n; i++){
    const c = a[i], p = b[i];
    if(c === " ") continue;
    if(/\d/.test(c)){
      const s = /\d/.test(p) ? +p : 0;
      cols += `<span class="rc"><span class="rs"${s !== +c ? ` data-to="${c}"` : ""} style="transform:translateY(${-s * 10}%)">${DIG}</span></span>`;
    } else cols += `<span class="rx">${esc(c)}</span>`;
  }
  return `<span class="roll" aria-hidden="true">${cols}</span><span class="sr">${esc(txt)}</span>`;
}

  const go = () => $$(".rs[data-to]").forEach(s => { s.style.transform = `translateY(${-s.dataset.to * 10}%)`; s.removeAttribute("data-to"); });
  requestAnimationFrame(() => requestAnimationFrame(go));
}

/* ---------- today ---------- */
function activityOf(){
  const P = posts();
  const pub = P.filter(p => p.status === "publishing");
  if(pub.length) return {t: pub.length === 1 ? `Publishing to ${plat(pub[0].platform)}` : `Publishing ${pub.length} posts`, work: true};
  const rew = P.filter(p => p.status === "draft" && p.edit_note);
  if(rew.length) return {t: rew.length === 1 ? `Rewriting “${short(H(rew[0]), 28)}”` : `Rewriting ${rew.length} posts you changed`, work: true};
  const dr = P.filter(p => p.status === "draft" && isFuture(p)).sort(bySlot);
  if(dr.length){
    if(dr.length > 1) return {t: `Drafting ${dr.length} upcoming posts`, work: true};
    const d = toDate(dr[0].slot), k = dayDiff(d), noun = /^(reel|video)$/.test(dr[0].format || "") ? "reel" : "post";
    const day = k === 0 ? "today's" : k === 1 ? "tomorrow's" : k < 7 ? d.toLocaleDateString("en-GB", {weekday: "long"}) + "'s" : "";
    return {t: day ? `Drafting ${day} ${noun}` : `Drafting the ${noun} for ${dayMon(d)}`, work: true};
  }
  const g = DATA.growth || {};
  const drop = Object.values(g).map(x => (x.mom || {}).reach).filter(v => v != null && v <= -20).sort((a, b) => a - b)[0];
  if(drop != null) return {t: `Reach down ${Math.abs(Math.round(drop))}% this month`, work: false};
  const nx = nextUp()[0];
  if(nx) return {t: pendingList().length ? `Next post ${when(nx.slot)}` : `All caught up · next post ${when(nx.slot)}`, work: false};

let ACT_TXT = null;

function growthLive(){
  const g = DATA.growth || {};
  return Object.keys(g).filter(id => { const x = g[id] || {}, m = x.months || {}, c = own(m, x.current) || {}, p = own(m, x.previous) || {};
    return c.posts || p.posts || c.spend || p.spend || c.reach || p.reach; });
}
function delta(v, kind){                      // kind: pct | abs | inv (lower is better; otto_growth already inverts cpl)
  if(v == null) return `<span class="dl">No prior month</span>`;
  if(v === 0) return `<span class="dl">No change</span>`;
  const pct = Math.abs(v).toFixed(0) + "%";
  const txt = kind === "inv" ? pct + (v > 0 ? " lower" : " higher") : kind === "abs" ? (v > 0 ? "+" : "−") + fmtN(Math.abs(v)) : (v > 0 ? "+" : "−") + pct;
  return `<span class="dl ${v > 0 ? "up" : "dn"}">${txt}</span>`;
}
const monS = ym => MON[+String(ym).slice(5, 7) - 1] || "";
const monL = ym => new Date(ym + "-01T12:00").toLocaleDateString("en-GB", {month: "long"});
function resultsH(first){
  const ids = growthLive();

  const quiet = Object.keys(DATA.growth || {}).filter(id => !ids.includes(id));
  return sec("Results", "", ids.map(id => gcardH(id, first)).join("")
    + (quiet.length ? `<p class="hint">${esc(quiet.map(brandName).filter(Boolean).join(" and "))}: results start with the first published week.</p>` : ""));
}
function gcardH(id, first){

    ["Followers", c.followers != null ? fmtN(c.followers) : "—", delta(m.followers, "abs")]];
  if(paid) kp.push(["Leads and sales", fmtN(Math.round(c.results || 0)), delta(m.results, "pct")], ["Paid spend", cur + fmtN(Math.round(c.spend || 0)), delta(m.spend, "pct")],
    ["Cost per result", c.cpl != null ? cur + c.cpl : "—", delta(m.cpl, "inv")]);

    <header class="g-top"><span class="g-brand">${esc(brandName(id) || id)}</span><span class="g-when">${esc(monL(x.current))} vs ${esc(monL(x.previous))}</span></header>
    <div class="g-big"><span class="n">${rollH("g-" + id, fmtN(c.reach || 0), first ? "0" : null)}</span><span class="l">Reach</span>${delta(m.reach, "pct")}</div>
    ${chartH(id, x)}${barsH(id, x)}

    <footer class="g-foot">${x.best_pillar ? `<span>Best pillar: ${esc(x.best_pillar)}</span>` : ""}${x.started ? `<span>With Otto since ${esc(dayMon(new Date(x.started)))}</span>` : ""}${upd ? `<span>Updated ${esc(dayMon(upd))}</span>` : ""}</footer>
  </article>`;
}
const CH = {};
const CW = 600, CHt = 150, CT = 10, CB = 6;
const toPath = pts => { let d = "", pen = false; pts.forEach(p => { if(!p){ return; } d += (pen ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); pen = true; }); return d; };
function chartH(key, x){
  const daily = x.daily || [];
  const metric = daily.some(r => r.reach7 != null) ? "reach7" : daily.some(r => r.spend) ? "spend" : null;
  if(!metric || !x.current || !x.previous) return "";
  const nOf = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
  const nC = nOf(x.current), nP = nOf(x.previous);
  const cur = Array(nC).fill(null), prev = Array(nP).fill(null);
  daily.forEach(r => { const v = r[metric]; if(v == null || !r.dt) return; const ym = r.dt.slice(0, 7), i = +r.dt.slice(8, 10) - 1;
    if(ym === x.current) cur[i] = +v; else if(ym === x.previous) prev[i] = +v; });
  const vals = cur.concat(prev).filter(v => v != null);
  if(cur.filter(v => v != null).length < 2 && prev.filter(v => v != null).length < 2) return "";
  const max = Math.max(1, ...vals) * 1.08;
  const pts = (arr, n) => arr.map((v, i) => v == null ? null : [i / (n - 1) * CW, CT + (1 - v / max) * (CHt - CT - CB)]);
  const cp = pts(cur, nC), pp = pts(prev, nP), old = CH[key];
  const money = metric === "spend", cs = curSym(x.currency);
  CH[key] = {cp, pp, cur, prev, nC, nP, cm: x.current, pm: x.previous, fmt: v => money ? cs + fmtN(Math.round(v)) : fmtN(Math.round(v)), old: old && old.drawn ? old : null, drawn: false};
  let li = -1; cp.forEach((p, i) => { if(p) li = i; });
  const end = li >= 0 ? `<i class="c-end" style="left:${(cp[li][0] / CW * 100).toFixed(2)}%;top:${(cp[li][1] / CHt * 100).toFixed(2)}%"></i>` : "";
  const label = `${money ? "Paid spend per day" : "Seven-day reach"} for ${monL(x.current)} compared with ${monL(x.previous)}. Latest ${li >= 0 ? CH[key].fmt(cur[li]) : "not available"}.`;
  return `<div class="chart" data-chart="${esc(key)}" tabindex="0" role="img" aria-label="${esc(label)}">
    <svg viewBox="0 0 ${CW} ${CHt}" preserveAspectRatio="none" aria-hidden="true"><line class="c-base" x1="0" y1="${CHt - CB}" x2="${CW}" y2="${CHt - CB}"/><path class="c-prev" d="${toPath(pp)}"/><path class="c-cur" d="${toPath(cp)}" pathLength="1"/></svg>
    ${end}<i class="c-xh" hidden></i><i class="c-xd" hidden></i><span class="c-tip" hidden></span></div>
    <div class="c-axis"><span>1 ${esc(monS(x.current))}</span><span class="c-leg"><i></i>${esc(monS(x.current))}<i class="pv"></i>${esc(monS(x.previous))}</span><span>${nC} ${esc(monS(x.current))}</span></div>`;
}
function barsH(key, x){
  const ks = Object.keys(x.months || {}).sort().slice(-6);
  const metric = ks.some(k => x.months[k].reach) ? "reach" : ks.some(k => x.months[k].spend) ? "spend" : null;
  if(!metric || ks.length < 2) return "";
  const vals = ks.map(k => +x.months[k][metric] || 0), max = Math.max(1, ...vals);
  return `<div class="bars-w"><p class="bars-h">${metric === "reach" ? "Reach by month" : "Paid spend by month"}</p><div class="bars" data-bars="${esc(key)}">${ks.map((k, i) =>
    `<span class="bar-c" title="${esc(monL(k))}: ${esc(fmtN(vals[i]))}"><span class="bar-t"><span class="bar${k === x.current ? " cur" : ""}" style="height:${Math.max(4, vals[i] / max * 100).toFixed(1)}%"></span></span><span class="bar-l">${esc(monS(k))}</span></span>`).join("")}</div></div>`;
}
let CIO = null;
function inView(el){ const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight && r.width > 0; }
function armCharts(){
  const targets = $$(".chart:not([data-armed]), .bars:not([data-armed])");
  if(!targets.length) return;
  if(!CIO && "IntersectionObserver" in window) CIO = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ CIO.unobserve(e.target); reveal(e.target); } }), {threshold: .25});
  targets.forEach(el => { el.dataset.armed = "1"; if(!CIO || inView(el)) reveal(el); else CIO.observe(el); wireChart(el); });
}
function reveal(el){
  if(el.classList.contains("bars")){
    if(RM()) return;
    $$(".bar", el).forEach((b, i) => play(b, [{transform: "scaleY(0)"}, {transform: "scaleY(1)"}], {duration: 500, delay: i * 40, easing: EZ.pop, fill: "backwards"}));
    return;
  }
  const st = CH[el.dataset.chart]; if(!st) return;
  const path = el.querySelector(".c-cur"), ghost = el.querySelector(".c-prev"), end = el.querySelector(".c-end");
  st.drawn = true;
  if(RM()) return;
  if(st.old && st.old.cp.length === st.cp.length){            // updates morph point by point, never redraw
    const o = st.old, t0 = performance.now();
    const lerp = (a, b, t) => b.map((p, i) => p && a[i] ? [p[0], a[i][1] + (p[1] - a[i][1]) * t] : p);
    const step = now => { const t = Math.min(1, (now - t0) / 480), e = 1 - Math.pow(1 - t, 3);
      path.setAttribute("d", toPath(lerp(o.cp, st.cp, e))); if(o.pp.length === st.pp.length) ghost.setAttribute("d", toPath(lerp(o.pp, st.pp, e)));
      if(t < 1) requestAnimationFrame(step); };

  }
  path.style.strokeDasharray = "1 1";
  play(path, [{strokeDashoffset: 1}, {strokeDashoffset: 0}], {duration: 900, easing: EZ.out, fill: "backwards"}).then(() => { path.style.strokeDasharray = ""; });
  play(ghost, [{opacity: 0}, {opacity: 1}], {duration: 560, delay: 240, easing: "linear", fill: "backwards"});
  if(end) play(end, [{opacity: 0, transform: "translate(-50%,-50%) scale(.3)"}, {opacity: 1, transform: "translate(-50%,-50%) scale(1)"}], {duration: 500, delay: 820, easing: EZ.pop, fill: "backwards"});
}
function wireChart(el){
  if(!el.classList.contains("chart")) return;
  const st = () => CH[el.dataset.chart];
  const show = i => {
    const s = st(); if(!s) return;
    i = clamp(i, 0, s.nC - 1);
    const pi = Math.round(i / (s.nC - 1) * (s.nP - 1)), v = s.cur[i], pv = s.prev[pi];
    if(v == null && pv == null) return;
    el._i = i;
    const xh = el.querySelector(".c-xh"), xd = el.querySelector(".c-xd"), tip = el.querySelector(".c-tip"), x = i / (s.nC - 1) * 100;
    xh.hidden = false; xh.style.left = x + "%";
    if(v != null){ xd.hidden = false; xd.style.left = x + "%"; xd.style.top = (s.cp[i][1] / CHt * 100) + "%"; } else xd.hidden = true;
    tip.hidden = false; tip.style.left = clamp(x, 14, 86) + "%";
    tip.innerHTML = `<b>${i + 1} ${esc(monS(s.cm))} · ${v != null ? esc(s.fmt(v)) : "—"}</b>${pv != null ? `<span>${esc(monS(s.pm))} ${esc(s.fmt(pv))}</span>` : ""}`;
  };
  const hide = () => { ["c-xh", "c-xd", "c-tip"].forEach(c => { const n = el.querySelector("." + c); if(n) n.hidden = true; }); };
  el.addEventListener("pointermove", e => { const s = st(); if(!s) return; const r = el.getBoundingClientRect(); show(Math.round((e.clientX - r.left) / r.width * (s.nC - 1))); });
  el.addEventListener("pointerleave", hide);
  el.addEventListener("blur", hide);
  el.addEventListener("keydown", e => {
    const s = st(); if(!s) return;
    if(e.key === "ArrowLeft" || e.key === "ArrowRight"){ e.preventDefault(); let li = 0; s.cur.forEach((v, i) => { if(v != null) li = i; });
      show((el._i ?? li) + (e.key === "ArrowRight" ? 1 : -1)); }
    if(e.key === "Escape") hide();

}

      h += `<h2 class="sub-h">Coming up</h2><div class="list" role="list" data-list="rv-soon">${soon.map(pendRowH).join("")}</div>`;
    } else h += `<div class="list" role="list" data-list="rv-all">${P.map(pendRowH).join("")}</div>`;
    h += MQ.fine.matches ? `<p class="hint">Select a post and press <kbd>A</kbd> to approve, <kbd>S</kbd> to skip or <kbd>C</kbd> to ask for changes.</p>`

/* ---------- calendar ---------- */
let CAL = null;
const FLIGHT_OK = ["approved", "live", "paused", "ended"];
const postsOnIso = iso => posts().filter(p => { const d = toDate(p.slot); return d && isoD(d) === iso; }).sort(bySlot);
const flightsOn = iso => (DATA.campaigns || []).filter(c => FLIGHT_OK.includes(c.status) && c.start <= iso && iso <= c.end);
function renderCalendar(){
  const now = new Date();
  if(!CAL) CAL = {y: now.getFullYear(), m: now.getMonth(), sel: isoD(now)};
  const y = CAL.y, m = CAL.m, first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;

  $("cal-year").textContent = String(y);

/* ---------- settings ---------- */
const groupH = (t, rows) => rows ? `<section class="grp"><h2 class="grp-h"><span>${esc(t)}</span></h2><div class="list">${rows}</div></section>` : "";
const lineH = (label, sub, value, small) => `<div class="line"><span class="rt"><span class="rt-t one" dir="auto">${label}</span>${sub ? `<span class="rt-m">${sub}</span>` : ""}</span>${value != null && value !== "" ? `<span class="line-v${small ? " s" : ""}">${value}</span>` : ""}</div>`;
const JOB_ORDER = ["Planning", "Writing", "Scheduling", "Ideas", "Ads", "Analytics"];
const JOB_BY_ID = {orion: "Planning", quill: "Writing", sage: "Scheduling", nova: "Ideas", atlas: "Ads", echo: "Analytics"};
const JOB_BY_ROLE = [[/orchestr|plan/i, "Planning"], [/content|writ|copy/i, "Writing"], [/organic|schedul|publish/i, "Scheduling"], [/idea|trend/i, "Ideas"], [/paid|\bads?\b/i, "Ads"], [/analytic|report/i, "Analytics"]];
const JOB_DEFAULT = {Planning: "Keeps the month on schedule", Writing: "Writes and rewrites posts", Scheduling: "Slots posts into the best hours",
  Ideas: "Turns trends into post ideas", Ads: "Waiting for an ad account", Analytics: "Starts with the first published week"};
const PERSONA = /\b(orion|quill|sage|nova|atlas|echo)\b|\b[a-z]{2}-\d{3}\b|native|mcp|openclaw/i;
function jobOf(a){ if(own(JOB_BY_ID, a.id)) return JOB_BY_ID[a.id]; const hit = JOB_BY_ROLE.find(([re]) => re.test(a.role || "")); return hit ? hit[1] : null; }
function connPill(s){
  if(s === "connected") return pillH("Connected", "ok");
  if(/expired|error|disconnected|revoked|invalid/i.test(s || "")) return pillH("Reconnect needed", "bad");
  return pillH(own({not_connected: "Not connected", planned: "Planned"}, s) || cap1(String(s || "").replace(/_/g, " ")), "quiet");
}
/* the plan (plans.json → /otto-api/data brands[].plan_view): what is included and this month's use, one quiet link at most */
const PRICING_URL = "/pilot-landing.html#pricing";
function planGroup(B){
  const P = B.filter(b => b.plan_view && typeof b.plan_view === "object");
  if(!P.length) return "";
  const many = P.length > 1;
  const n = v => Math.round(N(v)).toLocaleString("en-GB");
  const use = (u, w, money) => !u ? "" : (money ? "€" : "") + n(u.used) + (u.limit != null ? " of " + (money ? "€" : "") + n(u.limit) : "") + " " + w;
  const rows = P.map(b => {
    const v = b.plan_view, U = v.usage || {};
    const inc = v.ended ? "Publishing is paused while there is no plan. Nothing has been deleted." : (Array.isArray(v.included) ? v.included : []).join(" · ");
    const month = [use(U.posts, "posts"), use(U.reels, "reels"), use(U.ad_budget_eur, "ad budget", true)].filter(Boolean).join(" · ");
    return lineH(many ? `<b style="font-weight:600">${esc(b.name)}</b>` : "Your plan", "", esc(v.label) + (v.until && !v.expired ? ` <span class="ph">until ${esc(dayMon(new Date(v.until + "T12:00:00")))}</span>` : ""), true)
      + (inc ? `<div class="line"><span class="rt"><span class="rt-m wrap">${esc(inc)}</span></span></div>` : "")
      + (month && !v.ended ? lineH("This month", "", esc(month), true) : "");
  }).join("");
  const add = P.some(b => !b.plan_view.paid_ads && !b.plan_view.ended) ? `<p class="hint"><a href="${PRICING_URL}" target="_blank" rel="noopener">Add paid campaigns</a></p>` : "";
  return `<section class="grp"><h2 class="grp-h"><span>Plan</span></h2><div class="list">${rows}</div>${add}</section>`;
}
/* how approvals reach each brand (brands[].approvals → POST /otto-api/action {kind:"brand", approvals}); no field = Telegram */
const APPR = [["email", "Email"], ["telegram", "Telegram"], ["app", "App only"]];
const APPR_HINT = {email: "Each morning, one short e-mail with the posts to approve. Approve and Skip work in one tap; Change opens the post here.",
  telegram: "Cards in Telegram, once your phone is paired with Otto's bot.",
  app: "Nothing is sent. Posts wait for you in Review.",
  both: "E-mail and Telegram. Pick one to keep only that."};
function apprOf(b){
  const v = b.approvals == null ? "telegram" : b.approvals;
  if(Array.isArray(v)){ const s = [...new Set(v.map(String))].filter(x => x === "email" || x === "telegram"); return s.length > 1 ? "both" : s[0] || "app"; }
  return APPR.some(x => x[0] === v) ? v : "app";
}
function approvalsGroup(B){
  if(!B.length) return "";
  const many = B.length > 1;
  const rows = B.map(b => {
    const cur = apprOf(b), i = APPR.findIndex(x => x[0] === cur);
    return `<div class="appr" data-appr-b="${esc(b.id)}">${many ? `<p class="appr-n" dir="auto">${esc(b.name)}</p>` : ""}`
      + `<div class="seg" role="radiogroup" aria-label="Approvals${many ? " for " + esc(b.name) : ""}" style="--n:3;--i:${Math.max(i, 0)}"><span class="seg-th"${i < 0 ? " hidden" : ""} aria-hidden="true"></span>`
      + APPR.map(([k, t], j) => `<button type="button" role="radio" aria-checked="${k === cur}" tabindex="${(i < 0 ? j === 0 : k === cur) ? 0 : -1}" data-appr="${k}" data-fk="appr:${esc(b.id)}:${k}">${t}</button>`).join("")
      + `</div><p class="appr-h">${esc(APPR_HINT[cur])}</p></div>`;
  }).join("");
  return `<section class="grp"><h2 class="grp-h"><span>Approvals</span></h2><div class="list">${rows}</div></section>`;
}
function paintAppr(bid){
  const box = document.querySelector(`[data-appr-b="${cssq(bid)}"]`), b = brands().find(x => x.id === bid); if(!box || !b) return;
  const cur = apprOf(b), i = APPR.findIndex(x => x[0] === cur);
  box.querySelector(".seg").style.setProperty("--i", Math.max(i, 0)); box.querySelector(".seg-th").hidden = i < 0;
  $$("[data-appr]", box).forEach(x => { const on = x.dataset.appr === cur; x.setAttribute("aria-checked", on); x.tabIndex = on ? 0 : -1; });
  box.querySelector(".appr-h").textContent = APPR_HINT[cur];
}
async function setApprovals(bid, v){
  const b = brands().find(x => x.id === bid); if(!b || apprOf(b) === v) return;
  const prev = b.approvals;
  b.approvals = v; paintAppr(bid); haptic();
  try{
    adopt(await send({kind: "brand", id: bid, approvals: v}));
    toast(v === "app" ? "Approvals stay in the app" : `Approvals by ${v === "email" ? "e-mail" : "Telegram"}`);
  }catch(e){ b.approvals = prev; paintAppr(bid); toast("Couldn't save. " + errText(e), {err: true}); }
}
function renderSettings(){
  const d = DATA, B = brands();
  let h = "";
  h += planGroup(B);
  h += approvalsGroup(B);
  h += groupH("Connections", (d.connections || []).map(c => lineH(esc(c.service), esc(c.brand), connPill(c.status))).join(""));
  // paid (otto_ads.py report writes ads[brand].daily; campaigns[] from otto_ads.py plan/launch)
  const ads = d.ads || {}, camps = d.campaigns || [];
  if(Object.keys(ads).length || camps.length){
    h += groupH("Paid", B.filter(b => own(ads, b.id) || camps.some(c => c.brand === b.id)).map(b => {
      const a = own(ads, b.id) || {}, days = Object.keys(a.daily || {}).sort(), last = days.length ? a.daily[days[days.length - 1]] : null;
      const y = net => last && last[net] ? last[net].yesterday : null;
      const m = y("meta"), g = y("google"), cur = (a.targets || {}).currency || "€";
      const cnt = s => camps.filter(c => c.brand === b.id && c.status === s).length;
      const conn = a.connections || {};
      const net = (name, v, unit, on) => v
        ? lineH(`${name}, yesterday`, "", `${esc(cur)}${Math.round(N(v.spend))} · ${Math.round(N(v.results))} ${unit} · ${v.cpl != null ? esc(cur) + Math.round(N(v.cpl) * 100) / 100 + " each" : "no cost data"}`, true)
        : lineH(name, "", on ? pillH("Connected", "ok") : pillH("Not connected", "quiet"));
      const held = camps.filter(c => c.brand === b.id && c.compliance_hold).length;
      const counts = [cnt("live") + " live", cnt("approved") + " scheduled", cnt("draft") ? cnt("draft") + " draft" : "", held ? held + " on hold for copy review" : ""].filter(Boolean).join(" · ");
      return lineH(`<b style="font-weight:600">${esc(b.name)}</b>`, "", esc(counts), true) + net("Meta ads", m, "leads or purchases", conn.meta) + net("Google Ads", g, "conversions", conn.google);
    }).join(""));
  }
  // signals: what the owner's decisions taught Otto + competitor sweep
  const tl = d.taste_log || [], cw = d.competitors || {};
  if(tl.length || Object.keys(cw).length){
    const agg = new Map();
    tl.forEach(t => { const k = String(t.pillar || "Other"); if(!agg.has(k)) agg.set(k, {a: 0, s: 0}); if(t.decision === "approve") agg.get(k).a++; if(t.decision === "skip") agg.get(k).s++; });
    const taste = [...agg.entries()].map(([k, v]) => ({k, a: v.a, s: v.s, net: v.a - v.s})).sort((x, z) => z.net - x.net).slice(0, 5)
      .map(r => lineH(esc(r.k), "", `${r.a} approved · ${r.s} skipped`, true)).join("");
    const comp = Object.entries(cw).map(([b, c]) => {
      const items = (c.items || []).slice(0, 4).map(it => esc(it.name) + (it.error ? " (unreachable)" : (it.promos || []).length ? ` (${esc(it.promos.slice(0, 2).join(", "))})` : "")).join(", ");
      const wn = c.last_sweep ? (isNaN(new Date(c.last_sweep)) ? esc(c.last_sweep) : dayMon(new Date(c.last_sweep))) : "";
      return lineH(`Competitors · ${esc(brandName(b) || b)}`, [items, wn ? "Checked " + wn : ""].filter(Boolean).join(" · "), `${N(c.changes)} change${N(c.changes) === 1 ? "" : "s"}`, true);
    }).join("");
    h += groupH("Signals", taste + comp);
  }
  // activity: one static line per job
  const rows = (d.fleet || []).map(a => ({job: jobOf(a), a})).filter(x => x.job)
    .sort((x, z) => JOB_ORDER.indexOf(x.job) - JOB_ORDER.indexOf(z.job))
    .map(({job, a}) => lineH(job, esc((a.feed || []).find(t => t && !PERSONA.test(t)) || JOB_DEFAULT[job]))).join("");
  h += groupH("Activity", rows);
  h += groupH("About", lineH("Data", LIVE ? "Live from your account" : "Preview. Changes made here are not saved.", LIVE ? pillH("Live", "ok") : pillH("Preview", "quiet"))
    + (updatedText() ? lineH("Last update", "", esc(updatedText().replace(/^Updated /, "")), true) : ""));
  $("settings-body").innerHTML = h;
}

/* ================= views (tabs) ================= */
const VIEWS = ["today", "review", "calendar", "posts", "settings"];
const TITLES = {today: "Today", review: "Review", calendar: "Calendar", posts: "Posts", settings: "Settings"};
const LEGACY = {top: "today", "queue-sec": "review", "plan-sec": "calendar", "pipeline-sec": "posts", "growth-sec": "today", settings: "settings"};
let VIEW = "today";
function viewFromHash(){ const h = decodeURIComponent(location.hash.slice(1)); return VIEWS.includes(h) ? h : (LEGACY[h] || null); }
function setView(v, o){
  o = o || {};
  if(!VIEWS.includes(v)) v = "today";
  const prev = VIEW;
  if(v === prev){
    if(o.fromTab){ const el = $("v-" + v); el.scrollTo({top: 0, behavior: RM() ? "auto" : "smooth"}); }
    if(o.focus) $("h-" + v).focus({preventScroll: true});
    syncNav(); return;
  }
  VIEW = v;
  const a = $("v-" + prev), b = $("v-" + v), dir = VIEWS.indexOf(v) > VIEWS.indexOf(prev) ? 1 : -1;
  b.hidden = false;
  if(o.animate !== false && !RM()){
    busy(+1);
    a.style.pointerEvents = "none";
    play(a, [{opacity: 1, transform: "none"}, {opacity: 0, transform: `translate3d(${-8 * dir}px,0,0)`}], {duration: 180, easing: EZ.out}).then(x => { if(VIEW !== prev) a.hidden = true; a.style.pointerEvents = ""; drop(x); });
    play(b, [{opacity: 0, transform: `translate3d(${8 * dir}px,0,0)`}, {opacity: 1, transform: "none"}], {duration: 180, easing: EZ.out}).then(x => { drop(x); busy(-1); });
  } else a.hidden = true;
  syncNav();
  if(location.hash.slice(1) !== v) history.replaceState(null, "", "#" + v);
  if(o.focus) $("h-" + v).focus({preventScroll: true});
  onViewScroll(); armCharts();
}
function syncNav(){
  $$("a[data-view]").forEach(a => { if(a.closest(".tabbar,.snav")){ if(a.dataset.view === VIEW) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); } });
  $("tb-t").textContent = TITLES[VIEW];
}
function onViewScroll(){
  const v = $("v-" + VIEW), h = $("h-" + VIEW); if(!v || !h) return;
  const topH = $("topbar").offsetHeight;
  $("topbar").classList.toggle("compact", h.getBoundingClientRect().bottom < topH + 2);
}
VIEWS.forEach(k => $("v-" + k).addEventListener("scroll", onViewScroll, {passive: true}));
addEventListener("hashchange", () => { const v = viewFromHash(); if(v) setView(v); else { DEEP = deepLink(); if(DEEP && DATA && !STACK.length) openDeep(); } });

/* ================= actions ================= */
const INFLIGHT = new Map();                   // id -> status we asked for (re-applied over fresher server data)
const QUEUE = new Map();                      // per-id request chain: an Undo never overtakes its approve
function enqueue(id, fn){ const p = (QUEUE.get(id) || Promise.resolve()).catch(() => {}).then(fn); QUEUE.set(id, p); return p; }
async function send(body){
  if(!LIVE){ await new Promise(r => setTimeout(r, 140)); return null; }      // preview: local only, nothing is saved
  const r = await fetch(API + "/action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body), credentials: "same-origin", redirect: "manual"});
  if(r.type === "opaqueredirect" || r.status === 401){ gate("signin"); throw new Error("your session has ended; sign in again"); }
  let j = null; try{ j = await r.json(); }catch(_){}
  if(!r.ok || !j) throw new Error((j && j.error) || "the server answered " + r.status);
  return j.data || null;
}
const errText = e => /fetch|network|load failed/i.test(String(e && e.message)) ? "Check your connection and try again." : cap1(String((e && e.message) || "Something went wrong")) + ".";
function adopt(data){
  if(data){ DATA = data; INFLIGHT.forEach((st, id) => { const p = byId(id); if(p) p.status = st; }); }
  scheduleRender();
}
const VERB = {approved: "approve", skipped: "skip", draft: "send", pending_approval: "move"};
function toastFor(status, slot, n, allFuture){
  if(status === "approved"){
    if(n > 1) return allFuture ? `Scheduled ${n} posts` : `Approved ${n} posts`;
    const d = toDate(slot);
    return d && d > new Date() ? `Scheduled · ${when(slot)}` : "Approved · its slot has passed";
  }
  return own({skipped: "Skipped", draft: "Sent to Otto for changes", pending_approval: "Moved back to review"}, status) || "Saved";
}
function decide(id, status, o){
  o = o || {};
  const p = byId(id); if(!p || p.status === status || !canTo(p.status, status)) return Promise.resolve(false);
  const prev = p.status, hook = H(p);
  p.status = status; if(o.note) p.edit_note = o.note;
  INFLIGHT.set(id, status);
  const body = {kind: "post", id, status}; if(o.note) body.note = o.note;
  const req = enqueue(id, () => send(body));
  refreshCounts();
  if(!o.quiet) toast(toastFor(status, p.slot), canTo(status, prev) ? {undo: () => undo(id, prev, status)} : {});
  animateOut(id, status).then(() => scheduleRender(o.focusNext ? {focus: "open:" + o.focusNext} : null));
  return req.then(data => { if(INFLIGHT.get(id) === status) INFLIGHT.delete(id); adopt(data); return true; }, err => {
    if(INFLIGHT.get(id) === status) INFLIGHT.delete(id);
    const q = byId(id); if(q && q.status === status){ q.status = prev; if(o.note) delete q.edit_note; }
    scheduleRender();
    toast(`Couldn't ${VERB[status] || "save"} “${short(hook, 28)}”. ${errText(err)}`, {err: true});
    return false;
  });
}
function undo(id, prev, from){
  const p = byId(id); if(!p || p.status !== from) return;
  p.status = prev; delete p.edit_note;
  INFLIGHT.set(id, prev);
  refreshCounts(); scheduleRender();
  enqueue(id, () => send({kind: "post", id, status: prev})).then(data => { if(INFLIGHT.get(id) === prev) INFLIGHT.delete(id); adopt(data); }, err => {
    if(INFLIGHT.get(id) === prev) INFLIGHT.delete(id);
    const q = byId(id); if(q && q.status === prev) q.status = from;
    refreshCounts(); scheduleRender();
    toast("Couldn't undo. " + errText(err), {err: true});
  });
}
async function approveAll(){
  const P = pendingList(); if(!P.length) return;
  const ids = P.map(p => p.id);
  P.forEach(p => { p.status = "approved"; INFLIGHT.set(p.id, "approved"); });
  refreshCounts();
  haptic();
  toast(toastFor("approved", null, ids.length, P.every(isFuture)), {undo: () => ids.forEach(id => undo(id, "pending_approval", "approved")),
    ms: 5000 + (RM() ? 0 : ids.length * 40 + 400)});     // the Undo window starts counting once the rows have left, not while they leave
  busy(+1);
  await Promise.all(ids.map((id, i) => wait(i * 40).then(() => animateOut(id, "approved"))));
  busy(-1); scheduleRender();
  const res = await Promise.allSettled(ids.map(id => enqueue(id, () => send({kind: "post", id, status: "approved"}))));
  let bad = 0, last = null;
  res.forEach((r, i) => { const id = ids[i];
    if(INFLIGHT.get(id) === "approved") INFLIGHT.delete(id);
    if(r.status === "fulfilled"){ if(r.value) last = r.value; }
    else { bad++; const q = byId(id); if(q && q.status === "approved") q.status = "pending_approval"; } });
  if(last) adopt(last); else scheduleRender();
  refreshCounts();
  if(bad) toast(`Couldn't approve ${bad} ${plural(bad, "post")}. ${errText(res.find(r => r.status === "rejected").reason)}`, {err: true});
  if(LIVE) refresh();
}
async function recAct(id, status){
  const r = (DATA.recommendations || []).find(x => x.id === id); if(!r) return;
  const prev = r.status; r.status = status;
  const card = document.querySelector(`[data-rec="${cssq(id)}"]`);
  const secEl = card && card.closest(".sec");
  if(secEl){ busy(+1); await collapse(secEl); busy(-1); }
  scheduleRender();
  toast(status === "done" ? "Marked as done" : "Hidden for now", status === "dismissed" ? {undo: () => { r.status = prev; scheduleRender();
    send({kind: "rec", id, status: "proposed"}).then(adopt, e => toast("Couldn't undo. " + errText(e), {err: true})); }} : {});
  try{ adopt(await send({kind: "rec", id, status})); }
  catch(e){ r.status = prev; scheduleRender(); toast("Couldn't save. " + errText(e), {err: true}); }
}

/* row motion: fly off in the decision's direction, then collapse while the rows below move up */
function flyRow(row, dir, x0, v){
  const fg = row.querySelector(".sw-fg"), W = row.offsetWidth, to = dir * (W + 24);
  row.classList.add("swiping", "flying", "armed"); row.dataset.dir = dir > 0 ? "r" : "l";
  const dur = clamp(Math.abs(to - x0) / Math.max(Math.abs(v || 0), 1.7), 150, 280);
  busy(+1);
  play(row, [{"--x": Math.abs(x0) + "px"}, {"--x": W + "px"}], {duration: dur, easing: EZ.out});
  return play(fg, [{transform: `translate3d(${x0}px,0,0)`}, {transform: `translate3d(${to}px,0,0)`}], {duration: dur, easing: EZ.out}).then(() => busy(-1));
}
function collapse(el){
  el.classList.add("gone");
  const h = el.offsetHeight;
  el.style.overflow = "hidden";
  return play(el, [{height: h + "px", opacity: 1}, {height: "0px", opacity: 0, offset: 1}], {duration: 420, easing: EZ.smooth}).then(() => el.remove());
}
function expand(el){
  const h = el.offsetHeight;
  busy(+1);
  return play(el, [{height: "0px", opacity: 0}, {height: h + "px", opacity: 1}], {duration: 420, easing: EZ.smooth}).then(a => { drop(a); busy(-1); });
}
function animateOut(id, status){
  const rows = $$(`#v-${VIEW} .sw[data-id="${cssq(id)}"]`).filter(r => !r.classList.contains("gone"));
  if(!rows.length) return Promise.resolve();
  busy(+1);
  return Promise.all(rows.map(async r => {
    if(!r.classList.contains("flying")){
      if(status === "draft") await play(r.querySelector(".sw-fg"), [{opacity: 1}, {opacity: 0}], {duration: 160, easing: "linear"});
      else await flyRow(r, status === "approved" ? 1 : -1, 0, 0);
    }
    await collapse(r);
  })).then(() => busy(-1));
}
function nextRowAfter(id){
  const rows = $$(`#v-${VIEW} .sw:not(.gone)`), i = rows.findIndex(r => r.dataset.id === id);
  const n = rows[i + 1] || rows[i - 1];
  return n ? n.dataset.id : null;
}
function rowAct(id, act, el, kbd){
  if(act === "change") return openChange(id, el);
  decide(id, act === "approve" ? "approved" : "skipped", {focusNext: kbd || (el && el.matches(":focus-visible")) ? nextRowAfter(id) : null});
}

/* ================= swipe (iOS Mail rows: right approves, left skips) ================= */
let SUPPRESS = {until: 0, row: null};
document.addEventListener("pointerdown", e => {
  if(e.pointerType === "mouse" && e.button !== 0) return;
  const fg = e.target.closest && e.target.closest(".sw-fg");
  if(!fg || e.target.closest(".sw-btns") || STACK.length) return;
  const row = fg.parentElement;
  if(row.classList.contains("gone") || row.classList.contains("flying")) return;
  let base = 0;
  const an = fg.getAnimations();
  if(an.length){ base = new DOMMatrixReadOnly(getComputedStyle(fg).transform).m41 || 0; an.forEach(a => a.cancel()); fg.style.transform = base ? `translate3d(${base}px,0,0)` : ""; }
  SW = {row, fg, id: row.dataset.id, sx: e.clientX, sy: e.clientY, base, x: base, w: row.offsetWidth, pid: e.pointerId, lock: null, pts: [[e.timeStamp, base]], armed: 0};
  if(base) swLock();
});
function swLock(){
  SW.lock = "x";
  try{ SW.fg.setPointerCapture(SW.pid); }catch(_){}
  SW.row.classList.add("swiping");
  document.documentElement.classList.add("dragging");
  const sel = getSelection && getSelection(); if(sel && sel.removeAllRanges) sel.removeAllRanges();
}
document.addEventListener("pointermove", e => {
  if(!SW || e.pointerId !== SW.pid) return;
  const dx = e.clientX - SW.sx, dy = e.clientY - SW.sy;
  if(!SW.lock){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if(Math.abs(dy) >= Math.abs(dx)){ SW = null; return; }             // vertical: the list scrolls
    swLock();
