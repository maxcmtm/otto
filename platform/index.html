<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Otto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Type scale 34 / 22 / 17 / 15 / 13 / 12 · spacing 4 / 8 / 12 / 16 / 24 / 32 · radii 12 / 16 / pill (thumbnails 10) */
:root{
  color-scheme:light dark;
  --canvas:#F5F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --faint:#86868B;
  --hair:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.07);
  --cobalt:#2447F0; --cobalt-tint:#EEF2FF; --on-accent:#FFFFFF;
  --amber:#B25E09; --green:#1B7F4B; --red:#C62828; --red-tint:rgba(198,40,40,.08);
  --bar:rgba(245,245,247,.8); --scrim:rgba(0,0,0,.4); --toast:rgba(29,29,31,.94); --on-toast:#FFFFFF;
  --shadow-s:0 1px 2px rgba(0,0,0,.04); --shadow-l:0 24px 64px rgba(0,0,0,.18);
  --nav-h:calc(56px + env(safe-area-inset-bottom,0px));
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,Arial,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --canvas:#000;--surface:#1C1C1E;--ink:#F5F5F7;--muted:#98989D;--faint:#6E6E73;--hair:rgba(84,84,88,.6);
  --cobalt:#4D6BFF;--cobalt-tint:rgba(77,107,255,.16);--amber:#FF9F0A;--green:#30D158;--red:#FF453A;--shadow-s:none;
  --fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.14);--red-tint:rgba(255,69,58,.16);
  --bar:rgba(22,22,23,.8);--scrim:rgba(0,0,0,.6);--toast:rgba(58,58,60,.96);--shadow-l:none;
}}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--canvas);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:15px/1.47 var(--font);color:var(--ink);background:var(--canvas);min-height:100vh;padding-bottom:var(--nav-h);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.num,.stat .n,.gk .n,.gn,.sh .n{font-variant-numeric:tabular-nums}

/* ---------- app bar (phones) ---------- */
.appbar{position:sticky;top:0;z-index:50;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:border-color .2s}
.appbar.scrolled{border-bottom-color:var(--hair)}
.appbar-in{max-width:720px;margin:0 auto;padding:0 16px;height:44px;display:flex;align-items:center;gap:8px}
.mark{width:24px;height:24px;border-radius:7px;background:var(--cobalt);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:6px;border-radius:3px;border:1.5px solid var(--on-accent);opacity:.9}
.wordmark{font:600 17px/1 var(--font);letter-spacing:-.02em}
.spacer{flex:1}
.mode{font:400 13px/1 var(--font);color:var(--faint)}

/* ---------- sidebar (desktop) ---------- */
.side{display:none}
.snav{display:grid;gap:4px}
.snav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;font:500 15px/1 var(--font);color:var(--ink)}
.snav a svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.snav a:hover{background:var(--fill-2)}
.snav a.on{background:var(--fill)}
.snav a.on svg{stroke:var(--cobalt)}
.snav .cnt{margin-left:auto;font:500 13px/1 var(--font);color:var(--muted)}
@media(min-width:900px){
  body{padding-bottom:0}
  .appbar,.bnav{display:none!important}
  .side{display:flex;flex-direction:column;gap:24px;position:fixed;top:0;bottom:0;left:0;width:220px;padding:24px 12px;border-right:1px solid var(--hair);background:var(--canvas);z-index:40}
  .side-brand{display:flex;align-items:center;gap:8px;padding:0 12px;height:32px}
  .side-foot{margin-top:auto;padding:0 12px}
  .main{margin-left:220px}
}

/* ---------- layout ---------- */
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
@media(min-width:900px){.wrap{padding:24px 32px 64px}}
section{padding-top:32px;scroll-margin-top:calc(52px + env(safe-area-inset-top,0px))}
@media(min-width:900px){section{scroll-margin-top:24px}}
.sh{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:8px}
.sh h2{font:700 22px/1.25 var(--font);letter-spacing:-.02em}
.sh .n{font:400 15px/1 var(--font);color:var(--faint)}
.sub-h{font:600 13px/1.3 var(--font);color:var(--muted);padding:0 16px;margin:24px 0 8px}
.sh + .sub-h{margin-top:8px}

/* ---------- banners ---------- */
.banner{display:flex;align-items:center;gap:12px;margin-top:16px;padding:4px 4px 4px 16px;min-height:52px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-s)}
.banner .bt{flex:1;min-width:0;font-size:15px;line-height:1.4}
.banner.err .bt{color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bl{flex:none;display:inline-flex;align-items:center;height:44px;padding:0 12px;font:600 15px/1 var(--font);color:var(--cobalt)}

/* ---------- today ---------- */
.today{padding-top:24px}
.date{font:500 13px/1.3 var(--font);color:var(--muted)}
.title{font:700 34px/1.12 var(--font);letter-spacing:-.025em;margin-top:4px}
.status{font:400 17px/1.4 var(--font);color:var(--muted);margin-top:8px;max-width:560px}
.cta{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;margin-top:16px;border-radius:999px;background:var(--cobalt);color:var(--on-accent);font:600 15px/1 var(--font);transition:opacity .15s}
.cta:active{opacity:.8}
@media(max-width:560px){.cta{display:flex;width:100%;height:50px;font-size:17px}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:24px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-s)}
.stat{padding:12px 16px;min-width:0}
.stat+.stat{border-left:1px solid var(--hair)}
.stat .n{font:600 22px/1.25 var(--font);letter-spacing:-.02em}
.stat .l{font-size:13px;line-height:1.3;color:var(--muted);margin-top:2px}

/* ---------- lists ---------- */
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-s)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:12px 16px;position:relative;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:1px;background:var(--hair)}
.list.q{--inset:84px}
.list.p{--inset:60px}
button.row{transition:background .15s}
button.row:active{background:var(--fill-2)}
@media(hover:hover){button.row:hover{background:var(--fill-2)}}
.rt{display:block;flex:1;min-width:0}
.rt .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.4}
.rt .t.one{display:block;white-space:nowrap;text-overflow:ellipsis}
.rt .m{display:block;font-size:13px;line-height:1.35;color:var(--muted);margin-top:2px}
.rt .m.late{color:var(--red)}
.rt .ph{color:var(--faint)}
.val{flex:none;font-size:15px;color:var(--muted);text-align:right}
.val.s{font-size:13px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--fill);color:var(--faint);display:grid;place-items:center}
.thumb svg{width:24px;height:24px}
.tile{width:32px;height:32px;border-radius:10px;flex:none;background:var(--fill);color:var(--ink);display:grid;place-items:center;font:600 12px/1 var(--font)}
.tile svg{width:18px;height:18px}
.chev{width:8px;height:14px;flex:none;fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:16px;color:var(--muted);font-size:15px}
.pill{flex:none;font:500 12px/1 var(--font);padding:6px 8px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap}
.pill.need{background:var(--cobalt-tint);color:var(--cobalt)}
.pill.fail{background:var(--red-tint);color:var(--red)}

/* ---------- recommendation ---------- */
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;padding:16px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-s)}
.rec-t{flex:1 1 260px;min-width:0}
.rec-title{font:600 15px/1.4 var(--font)}
.rec-why{font-size:13px;line-height:1.4;color:var(--muted);margin-top:2px}
.rec-act{display:flex;align-items:center;margin:-8px -8px -8px auto}
.tbtn{display:inline-flex;align-items:center;height:44px;padding:0 12px;border-radius:999px;font:600 15px/1 var(--font);color:var(--cobalt);white-space:nowrap}
.tbtn.quiet{font-weight:400;color:var(--muted)}
.tbtn.busy{opacity:.4;pointer-events:none}

/* ---------- calendar ---------- */
.gnav{margin-left:auto;display:flex}
.gnav button{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;color:var(--cobalt)}
.gnav button:active{background:var(--fill-2)}
.gnav svg{width:10px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-s);padding:8px 8px 0}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow span{text-align:center;font:500 12px/1 var(--font);color:var(--faint);padding:8px 0}
.gcol{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 8px;border-radius:12px}
.gcol.off{visibility:hidden}
.gn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:400 15px/1 var(--font);transition:background .15s,color .15s}
@media(hover:hover){button.gcol:hover .gn{background:var(--fill-2)}}
.gcol.today .gn{color:var(--cobalt);font-weight:600}
.gcol.sel .gn{background:var(--ink);color:var(--canvas);font-weight:600}
.gcol.sel.today .gn{background:var(--cobalt);color:var(--on-accent)}
.gmk{display:flex;align-items:center;justify-content:center;gap:4px;height:5px}
.gdot{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.gdot.need{background:var(--cobalt)}
.gbar{width:12px;height:2px;border-radius:1px;background:var(--faint);opacity:.6}
.agenda{border-top:1px solid var(--hair);margin:4px -8px 0;padding:4px 8px 8px}
.ag-h{font:600 13px/1.3 var(--font);color:var(--muted);padding:12px 8px 4px}
.ag{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center;width:100%;padding:8px;border-radius:12px;text-align:left}
button.ag:active{background:var(--fill-2)}
.ag-t{grid-column:1;font-size:15px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-m{grid-column:1;font-size:13px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .pill{grid-column:2;grid-row:1/3}
.ag-empty{padding:8px;font-size:15px;color:var(--muted)}

/* ---------- posts ---------- */
.bgroup + .bgroup{margin-top:24px}
.bhead{display:flex;align-items:baseline;gap:8px;padding:0 16px 8px;min-width:0}
.bhead .bn{font:600 15px/1.3 var(--font);white-space:nowrap}
.bhead .bu{font-size:13px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- growth ---------- */
.growth{display:grid;gap:12px}
.gcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-s);padding:16px;display:grid;gap:16px}
.gh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gh .bn{font:600 17px/1.3 var(--font)}
.gh .since,.gh .best{font-size:13px;color:var(--muted)}
.gh .best{margin-left:auto}
.gkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.gk{background:var(--fill-2);border-radius:12px;padding:12px}
.gk .n{font:600 22px/1.2 var(--font);letter-spacing:-.02em}
.gk .l{font-size:13px;color:var(--muted);margin-top:2px}
.dl{display:block;font:500 12px/1.3 var(--font);margin-top:4px;color:var(--faint)}
.dl.up{color:var(--green)}
.dl.dn{color:var(--red)}
.spark{width:100%;height:56px;display:block}
.spark .ln{fill:none;stroke:var(--cobalt);stroke-width:1.5}
.spark .ar{fill:var(--cobalt-tint)}
.spark .st{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.gfoot{font-size:12px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}
.gfoot span:last-child{margin-left:auto}
.note{font-size:13px;color:var(--muted);padding:0 16px}

footer{margin-top:32px;padding:0 16px;font-size:12px;color:var(--faint)}

/* ---------- tab bar (phones) ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;padding:8px 0 4px;font:500 12px/1 var(--font);color:var(--faint);position:relative;letter-spacing:0}
.bnav a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bnav a.on{color:var(--cobalt)}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:999px;background:var(--cobalt);color:var(--on-accent);font:600 12px/18px var(--font);text-align:center;padding:0 4px}

/* ---------- review sheet ---------- */
.reviewer{position:fixed;inset:0;z-index:100;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.reviewer.open{display:flex}
.sheet:focus{outline:none}
.sheet{width:100%;max-width:480px;height:calc(100% - 12px - env(safe-area-inset-top,0px));background:var(--canvas);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-l)}
@media(min-width:900px){.reviewer{align-items:center}.sheet{height:min(860px,calc(100% - 64px));border-radius:16px}}
.rv-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 4px;flex:none}
.rv-bar button{height:44px;padding:0 12px;font:400 17px/1 var(--font);color:var(--cobalt)}
.rv-bar button:disabled{opacity:.3}
#rv-close{justify-self:start}
#rv-later{justify-self:end}
.rv-prog{font:600 15px/1 var(--font);font-variant-numeric:tabular-nums}
.rv-stage{flex:1;min-height:0;position:relative;padding:0 16px}
.rv-card{height:100%;background:var(--surface);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none;will-change:transform}
.rv-card.fly{transition:transform .26s ease-in,opacity .26s ease-in}
.rv-card.snap{transition:transform .2s ease-out}
.rv-head{display:flex;align-items:center;gap:12px;padding:12px 16px;flex:none}
.rv-av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--fill);font:600 13px/1 var(--font)}
.rv-media{flex:none;aspect-ratio:1/1;max-height:44vh;background:var(--fill);overflow:hidden;display:grid}
.rv-media img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.rv-txt{display:grid;place-items:center;padding:24px;text-align:center;font:600 22px/1.3 var(--font);letter-spacing:-.02em}
.rv-body{padding:12px 16px 16px;overflow-y:auto;flex:1;min-height:0;user-select:text}
.rv-cap{font-size:15px;line-height:1.47;white-space:pre-wrap;word-break:break-word}
.rv-meta{font-size:13px;color:var(--muted);margin-top:12px}
.rv-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));flex:none}
.rv-actions button{height:50px;border-radius:999px;font:600 17px/1 var(--font);text-align:center;transition:opacity .15s}
.rv-actions button:active{opacity:.8}
.rv-actions button:disabled{opacity:.3;pointer-events:none}
#rv-skip{background:var(--fill);color:var(--ink)}
#rv-ok{background:var(--cobalt);color:var(--on-accent)}
.rv-empty{height:100%;display:grid;place-content:center;text-align:center;gap:8px;padding:32px}
.rv-empty .big{font:700 22px/1.25 var(--font);letter-spacing:-.02em}
.rv-empty .sub{font-size:15px;color:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%) translateY(16px);z-index:120;background:var(--toast);color:var(--on-toast);font:500 13px/1.3 var(--font);border-radius:999px;padding:12px 16px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.reviewer.open ~ .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.toast{bottom:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <div class="appbar-in">
    <span class="mark" aria-hidden="true"></span>
    <span class="wordmark">Otto</span>
    <span class="spacer"></span>
    <span class="mode" hidden>Preview</span>
  </div>
</header>

<aside class="side" aria-label="Sections">
  <div class="side-brand"><span class="mark" aria-hidden="true"></span><span class="wordmark">Otto</span></div>
  <nav class="snav">
    <a href="#top" data-sec="top" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Today</a>
    <a href="#queue-sec" data-sec="queue-sec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.3 2.3 4.7-4.9"/></svg>Review<span class="cnt" id="side-badge" hidden></span></a>
    <a href="#plan-sec" data-sec="plan-sec"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>Calendar</a>
    <a href="#pipeline-sec" data-sec="pipeline-sec"><svg viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>Posts</a>
    <a href="#settings" data-sec="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</a>
  </nav>
  <div class="side-foot"><span class="mode" hidden>Preview</span></div>
</aside>

<div class="main">
<div class="wrap">
  <div class="banner" id="setup-banner" hidden><span class="bt">Connect Instagram and Facebook to start publishing.</span><a class="bl" href="#settings">Connect</a></div>
  <div class="banner err" id="fail-banner" hidden><span class="bt"></span><a class="bl" href="#pipeline-sec">View</a></div>

  <section class="today" id="top">
    <p class="date" id="brief-date"></p>
    <h1 class="title">Today</h1>
    <p class="status" id="status"></p>
    <button class="cta" id="review-cta" type="button" hidden></button>
    <div class="stats" id="stats"></div>
  </section>

  <section id="queue-sec">
    <div class="sh"><h2>Needs you</h2></div>
    <div id="queue"></div>
    <div id="rec"></div>
  </section>

  <section id="plan-sec">
    <div class="sh">
      <h2 id="gantt-month"></h2>
      <div class="gnav">
        <button type="button" id="gantt-prev" aria-label="Previous month"><svg viewBox="0 0 10 18"><path d="M8.5 1.5 1.5 9l7 7.5"/></svg></button>

"status": "planned"}], "fleet": [{"id": "orion", "name": "Orion", "role": "Orchestrator", "status": "active", "feed": ["Compiled today's briefing 06:00", "Routing 2 blockers to Max", "Watching Sep 27 publish deadline", "Fleet sync: 4 agents reporting"]}, {"id": "quill", "name": "Quill", "role": "Content agent", "status": "active", "feed": ["Drafted 11 posts across 2 brands", "Rewriting hg-003 hook — v2", "HE + DE variants ready for review", "4 posts queued for your sign-off"]}, {"id": "sage", "name": "Sage", "role": "Organic growth", "status": "active", "feed": ["Best CMTM slot: Sun 09:00", "IG hashtag sets refreshed", "LinkedIn pillar mapped (P2)", "Slotting week 2 calendar"]}, {"id": "nova", "name": "Nova", "role": "Ideas & trends", "status": "active", "feed": ["3 new recommendations queued", "Trend scan: reserve-duty chatter ↑", "Native gap found: short-form video", "Watching 6 content pillars"]}, {"id": "atlas", "name": "Atlas", "role": "Paid ads", "status": "standby", "feed": ["Waiting on Meta connection", "CMTM audience drafts ready", "CBD policy: organic-first for HG"]}, {"id": "echo", "name": "Echo", "role": "Analytics", "status": "standby", "feed": ["Activates with first published week", "Baselines set: reach · saves · leads"]}]}</script>
<script>
const API = "/otto-api";
let LIVE = false, DATA = null;
const $ = id => document.getElementById(id);

/* ================= formatting ================= */
const PLAT_FULL = {ig:"Instagram", fb:"Facebook", li:"LinkedIn"};
const ICON = {
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r="1" fill="currentColor" stroke="none"/></svg>',
  fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.4 21v-7.6h2.5l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.2 0-3.7 1.3-3.7 3.8v2.3H8v3h2.5V21z"/></svg>',
  li:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.9 9.5H4.2V20h2.7zM5.5 4a1.6 1.6 0 1 0 0 3.2A1.6 1.6 0 0 0 5.5 4zM20 14.1c0-2.9-1.5-4.8-4-4.8-1.3 0-2.3.6-2.8 1.5V9.5h-2.6V20h2.7v-5.4c0-1.3.6-2.3 1.9-2.3 1.2 0 1.8.9 1.8 2.3V20H20z"/></svg>',
  ad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l6 4V6l-6 4z"/><path d="M16.5 9.5a3.5 3.5 0 0 1 0 5"/></svg>',
  photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 3.5 3 3-2.5L20 17"/></svg>'
};
const CHEV = '<svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>';
const esc = t => String(t??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const dayMon = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fmtWhen = s => { const d = new Date(s); return isNaN(d) ? "" : dayMon(d) + " " + hhmm(d); };
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
const H = p => p.hook_en || p.hook || "";          // English display copy when the client content is in another language
const C = p => p.caption_en || p.caption || H(p);
const plat = p => PLAT_FULL[p] || cap1(String(p||""));
const tile = p => `<span class="tile" title="${esc(plat(p))}">${ICON[p] || esc(String(p||"").slice(0,2))}</span>`;
const bySlot = (a,b) => (a.slot||"") < (b.slot||"") ? -1 : 1;
const pendingOf = d => (d.posts||[]).filter(p=>p.status==="pending_approval").sort(bySlot);
const NUMW = ["No","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];

const STATUS = {pending_approval:["Needs approval","need"], failed:["Failed","fail"], approved:["Scheduled",""], scheduled:["Scheduled",""],
  publishing:["Publishing",""], published:["Published",""], draft:["Draft",""], skipped:["Skipped",""], live:["Live",""], paused:["Paused",""], ended:["Ended",""]};
function pill(status){
  const [t,c] = STATUS[status] || [cap1(String(status||"").replace(/_/g," ")), ""];
  return `<span class="pill ${c}">${esc(t)}</span>`;
}
function thumb(p){
  return p.image
    ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy" onerror="thumbFail(this)">`
    : `<span class="thumb">${ICON.photo}</span>`;
}
function thumbFail(img){ const s = document.createElement("span"); s.className = "thumb"; s.innerHTML = ICON.photo; img.replaceWith(s); }

/* Client-facing filter: internal strategy notes never reach the owner's screen. */
const INTERNAL = /\b(native|mcp|openclaw|pricing|otto|phase|leonardo|video_generate|pilot)\b|€/i;
const QUEUE_DUP = /\bapprove\b.*\bposts?\b|\breview (the )?queue\b|waiting for (your )?review/i;
function pickRec(d){
  const recs = (d.recommendations||[]).filter(r=>r.status!=="dismissed" && r.status!=="done")
    .filter(r=>!INTERNAL.test([r.title,r.why,r.impact,r.cta].join(" ")))
    .filter(r=>!QUEUE_DUP.test([r.title,r.cta].join(" ")));
  const rank = p => ({P0:0,P1:1,P2:2}[p] ?? 3);
  return recs.sort((a,b)=>rank(a.priority)-rank(b.priority))[0] || null;
}

let toastT;
function toast(msg, err){
  const el = $("toast");
  el.textContent = msg;
  el.classList.toggle("err", !!err);
  el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove("show"), 2600);
}

async function act(kind, id, status, btn){
  if(!LIVE){ toast("Preview only. Open the live dashboard to act."); return; }
  const box = btn.closest(".rec");
  box.querySelectorAll(".tbtn").forEach(b=>b.classList.add("busy"));
  try{
    const r = await fetch(API + "/action", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({kind, id, status})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || r.status);
    DATA = j.data;
    render(DATA);
    toast({approved:"Approved", skipped:"Skipped", done:"Done", dismissed:"Dismissed"}[status] || cap1(status));
  }catch(e){
    box.querySelectorAll(".tbtn").forEach(b=>b.classList.remove("busy"));
    toast("Couldn't save: " + e.message, true);
  }
}

/* ================= render ================= */
function render(d){
  const posts = d.posts||[], brands = d.brands||[];
  const pendingPosts = pendingOf(d), pending = pendingPosts.length;
  const now = new Date();

  // banners
  const metaOff = (d.connections||[]).some(c=>/instagram|facebook|meta/i.test(c.service||"") && c.status!=="connected");
  $("setup-banner").hidden = !metaOff;
  const failed = posts.filter(p=>p.status==="failed");
  $("fail-banner").hidden = !failed.length;
  $("fail-banner").querySelector(".bt").textContent = failed.length===1
    ? `A post failed to publish: “${H(failed[0])}”` : `${failed.length} posts failed to publish.`;

  // today
  $("brief-date").textContent = now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  $("status").textContent = pending
    ? `${NUMW[pending]||pending} post${pending===1?"":"s"} need${pending===1?"s":""} your approval.`
    : "Nothing needs your approval today.";
  const cta = $("review-cta");
  cta.hidden = !pending;
  cta.textContent = `Review ${pending} post${pending===1?"":"s"}`;
  const scheduled = posts.filter(p=>p.status==="scheduled"||p.status==="approved").length;
  const published = posts.filter(p=>p.status==="published").length;
  const reach = d.growth ? Object.values(d.growth).reduce((a,x)=>a+(((x.months||{})[x.current]||{}).reach||0),0) : 0;
  $("stats").innerHTML = [[scheduled,"Scheduled"],[published,"Published"],
      reach ? [fmtN(reach),"Reach this month"] : [brands.length, brands.length===1?"Brand":"Brands"]]
    .map(([n,l])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  // badges
  $("nav-badge").hidden = !pending; $("nav-badge").textContent = pending;
  $("side-badge").hidden = !pending; $("side-badge").textContent = pending;

  // needs you: queue rows + at most one recommendation
  $("queue").innerHTML = pending
    ? `<div class="list q">${pendingPosts.map((p,i)=>{
        const late = new Date(p.slot) < now;
        const meta = late ? `<span class="m late">Overdue · was ${fmtWhen(p.slot)}</span>`
                          : `<span class="m">${plat(p.platform)} · ${fmtWhen(p.slot)}</span>`;
        return `<button type="button" class="row" onclick="openReviewer(${i})">${thumb(p)}<span class="rt"><span class="t" dir="auto">${esc(H(p))}</span>${meta}</span>${CHEV}</button>`;
      }).join("")}</div>`
    : `<div class="list"><div class="empty">You're all caught up.</div></div>`;
  const r = pickRec(d);
  $("rec").innerHTML = r ? `
    <div class="rec">
      <div class="rec-t"><div class="rec-title">${esc(r.title)}</div>${r.why?`<div class="rec-why">${esc(String(r.why).split(/(?<=[.!?])\s/)[0])}</div>`:""}</div>
      <div class="rec-act">
        <button type="button" class="tbtn quiet" onclick="act('rec','${esc(r.id)}','dismissed',this)">Not now</button>
        <button type="button" class="tbtn" onclick="act('rec','${esc(r.id)}','done',this)">${esc(r.cta||"Review")}</button>
      </div>
    </div>` : "";

  renderPlan(d);
  renderPosts(d);
  renderGrowth(d);
  renderSettings(d);

  const g = d.generated ? new Date(d.generated) : null;
  $("gen").textContent = g && !isNaN(g)
    ? "Updated " + (g.toDateString()===now.toDateString() ? hhmm(g) : dayMon(g) + ", " + hhmm(g)) : "";
}

/* ================= posts ================= */
function renderPosts(d){
  const posts = d.posts||[], brands = d.brands||[];
  $("post-count").textContent = posts.length || "";
  $("pipeline").innerHTML = brands.map(b=>{
    const bp = posts.filter(p=>p.brand===b.id).sort(bySlot);
    if(!bp.length) return "";
    return `<div class="bgroup">
      <div class="bhead"><span class="bn">${esc(b.name)}</span><span class="bu">${esc(b.url||"")}</span></div>
      <div class="list p">${bp.map(p=>`<div class="row">${tile(p.platform)}
        <span class="rt"><span class="t" dir="auto">${esc(H(p)) || '<span class="ph">Copy in progress</span>'}</span>
        <span class="m">${fmtWhen(p.slot)}${p.pillar?" · "+esc(p.pillar):""}${p.format&&p.format!=="post"?" · "+esc(cap1(p.format)):""}</span></span>
        ${pill(p.status)}</div>`).join("")}</div>
    </div>`;
  }).join("") || `<div class="list"><div class="empty">No posts yet.</div></div>`;
}

/* ================= settings: connections, paid, signals, activity ================= */
const group = (title, rows) => rows ? `<h3 class="sub-h">${title}</h3><div class="list">${rows}</div>` : "";
const line = (label, sub, value, small) => `<div class="row"><span class="rt"><span class="t one" dir="auto">${label}</span>${sub?`<span class="m">${sub}</span>`:""}</span>${value!=null&&value!==""?`<span class="val${small?" s":""}">${value}</span>`:""}</div>`;
const JOB_ORDER = ["Planning","Writing","Scheduling","Ideas","Ads","Analytics"];
const JOB_BY_ID = {orion:"Planning", quill:"Writing", sage:"Scheduling", nova:"Ideas", atlas:"Ads", echo:"Analytics"};
const JOB_BY_ROLE = [[/orchestr|plan/i,"Planning"],[/content|writ|copy/i,"Writing"],[/organic|schedul|publish/i,"Scheduling"],[/idea|trend/i,"Ideas"],[/paid|\bads?\b/i,"Ads"],[/analytic|report/i,"Analytics"]];
const JOB_DEFAULT = {Planning:"Keeps the month on schedule", Writing:"Writes and rewrites posts", Scheduling:"Slots posts into the best hours",
  Ideas:"Turns trends into post ideas", Ads:"Waiting for an ad account", Analytics:"Starts with the first published week"};
const PERSONA = /\b(orion|quill|sage|nova|atlas|echo)\b|\b[a-z]{2}-\d{3}\b|native|mcp|openclaw/i;
function jobOf(a){
  if(JOB_BY_ID[a.id]) return JOB_BY_ID[a.id];
  const hit = JOB_BY_ROLE.find(([re])=>re.test(a.role||""));
  return hit ? hit[1] : null;
}
function renderSettings(d){
  const brands = d.brands||[];
  const bn = id => (brands.find(b=>b.id===id)||{}).name || id;
  let html = "";

  const conns = d.connections||[];
  const CONN = {connected:"Connected", not_connected:"Not connected", planned:"Planned"};
  html += group("Connections", conns.map(c=>line(esc(c.service), esc(c.brand), esc(CONN[c.status]||cap1(String(c.status||"").replace(/_/g," "))), true)).join(""));

  // paid (otto_ads.py report writes ads[brand].daily; campaigns[] from otto_ads.py plan/launch)
  const ads = d.ads||{}, camps = d.campaigns||[];
  if(Object.keys(ads).length || camps.length){
    html += group("Paid", brands.filter(b=>ads[b.id] || camps.some(c=>c.brand===b.id)).map(b=>{
      const a = ads[b.id]||{}, days = Object.keys(a.daily||{}).sort(), last = days.length ? a.daily[days[days.length-1]] : null;
      const y = net => last && last[net] ? last[net].yesterday : null;
      const m = y("meta"), g = y("google"), cur = (a.targets||{}).currency || "€";
      const cnt = s => camps.filter(c=>c.brand===b.id && c.status===s).length;
      const conn = a.connections||{};
      const net = (name, v, unit, on) => v
        ? line(`${name}, yesterday`, "", `${cur}${Math.round(v.spend)} · ${Math.round(v.results)} ${unit} · ${v.cpl!=null?cur+v.cpl+" each":"no cost data"}`, true)
        : line(name, "", on ? "Connected" : "Not connected", true);
      const held = camps.filter(c=>c.brand===b.id && c.compliance_hold).length;
      const counts = [cnt("live")+" live", cnt("approved")+" scheduled", cnt("draft")?cnt("draft")+" draft":"", held?held+" on hold for copy review":""].filter(Boolean).join(" · ");
      return line(`<b style="font-weight:600">${esc(b.name)}</b>`, "", counts, true) + net("Meta ads", m, "leads or purchases", conn.meta) + net("Google Ads", g, "conversions", conn.google);
    }).join(""));
  }

  // signals: what the owner's decisions taught Otto + competitor sweep
  const tl = d.taste_log||[], cw = d.competitors||{};
  if(tl.length || Object.keys(cw).length){
    const agg = {};
    tl.forEach(t=>{ const k = t.pillar||"Other"; agg[k] = agg[k]||{a:0,s:0}; if(t.decision==="approve") agg[k].a++; if(t.decision==="skip") agg[k].s++; });
    const taste = Object.entries(agg).map(([k,v])=>({k,a:v.a,s:v.s,net:v.a-v.s})).sort((x,y)=>y.net-x.net).slice(0,5)
      .map(r=>line(esc(r.k), "", `${r.a} approved · ${r.s} skipped`, true)).join("");
    const comp = Object.entries(cw).map(([b,c])=>{
      const items = (c.items||[]).slice(0,4).map(it=>esc(it.name) + (it.error ? " (unreachable)" : (it.promos||[]).length ? ` (${esc(it.promos.slice(0,2).join(", "))})` : "")).join(", ");
      const when = c.last_sweep ? (isNaN(new Date(c.last_sweep)) ? esc(c.last_sweep) : dayMon(new Date(c.last_sweep))) : "";
      return line(`Competitors · ${esc(bn(b))}`, [items, when?"Checked "+when:""].filter(Boolean).join(" · "), `${c.changes||0} change${c.changes===1?"":"s"}`, true);
    }).join("");
    html += group("Signals", taste + comp);
  }

  // activity: one static line per job
  const rows = (d.fleet||[]).map(a=>({job:jobOf(a), a})).filter(x=>x.job)
    .sort((x,y)=>JOB_ORDER.indexOf(x.job)-JOB_ORDER.indexOf(y.job))
    .map(({job,a})=>{
      const l = (a.feed||[]).find(t=>t && !PERSONA.test(t)) || JOB_DEFAULT[job];
      return line(job, esc(l));
    }).join("");
  html += group("Activity", rows);

  $("settings-body").innerHTML = html || `<div class="list"><div class="empty">Nothing to set up.</div></div>`;
}

/* ================= growth ================= */
const fmtN = n => n==null ? "—" : (Math.abs(n)>=10000 ? (n/1000).toFixed(1)+"k" : Number(n).toLocaleString("en-GB"));
function delta(v, kind){                      // kind: pct | abs | inv (lower is better)
  if(v==null) return `<span class="dl">No prior month</span>`;
  if(v===0) return `<span class="dl">No change</span>`;
  const pct = Math.abs(v).toFixed(0) + "%";
  const txt = kind==="inv" ? pct + (v>0 ? " lower" : " higher")        // otto_growth already inverts cpl sign (positive = improvement)
            : kind==="abs" ? (v>0?"+":"−") + fmtN(Math.abs(v)) : (v>0?"+":"−") + pct;
  return `<span class="dl ${v>0?"up":"dn"}">${txt}</span>`;
}
function sparkline(series, key, startDate){
  const pts = series.filter(x=>x[key]!=null);
  if(pts.length < 2) return "";
  const W=320, Hh=56, max=Math.max(...pts.map(x=>x[key]))||1;
  const xy = pts.map((x,i)=>[ (i/(pts.length-1))*W, Hh-4-(x[key]/max)*(Hh-10) ]);
  const ln = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = ln + ` L${W},${Hh} L0,${Hh} Z`;
  let start = "";
  if(startDate){ const i = pts.findIndex(x=>x.dt>=startDate); if(i>0){ const x=(i/(pts.length-1))*W; start=`<line class="st" x1="${x}" y1="0" x2="${x}" y2="${Hh}"/>`; } }
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true"><path class="ar" d="${area}"/><path class="ln" d="${ln}"/>${start}</svg>`;
}
function renderGrowth(d){
  const g = d.growth||{}, brands = d.brands||[];
  const ids = Object.keys(g);
  const hasData = id => { const x = g[id], c = (x.months||{})[x.current]||{}, p = (x.months||{})[x.previous]||{}; return (c.posts||p.posts||c.spend||p.spend||c.reach||p.reach); };
  const live = ids.filter(hasData), quiet = ids.filter(id=>!hasData(id));
  $("growth-sec").hidden = !live.length;
  if(!live.length){ $("growth").innerHTML = ""; return; }
  const mon = (ym, style) => new Date(ym+"-01").toLocaleDateString("en-GB",{month:style});
  $("growth-month").textContent = mon(g[live[0]].current,"long") + " vs " + mon(g[live[0]].previous,"long");
  const bname = id => (brands.find(z=>z.id===id)||{name:id}).name;
  $("growth").innerHTML = live.map(id=>{
    const x = g[id], c = x.months[x.current]||{}, m = x.mom||{}, cur = "€";
    const daily = x.daily||[];
    return `<div class="gcard">
      <div class="gh"><span class="bn">${esc(bname(id))}</span><span class="since">${x.started?"Since "+dayMon(new Date(x.started)):"No published posts yet"}</span>${x.best_pillar?`<span class="best">Best pillar: ${esc(x.best_pillar)}</span>`:""}</div>
      <div class="gkpis">
        <div class="gk"><div class="n">${fmtN(c.reach)}</div><div class="l">Reach</div>${delta(m.reach,"pct")}</div>
        <div class="gk"><div class="n">${fmtN(c.engagement)}</div><div class="l">Engagement</div>${delta(m.engagement,"pct")}</div>
        <div class="gk"><div class="n">${fmtN(c.posts)}</div><div class="l">Posts published</div>${delta(m.posts,"abs")}</div>
        <div class="gk"><div class="n">${fmtN(c.followers)}</div><div class="l">Followers</div>${delta(m.followers,"abs")}</div>
        <div class="gk"><div class="n">${cur}${fmtN(Math.round(c.spend||0))}</div><div class="l">Paid spend</div>${delta(m.spend,"pct")}</div>
        <div class="gk"><div class="n">${fmtN(Math.round(c.results||0))}</div><div class="l">Leads and sales</div>${delta(m.results,"pct")}</div>
        <div class="gk"><div class="n">${c.cpl!=null?cur+c.cpl:"—"}</div><div class="l">Cost per result</div>${delta(m.cpl,"inv")}</div>
        <div class="gk"><div class="n">${fmtN(c.decisions)}</div><div class="l">Your decisions</div>${delta(m.decisions,"abs")}</div>
      </div>
      ${sparkline(daily, "reach7", x.started) || sparkline(daily, "spend", x.started)}
      <div class="gfoot"><span>${daily.some(z=>z.reach7!=null)?"7-day reach, last 90 days":"Paid spend per day"}</span>${x.started?"<span>Dashed line: first week with Otto</span>":""}<span>${x.updated_at&&!isNaN(new Date(x.updated_at))?"Updated "+dayMon(new Date(x.updated_at)):""}</span></div>
    </div>`;
  }).join("") + (quiet.length ? `<p class="note">${quiet.map(id=>esc(bname(id))).join(" and ")}: growth starts with the first published week.</p>` : "");
}

/* ================= review sheet ================= */
let RV = {deck:[], idx:0, open:false, results:{}, busy:false};
function rvImgFail(img){ const t = document.createElement("div"); t.className = "rv-txt"; t.dir = "auto"; t.textContent = img.dataset.alt || ""; img.replaceWith(t); }
function rvCardHTML(p){
  const b = (DATA.brands||[]).find(x=>x.id===p.brand)||{};
  const name = b.name || p.brand || "";
  const media = p.image
    ? `<img src="${esc(p.image)}" alt="" draggable="false" data-alt="${esc(H(p))}" onerror="rvImgFail(this)">`
    : `<div class="rv-txt" dir="auto">${esc(H(p))}</div>`;
  return `<article class="rv-card" data-id="${esc(p.id)}">
    <header class="rv-head"><span class="rv-av" aria-hidden="true">${esc(name.charAt(0))}</span>
      <span class="rt"><span class="t one">${esc(name)}</span><span class="m">${plat(p.platform)} · ${fmtWhen(p.slot)}</span></span>${tile(p.platform)}</header>
    <div class="rv-media">${media}</div>
    <div class="rv-body"><p class="rv-cap" dir="auto">${esc(C(p))}</p>${p.pillar?`<p class="rv-meta">${esc(p.pillar)}</p>`:""}</div>
  </article>`;
}
function rvButtons(on){ ["rv-ok","rv-skip","rv-later"].forEach(id=>$(id).disabled = !on); }
function rvRender(){
  const stage = $("rv-stage");
  const p = RV.deck[RV.idx];
  if(!p){
    const vals = Object.values(RV.results), a = vals.filter(v=>v==="approved").length, s = vals.filter(v=>v==="skipped").length;
    stage.innerHTML = `<div class="rv-empty"><p class="big">All reviewed</p><p class="sub">${LIVE ? `${a} approved, ${s} skipped.` : "Nothing was saved in preview."}</p></div>`;
    $("rv-prog").textContent = "";
    rvButtons(false);
    setTimeout(()=>{ if(RV.open && !RV.deck[RV.idx]) closeReviewer(); }, 1600);
    return;
  }
  stage.innerHTML = rvCardHTML(p);
  $("rv-prog").textContent = `${RV.idx+1} of ${RV.deck.length}`;
  rvButtons(true);
  attachDrag(stage.querySelector(".rv-card"));
}
function openReviewer(startIdx){
  RV.deck = pendingOf(DATA);
  if(!RV.deck.length) return;
  if(startIdx) RV.deck = RV.deck.slice(startIdx).concat(RV.deck.slice(0,startIdx));
  RV.idx = 0; RV.results = {}; RV.open = true; RV.busy = false;
  $("reviewer").classList.add("open");
  document.body.style.overflow = "hidden";
  rvRender();
  document.querySelector(".sheet").focus({preventScroll:true});
}
function closeReviewer(){
  RV.open = false;
  $("reviewer").classList.remove("open");
  document.body.style.overflow = "";
  if(DATA) render(DATA);
}
async function rvDecide(status){
  const p = RV.deck[RV.idx];
  if(!p || RV.busy) return;
  RV.busy = true;
  const card = document.querySelector("#rv-stage .rv-card");
  if(card){
    card.classList.remove("snap"); card.classList.add("fly");
    const dir = status==="approved" ? 1 : status==="skipped" ? -1 : 0;
    card.style.transform = dir ? `translateX(${dir*110}%)` : "translateY(24px)";
    card.style.opacity = "0";
  }
  if(status!=="later"){
    if(!LIVE){ toast("Preview only. Open the live dashboard to approve."); }
    else try{
      const r = await fetch(API + "/action", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({kind:"post", id:p.id, status})});
      const j = await r.json();
      if(!r.ok) throw new Error(j.error || r.status);
      DATA = j.data;
      RV.results[p.id] = status;
      toast(status==="approved" ? "Approved" : "Skipped");
    }catch(e){ toast("Couldn't save: " + e.message, true); }
  }
  setTimeout(()=>{ RV.busy = false; RV.idx++; if(!RV.open) return; rvRender(); render(DATA); }, 260);
}
function attachDrag(card){
  if(!card) return;
  let sx = 0, dx = 0, dragging = false;
  card.addEventListener("pointerdown", e=>{
    if(e.target.closest(".rv-body")) return;   // let the caption scroll
    dragging = true; sx = e.clientX; dx = 0;
    card.classList.remove("snap","fly");
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove", e=>{
    if(!dragging) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px)`;
  });
  const end = ()=>{
    if(!dragging) return; dragging = false;
    if(dx > 96) rvDecide("approved");
    else if(dx < -96) rvDecide("skipped");
    else { card.classList.add("snap"); card.style.transform = ""; }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("lostpointercapture", end);
}
$("rv-close").onclick = closeReviewer;
$("rv-ok").onclick = ()=>rvDecide("approved");
$("rv-skip").onclick = ()=>rvDecide("skipped");
$("rv-later").onclick = ()=>rvDecide("later");
$("reviewer").addEventListener("click", e=>{ if(e.target.id==="reviewer") closeReviewer(); });
$("review-cta").onclick = ()=>openReviewer(0);
addEventListener("keydown", e=>{
  if(!RV.open) return;
  if(e.key==="Escape") closeReviewer();
  if(e.key==="ArrowRight") rvDecide("approved");
  if(e.key==="ArrowLeft") rvDecide("skipped");
  if(e.key==="ArrowDown"){ e.preventDefault(); rvDecide("later"); }
});

/* ================= month calendar ================= */
let planMonth = null, selDay = null;
const FLIGHT_OK = ["approved","live","paused","ended"];
const isoOf = (y,m,day) => `${y}-${pad(m+1)}-${pad(day)}`;
const postsOn = (y,m,day) => (DATA.posts||[]).filter(p=>{ const s=new Date(p.slot); return s.getFullYear()===y && s.getMonth()===m && s.getDate()===day; }).sort(bySlot);
const flightsOn = iso => (DATA.campaigns||[]).filter(c=>FLIGHT_OK.includes(c.status) && c.start<=iso && iso<=c.end);
function renderPlan(d){
  const today = new Date();
  if(!planMonth) planMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const y = planMonth.getFullYear(), m = planMonth.getMonth(), days = new Date(y, m+1, 0).getDate();
  const inMonth = today.getFullYear()===y && today.getMonth()===m;
  if(!selDay || selDay.slice(0,7)!==isoOf(y,m,1).slice(0,7)) selDay = isoOf(y, m, inMonth ? today.getDate() : 1);
  $("gantt-month").textContent = planMonth.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  const lead = (new Date(y,m,1).getDay()+6)%7;            // Monday-first
  let grid = "";
  for(let i=0;i<lead;i++) grid += `<span class="gcol off" aria-hidden="true"></span>`;
  for(let day=1; day<=days; day++){
    const iso = isoOf(y,m,day), dp = postsOn(y,m,day), fl = flightsOn(iso);
    const need = dp.some(p=>p.status==="pending_approval");
    const isToday = inMonth && today.getDate()===day;
    const label = new Date(y,m,day).toLocaleDateString("en-GB",{day:"numeric",month:"long"}) +
      (dp.length ? `, ${dp.length} post${dp.length===1?"":"s"}` : "") + (fl.length ? `, ${fl.length} campaign${fl.length===1?"":"s"}` : "");
    grid += `<button type="button" class="gcol${isToday?" today":""}${selDay===iso?" sel":""}" data-day="${day}" aria-label="${label}" aria-pressed="${selDay===iso}">
      <span class="gn">${day}</span><span class="gmk">${dp.length?`<i class="gdot${need?" need":""}"></i>`:""}${fl.length?`<i class="gbar"></i>`:""}</span></button>`;
  }
  $("gantt-grid").innerHTML = grid;
  showDay(+selDay.slice(8));
}
function showDay(day){
  const y = planMonth.getFullYear(), m = planMonth.getMonth(), iso = isoOf(y,m,day);
  selDay = iso;
  document.querySelectorAll(".gcol[data-day]").forEach(c=>{ const on = c.dataset.day==String(day); c.classList.toggle("sel", on); c.setAttribute("aria-pressed", on); });
  const dp = postsOn(y,m,day), camps = flightsOn(iso);
  const bn = id => ((DATA.brands||[]).find(b=>b.id===id)||{}).name || id;
  const pend = pendingOf(DATA).map(p=>p.id);
  const head = `<div class="ag-h">${new Date(y,m,day).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>`;
  const rows = dp.map(p=>{
    const inner = `<span class="ag-t" dir="auto">${esc(H(p)) || "Slot reserved"}</span>${pill(p.status)}
      <span class="ag-m">${esc(bn(p.brand))} · ${hhmm(new Date(p.slot))} · ${plat(p.platform)}${p.format&&p.format!=="post"?" · "+esc(cap1(p.format)):""}</span>`;
    const i = pend.indexOf(p.id);
    return i>=0 ? `<button type="button" class="ag" onclick="openReviewer(${i})">${inner}</button>` : `<div class="ag">${inner}</div>`;
  }).join("") + camps.map(c=>`<div class="ag"><span class="ag-t">${esc(c.name)}</span>${pill(c.status)}
      <span class="ag-m">${c.network==="google"?"Google Ads":"Meta ads"} · ${esc(c.currency||"€")}${esc(c.daily_budget)} a day</span></div>`).join("");
  $("gday-detail").innerHTML = head + (rows || `<div class="ag-empty">Nothing scheduled.</div>`);
}
$("gantt-grid").addEventListener("click", e=>{ const b = e.target.closest(".gcol[data-day]"); if(b) showDay(+b.dataset.day); });
$("gantt-prev").onclick = ()=>{ planMonth = new Date(planMonth.getFullYear(), planMonth.getMonth()-1, 1); selDay = null; renderPlan(DATA); };
$("gantt-next").onclick = ()=>{ planMonth = new Date(planMonth.getFullYear(), planMonth.getMonth()+1, 1); selDay = null; renderPlan(DATA); };

/* ================= navigation state ================= */
const secIds = ["top","queue-sec","plan-sec","pipeline-sec","settings"];
const navLinks = [...document.querySelectorAll("[data-sec]")];
function onScroll(){
  let cur = "top";
  for(const id of secIds){
    const el = $(id);
    if(el && el.getBoundingClientRect().top < innerHeight*0.35) cur = id;
  }
  if(innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = secIds[secIds.length-1];
  navLinks.forEach(a=>a.classList.toggle("on", a.dataset.sec===cur));
  $("appbar").classList.toggle("scrolled", scrollY > 4);
}
addEventListener("scroll", onScroll, {passive:true});

/* ================= data boot: live API -> local snapshot -> embedded fallback ================= */
function setMode(live){
  LIVE = live;
  document.querySelectorAll(".mode").forEach(el=>el.hidden = live);
}
function boot(d, live){ DATA = d; setMode(live); render(d); onScroll(); }
fetch(API + "/data").then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>boot(d, true))
  .catch(()=> fetch("data.json").then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(d=>boot(d, false))
    .catch(()=>{
      try{ boot(JSON.parse($("fallback-data").textContent), false); }
      catch(e){ document.querySelector(".wrap").insertAdjacentHTML("afterbegin","<p class='empty'>No data available.</p>"); }
    }));
// gentle auto-refresh when live (phone left open)
setInterval(()=>{ if(LIVE && !document.hidden && !RV.open)
  fetch(API+"/data").then(r=>r.json()).then(d=>{ DATA=d; render(d); }).catch(()=>{}); }, 60000);
</script>
