<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" class="{{html_class}}">
<head><meta charset="utf-8">
<!-- founder_note: a short letter from the founder or team. True story only (ask the owner).
     data: body* (paragraphs separated by a blank line), name*, role, headline, kicker, portrait, portrait_pos,
           theme: light (default) | dark, cta, tag -->
{{&_head}}
<style>
.box>.kicker{margin-top:0}
.headline{font-size:calc(84px*var(--k));margin-top:24px;line-height:1;letter-spacing:-.02em}
html[dir=rtl] .headline{font-family:var(--f-display);font-weight:var(--w-display);line-height:1.08;letter-spacing:-.01em;font-size:calc(76px*var(--k))}
.letter{margin-top:48px;font:400 calc(44px*var(--k))/1.24 var(--f-serif);letter-spacing:-.004em;text-wrap:pretty;max-width:900px}
html[dir=rtl] .letter{font-size:calc(40px*var(--k));line-height:1.5;letter-spacing:0;font-weight:400}

.sign{display:flex;align-items:center;gap:26px;margin-top:56px;padding-top:34px;border-top:2px solid var(--rule)}
.t-dark .sign{border-color:rgba(255,255,255,.18)}
.portrait{width:calc(104px*var(--k));height:calc(104px*var(--k));border-radius:50%;overflow:hidden;flex:none}
.portrait img{width:100%;height:100%;object-fit:cover}
.sig{font:italic var(--w-serif) calc(50px*var(--k))/1 var(--f-serif);letter-spacing:-.01em}
html[dir=rtl] .sig{font-style:normal;font-weight:700;font-size:calc(44px*var(--k))}
.role{font:500 calc(21px*var(--k))/1.3 var(--f-text);margin-top:10px}
html[dir=rtl] .role{font-size:calc(24px*var(--k))}
.edge{position:absolute;inset-block:0;inset-inline-start:0;width:14px;background:var(--accent);z-index:2}
</style>
</head>
<body>
<div class="ad t-{{#if theme}}{{theme}}{{else}}light{{/if}}">
  <div class="edge"></div>
  <div class="frame">
    {{> top}}
    <div class="box" data-box>
      <div class="push"></div>
      {{#if kicker}}<div class="kicker"><span>{{kicker}}</span></div>{{/if}}
      {{#if headline}}<h1 class="serif headline" data-fit="1" data-min="44" data-lines="2">{{headline}}</h1>{{/if}}
      <div class="letter" data-fit="2" data-min="22">{{body}}</div>
      <div class="sign">
        {{#if portrait}}<div class="portrait"><img src="{{portrait}}" style="object-position:{{portrait_pos}}" alt=""></div>{{/if}}
        <div><div class="sig">{{name}}</div>{{#if role}}<div class="role muted">{{role}}</div>{{/if}}</div>
      </div>
      <div class="push"></div>
    </div>
    {{#if cta}}{{> foot}}{{/if}}
  </div>
</div>
{{&_foot}}
</body>
</html>
